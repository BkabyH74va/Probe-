              size_t outw = 0, outfirst = (size_t)-1;
              for (size_t k = 0; k < sizeof(sb) && k < 512; k++) if (sb[k] != AAM) { outw++; if (outfirst == (size_t)-1) outfirst = k; }
              NSMutableString* extra = [NSMutableString string];
              if (outw) [extra appendFormat:@" ow%zu of0x%zx", outw, outfirst];
              for (size_t k = 0; k < SCO && k < sc; k++) if (so[k]) [extra appendFormat:@" so%zu=0x%llx", k, (unsigned long long)so[k]];
              plog(@"X %s n%d s%u sic%u m%d a0%d zoc%zu zos%zu zis%zu -> %@ sc%zu szb%zu%@",
                   tag, g_node[ci], sel, sic, mode, a0, zoc, zos, zis, kr_name(kr), sc, szb, extra);
              if (kr != 0xe00002c2) {
                  ulog(@"X %s n%d s%u sic%u m%d zoc%zu zos%zu zis%zu -> %@ sc%zu szb%zu%@",
                       tag, g_node[ci], sel, sic, mode, zoc, zos, zis, kr_name(kr), sc, szb, extra);
                  __sync_fetch_and_add(&g_ssw_hit, 1);
