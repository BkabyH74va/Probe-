          static kern_return_t sc1(int ci, uint32_t sel, uint32_t sic, int mode, size_t zis, const char* tag) {
              uint64_t sin[SCO] = {0};
              for (uint32_t k = 0; k < SCO; k++) sin[k] = SV[k % SV_N];
              inject(sin, sic);
              uint8_t* in = NULL;
              if (mode == 1) {
                  in = calloc(1, zis ? zis : 1);
                  if (!in) return (kern_return_t)0xe00002bd;
                  memset(in, PAT, zis);
                  desc_into(in, zis);
              }
              uint64_t so[SCO] = {0}; size_t sc = 0;
              uint8_t sb[BIGOUT]; size_t szb = BIGOUT;
              memset(sb, AAM, sizeof(sb));
              kern_return_t kr = rawx(g_conn[ci], sel, mode, sin, sic, in, zis, in ? 1 : 0, so, &sc, sb, &szb);
              __sync_fetch_and_add(&g_spad, 1);
              __sync_fetch_and_add(&g_done, 1);
              int un = 0;
              for (size_t i = 0; i < sizeof(sb); i++) if (sb[i] == AAM) un++;
              plog(@"SP %s n%d s%u m%d sc_=%u zi=%zu sin0=0x%llx -> %@ sc=%zu szb=%zu un=%d so0=%llu %@",
                   tag, g_node[ci], sel, mode, sic, zis, (unsigned long long)sin[0], kr_name(kr), sc, szb, un,
                   (unsigned long long)so[0], hexn(sb, sizeof(sb), BIGOUT));
              if (kr == KERN_SUCCESS) {
                  ulog(@"!!! SP %s s%u m%d sc_=%u zi=%zu OK so0=%llu", tag, sel, mode, sic, zis, (unsigned long long)so[0]);
                  __sync_fetch_and_add(&g_hits, 1);
                  note_ok(sel, (uint32_t)mode, sic, zis, BIGOUT);
              } else if (kr != 0xe00002c2) {
                  ulog(@"!! SP %s s%u m%d sc_=%u zi=%zu -> %@", tag, sel, mode, sic, zis, kr_name(kr));
                  mark_resp(sel);
                  mark_live(sel);
              }
              if (szb > BIGOUT) {
                  __sync_fetch_and_add(&g_oobw, 1);
                  plog(@"OOBW s%u offered=%d driver=%zu", sel, BIGOUT, szb);
              }
              free(in);
              usleep(180);
              return kr;
          }

          static void scpad_conn(int ci, const char* tag) {
              for (uint32_t s = 0; s < SEL_N; s++) {
                  for (int i = 0; i < (int)(sizeof(SICV)/sizeof(SICV[0])); i++) {
                      sc1(ci, s, SICV[i], 0, 0, tag);
                  }
              }
          }

          static void scpad_best(void) {
              if (g_best < 0) { ulog(@"scpad no conn"); return; }
              scpad_conn(g_best, "b");
              ulog(@"scpad-best done spad=%d live=%d resp=%d", g_spad, g_nlive, g_resp[0] + g_resp[2]);
          }

          static void scpad_child(void) {
              int seen = 0;
              for (int ci = 0; ci < g_nconn && seen < 8; ci++) {
                  if (g_node[ci] <= 0) continue;
                  int child = g_node[ci];
                  BOOL first = YES;
                  for (int pj = 0; pj < ci; pj++) if (g_node[pj] == child) { first = NO; break; }
                  if (!first) continue;
                  seen++;
                  scpad_conn(ci, "c");
              }
              ulog(@"scpad-child done n=%d spad=%d live=%d", seen, g_spad, g_nlive);
          }

          static void s9_scalars(void) {
              if (g_best < 0) { ulog(@"s9s no conn"); return; }
              for (uint32_t sic = 0; sic <= 16; sic++) {
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[BIGOUT]; size_t szb = BIGOUT;
                  memset(sb, AAM, sizeof(sb));
                  uint64_t sin[SCO] = {0};
                  for (uint32_t k = 0; k < SCO; k++) sin[k] = SV[k % SV_N];
                  inject(sin, sic);
                  kern_return_t kr = rawv(g_conn[g_best], 9, 0, sin, sic, NULL, 0, so, &sc, sb, &szb);
                  __sync_fetch_and_add(&g_done, 1);
                  plog(@"S9N n%u sin0=0x%llx -> %@ sc=%zu szb=%zu so0=%llu %@", sic, (unsigned long long)sin[0], kr_name(kr), sc, szb, (unsigned long long)so[0], hexn(sb, sizeof(sb), BIGOUT));
                  if (kr != g_9prev) {
                      plog(@"FLIP9N n%u -> %@ (was %@)", sic, kr_name(kr), kr_name(g_9prev));
                      ulog(@"### FLIP9N n%u -> %@", sic, kr_name(kr));
                      g_9prev = kr;
                      __sync_fetch_and_add(&g_s9new, 1);
                      if (kr == KERN_SUCCESS) { __sync_fetch_and_add(&g_ok9, 1); note_ok(9, 0, sic, 0, 0); }
                  }
                  if (kr != 0xe00002c2 && kr != 0xe00002bc) { ulog(@"!! S9N n%u -> %@", sic, kr_name(kr)); mark_resp(9); }
                  usleep(200);
              }
              ulog(@"s9-scalars done new=%d", g_s9new);
