              ulog(@"PK total=%d", g_pn);

              for (int i = 1; i <= g_pn && g_nconn < MAXC; i++) {
                  if (!g_pkid[i]) continue;
                  for (uint32_t t = 0; t <= 8 && g_nconn < MAXC; t++) {
                      io_connect_t c = 0;
