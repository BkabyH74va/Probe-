                  if (szb > zos) { __sync_fetch_and_add(&g_oobsz, 1); plog(@"OOBSZ %s s%u offered=%zu driver=%zu", tag, sel, zos, szb); ulog(@"!!! SZB %s s%u %zu>%zu", tag, sel, szb, zos); }
                  if (so[0]) { __sync_fetch_and_add(&g_s0nz, 1); plog(@"SO0 %s s%u = 0x%llx", tag, sel, (unsigned long long)so[0]); ulog(@"!!! SO0 %s s%u = 0x%llx", tag, sel, (unsigned long long)so[0]); }
                  if (sc) ulog(@"!!! SC %s s%u = %zu", tag, sel, sc);
              }
              free(in);
          }

