              }
              plog(@"PK from-parent=%d", g_pn);
              ulog(@"PK from-parent=%d", g_pn);

              io_iterator_t it = 0; int scanned = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching("IOService"), &it) == KERN_SUCCESS) {
                  io_object_t o;
