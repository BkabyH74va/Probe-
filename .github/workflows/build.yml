name: build
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scaffold
        run: |
          mkdir -p Sources
          cat > project.yml <<'PROJEOF'
          name: probe
          options: { bundleIdPrefix: com.buurza29, deploymentTarget: { iOS: "18.0" } }
          targets:
            probe:
              type: application
              platform: iOS
              sources: [Sources]
              entitlements: { path: probe.entitlements }
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: buurd29
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "29"
                  UILaunchScreen: {}
              settings:
                ARCHS: "arm64"
                SUPPORTED_PLATFORMS: "iphoneos"
                SDKROOT: "iphoneos"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                OTHER_CFLAGS: "-Wno-implicit-function-declaration"
              dependencies:
                - sdk: IOKit.framework
                - sdk: UIKit.framework
                - sdk: VideoToolbox.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
                - sdk: Security.framework
          PROJEOF
          cat > probe.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>get-task-allow</key><true/>
          </dict></plist>
          ENTEOF
          cat > Sources/main.m <<'MAINEOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <VideoToolbox/VideoToolbox.h>
          #import <CoreVideo/CoreVideo.h>
          #import <Security/Security.h>
          #import <mach/mach.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>
          #include <stdarg.h>
          #include <dlfcn.h>

          extern int csops(pid_t pid, unsigned int ops, void* uaddr, size_t usize);

          typedef uint32_t (*fn_surfid)(IOSurfaceRef);

          #define BUILD_TAG "v29-scalarhand"
          #define MAXC 512
          #define STEP_MAX 16
          #define TRY_MAX 2
          #define MAXCHILD 8
          #define TYPE_MAX 7
          #define TMAX 255
          #define FIXED 4096
          #define SEL_N 32
          #define SZ_N 6
          #define SCO 5
          #define SCAL_N 18

          static UITextView* g_tv;
          static UILabel* g_hb;
          static NSMutableArray* g_lines;
          static volatile int g_hits = 0, g_done = 0;
          static volatile int g_step = 0;
          static volatile int g_stop = 0;
          static volatile int g_vt_done = 0;
          static volatile int g_ok4 = 0;
          static volatile int g_ok0 = 0;
          static volatile int g_ok9 = 0;
          static volatile int g_ok5 = 0;
          static int g_try = 0;
          static int g_fd = -1;
          static int g_nchild = 0;
          static int g_root_idx = -1;
          static int g_best = -1;
          static uint32_t g_sid = 0;
          static io_service_t g_root = 0;
          static io_service_t g_child[MAXCHILD + 1];
          static NSMutableSet* g_seen;
          static pthread_mutex_t g_lk = PTHREAD_MUTEX_INITIALIZER;
          static VTCompressionSessionRef g_vt = NULL;
          static CVPixelBufferRef g_surf = NULL;
          static mach_port_t g_wake = MACH_PORT_NULL;

          static io_connect_t g_conn[MAXC];
          static uint32_t g_ctype[MAXC];
          static int g_node[MAXC];
          static int g_nconn = 0;

          static int g_hit_s[SEL_N];
          static size_t g_bsi[SEL_N];
          static size_t g_bso[SEL_N];
          static uint32_t g_bmode[SEL_N];

          static int g_oks[SEL_N];
          static uint32_t g_okm[SEL_N];
          static uint32_t g_oksi[SEL_N];
          static size_t g_okzi[SEL_N];
          static size_t g_okzo[SEL_N];

          static int g_sok[SEL_N];
          static uint32_t g_smode[SEL_N];
          static uint32_t g_sic[SEL_N];
          static uint64_t g_sval[SEL_N];

          static int g_lok[SEL_N];
          static size_t g_loff[SEL_N];
          static size_t g_lw[SEL_N];
          static size_t g_lsz[SEL_N];

          static const size_t SZ[SZ_N] = { 0, 8, 16, 32, 64, 4096 };
          static const size_t OUT3[3] = { 0, 64, 4096 };

          static const uint64_t SCAL[SCAL_N] = {
              0, 1, 2, 3, 4, 5, 8, 16, 32, 64, 128, 256, 367, 1920, 1080,
              0x42475241ULL, 0x1000ULL, 0x2000ULL
          };
          static const size_t LOFF[6] = { 0, 4, 8, 12, 16, 20 };
          static const size_t LSZ[4] = { 24, 32, 64, 4096 };

          static const char* STEP_NAME[STEP_MAX + 1] = {
              "boot", "census", "sig-blob", "dump-tree", "prop-dump", "vt-init",
              "vt-encode", "child-open", "root-open", "ping-sweep", "handshake",
              "arg-probe", "layout-probe", "child-retry", "confirm", "summary", "verdict"
          };

          static void ulog(NSString* fmt, ...) {
              va_list ap; va_start(ap, fmt);
              NSString* s = [[NSString alloc] initWithFormat:fmt arguments:ap];
              va_end(ap);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [g_lines addObject:s];
                  if (g_lines.count > 200) [g_lines removeObjectsInRange:NSMakeRange(0, 40)];
              });
          }
          static void plog(NSString* fmt, ...) {
              if (g_fd < 0) return;
              va_list ap; va_start(ap, fmt);
              NSString* s = [[NSString alloc] initWithFormat:fmt arguments:ap];
              va_end(ap);
              NSData* d = [[s stringByAppendingString:@"\n"] dataUsingEncoding:NSUTF8StringEncoding];
              pthread_mutex_lock(&g_lk);
              write(g_fd, d.bytes, d.length);
              pthread_mutex_unlock(&g_lk);
          }
          static void flush_ui(void) {
              g_tv.text = [g_lines componentsJoinedByString:@"\n"];
              if (g_lines.count) [g_tv scrollRangeToVisible:NSMakeRange(g_tv.text.length, 0)];
          }
          static void bread(const char* tag) {
              plog(@"PRE step=%d %s", g_step, tag);
              if (g_fd >= 0) fsync(g_fd);
          }
          static void sigh(int sig) {
              char b[96];
              int n = snprintf(b, sizeof(b), "SIGNAL %d at step %d (%s)\n", sig, g_step, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);
              if (g_fd >= 0) { write(g_fd, b, n); fsync(g_fd); }
              signal(sig, SIG_DFL);
              raise(sig);
          }
          static NSString* kr_name(kern_return_t kr) {
              switch (kr) {
                  case KERN_SUCCESS: return @"OK";
                  case 0xe00002bc: return @"Error";
                  case 0xe00002bd: return @"NoMem";
                  case 0xe00002be: return @"NoRes";
                  case 0xe00002c1: return @"NotPriv";
                  case 0xe00002c2: return @"BadArg";
                  case 0xe00002c5: return @"Excl";
                  case 0xe00002c7: return @"Unsup";
                  case 0xe00002cc: return @"NotOpen";
                  case 0xe00002d4: return @"Busy";
                  case 0xe00002e2: return @"NotPerm";
                  case 0xdeadbeef: return @"dup";
                  default: return [NSString stringWithFormat:@"0x%x", kr];
              }
          }
          static NSString* hexn(const uint8_t* p, size_t n, size_t cap) {
              if (!n) return @"-";
              if (n > cap) n = cap;
              NSMutableString* s = [NSMutableString string];
              for (size_t i = 0; i < n; i++) [s appendFormat:@"%02x", p[i]];
              return s;
          }
          static NSString* doc_file(const char* f) {
              NSString* d = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              return [d stringByAppendingPathComponent:@(f)];
          }
          static void doc_path(const char* f, char* b, size_t n) {
              NSString* p = doc_file(f);
              strncpy(b, p.UTF8String, n - 1);
              b[n - 1] = 0;
          }
          static int load_step(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("step.txt") encoding:NSUTF8StringEncoding error:nil];
              return s ? s.intValue : 0;
          }
          static void save_step(int v) {
              [[NSString stringWithFormat:@"%d", v] writeToFile:doc_file("step.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_try(void) {
              g_try = 0;
              NSString* s = [NSString stringWithContentsOfFile:doc_file("try.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!s) return;
              NSArray<NSString*>* f = [s componentsSeparatedByString:@":"];
              if (f.count != 2) return;
              NSString* a = f[0];
              NSString* b = f[1];
              if (a.intValue == g_step) g_try = b.intValue;
          }
          static void save_try(void) {
              [[NSString stringWithFormat:@"%d:%d", g_step, g_try] writeToFile:doc_file("try.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void latch_build(void) {
              NSString* bt = [NSString stringWithContentsOfFile:doc_file("build.txt") encoding:NSUTF8StringEncoding error:nil];
              if ([bt isEqualToString:@BUILD_TAG]) return;
              unlink(doc_file("state.txt").UTF8String);
              save_step(0);
              g_try = 0;
              save_try();
              g_root_idx = -1;
              g_best = -1;
              [@BUILD_TAG writeToFile:doc_file("build.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_state(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              for (NSString* ln in [s componentsSeparatedByString:@"\n"]) {
                  if ([ln hasPrefix:@"K "]) [g_seen addObject:[ln substringFromIndex:2]];
              }
          }
          static BOOL seen_key(NSString* k) {
              pthread_mutex_lock(&g_lk);
              BOOL r = [g_seen containsObject:k];
              [g_seen addObject:k];
              pthread_mutex_unlock(&g_lk);
              return r;
          }

          static void note_ok(uint32_t sel, uint32_t mode, uint32_t sic, size_t zis, size_t zos) {
              if (sel >= SEL_N) return;
              g_oks[sel] = 1;
              g_okm[sel] = mode;
              g_oksi[sel] = sic;
              g_okzi[sel] = zis;
              g_okzo[sel] = zos;
              g_hit_s[sel] = 1;
              g_bmode[sel] = mode;
              g_bsi[sel] = zis;
              g_bso[sel] = zos;
          }

          static kern_return_t rawv(io_connect_t c, uint32_t sel, int mode, uint64_t* sin, uint32_t sic,
                                    uint8_t* sinS, size_t zis, uint64_t* sout, size_t* soCnt,
                                    uint8_t* soutS, size_t* soSz) {
              uint32_t sc = soCnt ? (uint32_t)*soCnt : 0;
              size_t szb = soSz ? *soSz : 0;
              kern_return_t kr;
              if (mode == 0) {
                  kr = IOConnectCallScalarMethod(c, sel, sin, sic, sout, &sc);
              } else if (mode == 1) {
                  kr = IOConnectCallMethod(c, sel, sin, sic, zis ? sinS : NULL, zis, sout, &sc, szb ? soutS : NULL, &szb);
              } else {
                  uint64_t ref = 1;
                  kr = IOConnectCallAsyncMethod(c, sel, g_wake, &ref, 1, sin, sic, zis ? sinS : NULL, zis, sout, &sc, szb ? soutS : NULL, &szb);
              }
              if (soCnt) *soCnt = sc;
              if (soSz) *soSz = szb;
              return kr;
          }

          static kern_return_t raw(io_connect_t c, uint32_t sel, int mode,
                                   uint32_t sic, size_t zis, size_t zos,
                                   uint64_t* soOut, size_t* soCnt, uint8_t* soS, size_t* soSz) {
              uint64_t* sin = calloc(SCO, sizeof(uint64_t));
              uint64_t* sout = calloc(SCO, sizeof(uint64_t));
              uint8_t* sinS = calloc(1, FIXED);
              uint8_t* soutS = calloc(1, FIXED);
              if (!sin || !sout || !sinS || !soutS) {
                  free(sin); free(sout); free(sinS); free(soutS);
                  return (kern_return_t)0xe00002bd;
              }
              uint32_t sc = (uint32_t)(soCnt ? *soCnt : 0);
              size_t szb = soSz ? *soSz : 0;
              kern_return_t kr = rawv(c, sel, mode, sin, sic, sinS, zis, sout, &sc, soutS, &szb);
              if (soOut) memcpy(soOut, sout, sizeof(uint64_t) * SCO);
              if (soCnt) *soCnt = sc;
              if (soS && soSz) { memcpy(soS, soutS, szb > FIXED ? FIXED : szb); *soSz = szb; }
              free(sin); free(sout); free(sinS); free(soutS);
              return kr;
          }

          static kern_return_t hb(void) {
              if (g_best < 0 || g_best >= g_nconn) return (kern_return_t)0xe00002cc;
              uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
              return raw(g_conn[g_best], 0, 0, 0, 0, 0, so, &sc, sb, &szb);
          }

          static kern_return_t callm(const char* tag, int ci, uint32_t sel, int mode,
                                     uint32_t sinCnt, size_t sinSz, size_t soutCnt, size_t soutSz) {
              if (ci < 0) ci = 0;
              if (ci >= g_nconn) return (kern_return_t)0xe00002cc;
              uint32_t t = g_ctype[ci];
              int nd = g_node[ci];
              NSString* key = [NSString stringWithFormat:@"%d:%u:%u:m%d:%u:%zu:%zu:%zu:%s", nd, t, sel, mode, sinCnt, sinSz, soutCnt, soutSz, tag];
              if (seen_key(key)) return (kern_return_t)0xdeadbeef;
              plog(@"K %@", key);
              bread(tag);

              uint64_t so[SCO] = {0};
              size_t sc = soutCnt;
              uint8_t sb[FIXED];
              size_t szb = soutSz;
              kern_return_t kr = raw(g_conn[ci], sel, mode, sinCnt, sinSz, soutSz, so, &sc, sb, &szb);
              __sync_fetch_and_add(&g_done, 1);
              if (kr == KERN_SUCCESS) {
                  plog(@"OK %s n%d t%u s%u m%d si=%u/%zu so=%zu/%zu SOUT %llu %@", tag, nd, t, sel, mode, sinCnt, sinSz, sc, szb, (unsigned long long)so[0], hexn(sb, szb, 128));
                  plog(@"WIN s%u m%d sic=%u zis=%zu zos=%zu so0=%llu sc=%zu szb=%zu", sel, mode, sinCnt, sinSz, soutSz, (unsigned long long)so[0], sc, szb);
                  __sync_fetch_and_add(&g_hits, 1);
                  if (sel == 4) __sync_fetch_and_add(&g_ok4, 1);
                  if (sel == 0) __sync_fetch_and_add(&g_ok0, 1);
                  if (sel == 9) __sync_fetch_and_add(&g_ok9, 1);
                  if (sel == 5) __sync_fetch_and_add(&g_ok5, 1);
                  note_ok(sel, (uint32_t)mode, sinCnt, sinSz, soutSz);
                  ulog(@"!!! WIN s%u m%d %u/%zu/%zu so0=%llu", sel, mode, sinCnt, sinSz, soutSz, (unsigned long long)so[0]);
              } else if (kr != 0xe00002c2 && kr != 0xe00002c7 && kr != 0xe00002cc && kr != 0xdeadbeef) {
                  plog(@"%d %u %u m%d si=%u/%zu so=%zu %@ | %s", nd, t, sel, mode, sinCnt, sinSz, soutSz, kr_name(kr), tag);
                  __sync_fetch_and_add(&g_hits, 1);
                  ulog(@"!! %s n%d t%u m%d -> %@", tag, nd, t, mode, kr_name(kr));
                  if (!g_hit_s[sel]) { g_hit_s[sel] = 1; g_bsi[sel] = sinSz; g_bso[sel] = soutSz; g_bmode[sel] = mode; }
              } else {
                  plog(@"%d %u %u m%d si=%u/%zu so=%zu %@ | %s", nd, t, sel, mode, sinCnt, sinSz, soutSz, kr_name(kr), tag);
              }
              usleep(300);
              return kr;
          }

          static uint32_t shape_mode(uint32_t s) {
              if (g_oks[s]) return g_okm[s];
              if (g_hit_s[s]) return g_bmode[s];
              return 1;
          }
          static size_t shape_in(uint32_t s) {
              if (g_oks[s]) return g_okzi[s];
              if (g_hit_s[s]) return g_bsi[s];
              return FIXED;
          }
          static size_t shape_out(uint32_t s) {
              if (g_oks[s]) return g_okzo[s];
              if (g_hit_s[s]) return g_bso[s];
              return FIXED;
          }

          static int find_root(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching("AppleJPEGDriver"), &it) != KERN_SUCCESS) return 0;
              int svc = 0;
              io_service_t s;
              while ((s = IOIteratorNext(it))) {
                  svc++;
                  if (!g_root) g_root = s; else IOObjectRelease(s);
              }
              IOObjectRelease(it);
              return svc;
          }

          static void census(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching("IOService"), &it) != KERN_SUCCESS) {
                  ulog(@"no census"); return;
              }
              NSMutableDictionary* cnt = [NSMutableDictionary dictionary];
              io_object_t o; int n = 0;
              while ((o = IOIteratorNext(it)) && n < 4000) {
                  n++;
                  io_name_t cls; IOObjectGetClass(o, cls);
                  NSString* s = @(cls);
                  if ([s rangeOfString:@"JPEG"].location != NSNotFound || [s rangeOfString:@"jpeg"].location != NSNotFound) {
                      NSNumber* c = cnt[s];
                      cnt[s] = @(c.intValue + 1);
                  }
                  IOObjectRelease(o);
              }
              IOObjectRelease(it);
              for (NSString* k in cnt) {
                  plog(@"JCLS %@ x%d", k, [cnt[k] intValue]);
                  ulog(@"JCLS %@ x%d", k, [cnt[k] intValue]);
              }
              plog(@"census nodes=%d jcls=%lu", n, (unsigned long)cnt.count);
              ulog(@"census=%d jcls=%lu", n, (unsigned long)cnt.count);
          }

          static void dump_sig(void) {
              unsigned int fl = 0;
              int rc = csops(getpid(), 0, &fl, sizeof(fl));
              plog(@"csops rc=%d f=0x%x gta=%d dpl=%d plat=%d", rc, fl, (fl & 4) ? 1 : 0, (fl & 0x2000000) ? 1 : 0, (fl & 0x4000000) ? 1 : 0);
              ulog(@"csops rc=%d f=0x%x", rc, fl);
          }

          static void dump_node(io_object_t o, int node) {
              io_name_t cls; IOObjectGetClass(o, cls);
              plog(@"NODE %d class=%s", node, cls);
              ulog(@"NODE %d %s", node, cls);
          }

          static void dump_tree(void) {
              if (!g_root) { ulog(@"no root"); return; }
              dump_node(g_root, 0);
              io_iterator_t ch = 0;
              if (IORegistryEntryGetChildIterator(g_root, kIOServicePlane, &ch) != KERN_SUCCESS) {
                  ulog(@"no child iter"); return;
              }
              io_object_t c;
              while ((c = IOIteratorNext(ch)) && g_nchild < MAXCHILD) {
                  g_nchild++;
                  g_child[g_nchild] = c;
                  dump_node(c, g_nchild);
              }
              IOObjectRelease(ch);
              plog(@"children=%d", g_nchild);
              ulog(@"children=%d", g_nchild);
          }

          static void dump_props(io_object_t o, int node) {
              CFMutableDictionaryRef props = NULL;
              if (IORegistryEntryCreateCFProperties(o, &props, kCFAllocatorDefault, 0) != KERN_SUCCESS || !props) {
                  plog(@"PROPS %d none", node);
                  return;
              }
              NSDictionary* d = (__bridge NSDictionary*)props;
              for (id k in d) {
                  NSString* ks = [k description];
                  NSString* vs = [d[k] description];
                  if (vs.length > 200) vs = [vs substringToIndex:200];
                  plog(@"PROPS %d %@ = %@", node, ks, vs);
              }
              plog(@"PROPS %d count=%lu", node, (unsigned long)d.count);
              ulog(@"PROPS %d n=%lu", node, (unsigned long)d.count);
              CFRelease(props);
          }

          static void prop_dump(void) {
              if (!g_root) { ulog(@"no root"); return; }
              dump_props(g_root, 0);
              for (int i = 1; i <= g_nchild; i++) dump_props(g_child[i], i);
              plog(@"PROPS done children=%d", g_nchild);
              ulog(@"PROPS done children=%d", g_nchild);
          }

          static void vt_cb(void* ref, void* src, OSStatus st, VTEncodeInfoFlags fl, CMSampleBufferRef sb) { g_vt_done = 1; }

          static void vt_start(void) {
              VTCompressionSessionCreate(NULL, 1920, 1080, kCMVideoCodecType_H264, NULL, NULL, NULL, vt_cb, NULL, &g_vt);
              if (g_vt) VTCompressionSessionPrepareToEncodeFrames(g_vt);
          }

          static int vt_encode(void) {
              if (!g_vt) return -1;
              CVPixelBufferRef pb = NULL;
              NSDictionary* a = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              if (CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, (__bridge CFDictionaryRef)a, &pb) != kCVReturnSuccess) return -2;
              CVPixelBufferLockBaseAddress(pb, 0);
              memset(CVPixelBufferGetBaseAddress(pb), 0x80, CVPixelBufferGetDataSize(pb));
              CVPixelBufferUnlockBaseAddress(pb, 0);
              VTEncodeInfoFlags fl = 0;
              OSStatus st = VTCompressionSessionEncodeFrame(g_vt, pb, CMTimeMake(1, 30), CMTimeMake(1, 30), NULL, NULL, &fl);
              CVPixelBufferRelease(pb);
              for (int i = 0; i < 300 && !g_vt_done; i++) usleep(10000);
              return (int)st;
          }

          static int surf_make(void) {
              if (g_surf) return 1;
              NSDictionary* p = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              CVReturn r = CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, (__bridge CFDictionaryRef)p, &g_surf);
              if (r != kCVReturnSuccess || !g_surf) {
                  plog(@"surf=0 rc=%d", (int)r);
                  ulog(@"surf=0 rc=%d", (int)r);
                  return 0;
              }
              IOSurfaceRef s = CVPixelBufferGetIOSurface(g_surf);
              fn_surfid idf = (fn_surfid)dlsym(RTLD_DEFAULT, "IOSurfaceGetID");
              g_sid = (s && idf) ? idf(s) : 0;
              plog(@"surf=1 id=%u", g_sid);
              ulog(@"surf=1 id=%u", g_sid);
              return 1;
          }

          static void desc_into(uint8_t* in, size_t n) {
              uint32_t w = 1920, h = 1080, f = 0x42475241, bpr = 7680, pl = 1;
              if (n >= 4) memcpy(in, &g_sid, 4);
              if (n >= 8) memcpy(in + 4, &w, 4);
              if (n >= 12) memcpy(in + 8, &h, 4);
              if (n >= 16) memcpy(in + 12, &f, 4);
              if (n >= 20) memcpy(in + 16, &bpr, 4);
              if (n >= 24) memcpy(in + 20, &pl, 4);
          }

          static int probe_handle(io_connect_t c, int node, uint32_t t) {
              uint64_t s5[SCO] = {0}; size_t c5 = 0; uint8_t b5[FIXED]; size_t z5 = 0;
              kern_return_t k5 = raw(c, 5, 0, 0, 0, 0, s5, &c5, b5, &z5);
              plog(@"PH n%d t%u s5=%@", node, t, kr_name(k5));
              uint64_t s0[SCO] = {0}; size_t c0 = 0; uint8_t b0[FIXED]; size_t z0 = 0;
              kern_return_t k0 = raw(c, 0, 0, 0, 0, 0, s0, &c0, b0, &z0);
              plog(@"PH n%d t%u s0=%@", node, t, kr_name(k0));
              if (k0 == KERN_SUCCESS) {
                  note_ok(0, 0, 0, 0, 0);
                  __sync_fetch_and_add(&g_ok0, 1);
                  if (g_best < 0) g_best = g_nconn - 1;
                  ulog(@"PH n%d t%u PING", node, t);
                  return 1;
              }
              return 0;
          }

          static void child_open(void) {
              for (int i = 1; i <= g_nchild && g_nconn < MAXC; i++) {
                  NSMutableString* l = [NSMutableString string];
                  int got = 0;
                  for (uint32_t t = 0; t <= TMAX && g_nconn < MAXC; t++) {
                      io_connect_t c = 0;
                      kern_return_t kr = IOServiceOpen(g_child[i], mach_task_self(), t, &c);
                      if (kr == KERN_SUCCESS) {
                          got++;
                          g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_node[g_nconn] = i; g_nconn++;
                          [l appendFormat:@"%u:OK ", t];
                          ulog(@"CHILD %d t%u OPEN", i, t);
                          probe_handle(c, i, t);
                      } else if (kr != 0xe00002bc) {
                          [l appendFormat:@"%u:%@ ", t, kr_name(kr)];
                      }
                  }
                  plog(@"childopen %d got=%d %@", i, got, l);
                  ulog(@"childopen %d got=%d %@", i, got, l);
              }
              plog(@"childopen conns=%d", g_nconn);
              ulog(@"childopen conns=%d", g_nconn);
          }

          static void root_open(void) {
              NSMutableString* l = [NSMutableString string];
              int got = 0;
              for (uint32_t t = 0; t <= TYPE_MAX && g_nconn < MAXC; t++) {
                  io_connect_t c = 0;
                  kern_return_t kr = IOServiceOpen(g_root, mach_task_self(), t, &c);
                  if (kr == KERN_SUCCESS) {
                      got++;
                      g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_node[g_nconn] = 0;
                      if (g_root_idx < 0) g_root_idx = g_nconn;
                      g_nconn++;
                      [l appendFormat:@"%u:OK ", t];
                      ulog(@"ROOT t%u OPEN", t);
                      probe_handle(c, 0, t);
                  } else {
                      [l appendFormat:@"%u:%@ ", t, kr_name(kr)];
                  }
              }
              plog(@"rootopen got=%d idx=%d %@", got, g_root_idx, l);
              ulog(@"rootopen got=%d idx=%d %@", got, g_root_idx, l);
          }

          static void ping_sweep(void) {
              if (g_best < 0 && g_root_idx >= 0) g_best = g_root_idx;
              for (int ci = 0; ci < g_nconn; ci++) {
                  NSMutableString* l = [NSMutableString string];
                  for (uint32_t s = 0; s < SEL_N; s++) {
                      uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[FIXED]; size_t szb = 0;
                      kern_return_t kr = raw(g_conn[ci], s, 0, 0, 0, 0, so, &sc, sb, &szb);
                      if (kr == KERN_SUCCESS) {
                          [l appendFormat:@"%u:OK ", s];
                          note_ok(s, 0, 0, 0, 0);
                          if (s == 0 && g_best < 0) g_best = ci;
                          ulog(@"PING n%d t%u s%u OK", g_node[ci], g_ctype[ci], s);
                      } else if (kr != 0xe00002c2) {
                          [l appendFormat:@"%u:%@ ", s, kr_name(kr)];
                      }
                  }
                  plog(@"PING n%d t%u %@", g_node[ci], g_ctype[ci], l);
                  ulog(@"PING n%d t%u %@", g_node[ci], g_ctype[ci], l);
              }
              plog(@"best=%d", g_best);
              ulog(@"best=%d", g_best);
          }

          static void step_call(const char* tag, uint32_t sel, int mode, uint32_t sic, size_t zis, size_t zos) {
              if (g_best < 0) return;
              uint64_t sin[SCO] = {0};
              uint64_t so[SCO] = {0}; size_t sc = 0;
              uint8_t sb[FIXED]; size_t szb = 0;
              uint8_t* inS = calloc(1, FIXED);
              if (inS && zis >= 24) desc_into(inS, zis);
              kern_return_t h = hb();
              kern_return_t kr = rawv(g_conn[g_best], sel, mode, sin, sic, inS, zis, so, &sc, sb, &szb);
              free(inS);
              __sync_fetch_and_add(&g_done, 1);
              plog(@"HS %s s%u m%d %u/%zu/%zu hb=%@ -> %@ so0=%llu sc=%zu szb=%zu %@", tag, sel, mode, sic, zis, zos, kr_name(h), kr_name(kr), (unsigned long long)so[0], sc, szb, hexn(sb, szb, 128));
              if (kr == KERN_SUCCESS) {
                  __sync_fetch_and_add(&g_hits, 1);
                  if (sel == 5) __sync_fetch_and_add(&g_ok5, 1);
                  if (sel == 4) __sync_fetch_and_add(&g_ok4, 1);
                  if (sel == 9) __sync_fetch_and_add(&g_ok9, 1);
                  note_ok(sel, (uint32_t)mode, sic, zis, zos);
                  ulog(@"!!! HS %s s%u m%d -> OK so0=%llu", tag, sel, mode, (unsigned long long)so[0]);
              } else if (kr != 0xe00002c2) {
                  ulog(@"!! HS %s s%u m%d -> %@", tag, sel, mode, kr_name(kr));
              }
              usleep(400);
          }

          static void handshake(void) {
              if (g_best < 0) { ulog(@"hs no best"); return; }
              for (int r = 0; r < 3; r++) {
                  step_call("o", 0, 0, 0, 0, 0);
                  step_call("r", 2, 0, 0, 0, 0);
                  step_call("s", 5, 0, 0, 0, 0);
                  step_call("e", 4, 1, 0, 4096, 4096);
                  step_call("z", 9, 0, 0, 0, 0);
              }
              ulog(@"hs rounds=3");
          }

          static void try_scalar(uint32_t sel, int mode, uint32_t sic, uint64_t v) {
              if (g_best < 0) return;
              uint64_t sin[SCO] = {0};
              for (uint32_t i = 0; i < sic && i < SCO; i++) sin[i] = v;
              uint64_t so[SCO] = {0}; size_t sc = 0;
              uint8_t sb[FIXED]; size_t szb = 0;
              kern_return_t h = hb();
              kern_return_t kr = rawv(g_conn[g_best], sel, mode, sin, sic, NULL, 0, so, &sc, sb, &szb);
              __sync_fetch_and_add(&g_done, 1);
              plog(@"A s%u m%d n%u v=%llu hb=%@ -> %@ so0=%llu sc=%zu szb=%zu %@", sel, mode, sic, (unsigned long long)v, kr_name(h), kr_name(kr), (unsigned long long)so[0], sc, szb, hexn(sb, szb, 96));
              if (kr == KERN_SUCCESS) {
                  __sync_fetch_and_add(&g_hits, 1);
                  if (sel == 5) __sync_fetch_and_add(&g_ok5, 1);
                  if (sel == 4) __sync_fetch_and_add(&g_ok4, 1);
                  if (sel == 9) __sync_fetch_and_add(&g_ok9, 1);
                  note_ok(sel, (uint32_t)mode, sic, 0, 0);
                  if (!g_sok[sel]) {
                      g_sok[sel] = 1; g_smode[sel] = (uint32_t)mode; g_sic[sel] = sic; g_sval[sel] = v;
                      ulog(@"$$$ SCALAR s%u m%d n%u v=%llu so0=%llu", sel, mode, sic, (unsigned long long)v, (unsigned long long)so[0]);
                  }
              } else if (kr != 0xe00002c2) {
                  ulog(@"!! A s%u m%d n%u v=%llu -> %@", sel, mode, sic, (unsigned long long)v, kr_name(kr));
              }
              usleep(350);
          }

          static void arg_probe(void) {
              static const uint32_t DEEP[3] = { 5, 4, 9 };
              static const uint32_t SHAL[5] = { 1, 3, 6, 7, 8 };
              for (int d = 0; d < 3; d++) {
                  for (int mode = 0; mode < 2; mode++) {
                      for (uint32_t sic = 1; sic <= 2; sic++) {
                          for (int k = 0; k < SCAL_N; k++) try_scalar(DEEP[d], mode, sic, SCAL[k]);
                      }
                  }
              }
              for (int d = 0; d < 5; d++) {
                  for (int k = 0; k < SCAL_N; k++) try_scalar(SHAL[d], 0, 1, SCAL[k]);
              }
              ulog(@"A done ok5=%d ok4=%d ok9=%d", g_ok5, g_ok4, g_ok9);
          }

          static void try_layout(uint32_t sel, size_t off, size_t w, size_t sz) {
              if (g_best < 0) return;
              uint8_t* in = calloc(1, sz);
              if (!in) return;
              desc_into(in, sz);
              if (off + w <= sz) {
                  if (w == 4) memcpy(in + off, &g_sid, 4);
                  else { uint64_t v = g_sid; memcpy(in + off, &v, 8); }
              }
              uint64_t sin[SCO] = {0};
              uint64_t so[SCO] = {0}; size_t sc = 0;
              uint8_t sb[FIXED]; size_t szb = 0;
              kern_return_t h = hb();
              kern_return_t kr = rawv(g_conn[g_best], sel, 1, sin, 0, in, sz, so, &sc, sb, &szb);
              __sync_fetch_and_add(&g_done, 1);
              plog(@"L s%u off=%zu w=%zu sz=%zu hb=%@ -> %@ so0=%llu sc=%zu szb=%zu %@", sel, off, w, sz, kr_name(h), kr_name(kr), (unsigned long long)so[0], sc, szb, hexn(sb, szb, 128));
              if (kr == KERN_SUCCESS) {
                  __sync_fetch_and_add(&g_hits, 1);
                  if (sel == 5) __sync_fetch_and_add(&g_ok5, 1);
                  if (sel == 4) __sync_fetch_and_add(&g_ok4, 1);
                  if (sel == 9) __sync_fetch_and_add(&g_ok9, 1);
                  note_ok(sel, 1, 0, sz, sz);
                  if (!g_lok[sel]) {
                      g_lok[sel] = 1; g_loff[sel] = off; g_lw[sel] = w; g_lsz[sel] = sz;
                      ulog(@"$$$ LAYOUT s%u off=%zu w=%zu sz=%zu so0=%llu", sel, off, w, sz, (unsigned long long)so[0]);
                  }
              } else if (kr != 0xe00002c2) {
                  ulog(@"!! L s%u off=%zu w=%zu sz=%zu -> %@", sel, off, w, sz, kr_name(kr));
              }
              free(in);
              usleep(350);
          }

          static void layout_probe(void) {
              static const uint32_t SEL3[3] = { 5, 4, 9 };
              for (int d = 0; d < 3; d++) {
                  for (int o = 0; o < 6; o++) {
                      for (int w = 0; w < 2; w++) {
                          size_t ww = w ? 8 : 4;
                          for (int z = 0; z < 4; z++) {
                              if (LOFF[o] + ww > LSZ[z]) continue;
                              try_layout(SEL3[d], LOFF[o], ww, LSZ[z]);
                          }
                      }
                  }
              }
              ulog(@"L done ok5=%d ok4=%d ok9=%d", g_ok5, g_ok4, g_ok9);
          }

          static void child_retry(void) {
              int before = g_nconn;
              for (int i = 1; i <= g_nchild && g_nconn < MAXC; i++) {
                  NSMutableString* l = [NSMutableString string];
                  int got = 0;
                  for (uint32_t t = 0; t <= 12 && g_nconn < MAXC; t++) {
                      io_connect_t c = 0;
                      kern_return_t kr = IOServiceOpen(g_child[i], mach_task_self(), t, &c);
                      if (kr == KERN_SUCCESS) {
                          got++;
                          g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_node[g_nconn] = i; g_nconn++;
                          [l appendFormat:@"%u:OK ", t];
                          ulog(@"RETRY child %d t%u OPEN", i, t);
                          probe_handle(c, i, t);
                      } else {
                          [l appendFormat:@"%u:%@ ", t, kr_name(kr)];
                      }
                  }
                  plog(@"retry %d got=%d %@", i, got, l);
                  ulog(@"retry %d got=%d", i, got);
              }
              plog(@"retry added=%d", g_nconn - before);
              ulog(@"retry added=%d", g_nconn - before);
          }

          static void confirm_all(void) {
              for (int ci = 0; ci < g_nconn; ci++) {
                  NSMutableString* l = [NSMutableString string];
                  for (uint32_t s = 0; s < SEL_N; s++) {
                      if (g_sok[s]) {
                          uint64_t sin[SCO] = {0};
                          for (uint32_t i = 0; i < g_sic[s] && i < SCO; i++) sin[i] = g_sval[s];
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[FIXED]; size_t szb = 0;
                          kern_return_t kr = rawv(g_conn[ci], s, (int)g_smode[s], sin, g_sic[s], NULL, 0, so, &sc, sb, &szb);
                          [l appendFormat:@"%u:V%@ ", s, kr_name(kr)];
                          plog(@"CFS n%d s%u v=%llu -> %@", g_node[ci], s, (unsigned long long)g_sval[s], kr_name(kr));
                      } else if (g_lok[s]) {
                          uint8_t* in = calloc(1, g_lsz[s]);
                          if (!in) continue;
                          desc_into(in, g_lsz[s]);
                          if (g_loff[s] + g_lw[s] <= g_lsz[s]) {
                              if (g_lw[s] == 4) memcpy(in + g_loff[s], &g_sid, 4);
                              else { uint64_t v = g_sid; memcpy(in + g_loff[s], &v, 8); }
                          }
                          uint64_t sin[SCO] = {0};
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[FIXED]; size_t szb = 0;
                          kern_return_t kr = rawv(g_conn[ci], s, 1, sin, 0, in, g_lsz[s], so, &sc, sb, &szb);
                          free(in);
                          [l appendFormat:@"%u:L%@ ", s, kr_name(kr)];
                          plog(@"CFL n%d s%u -> %@", g_node[ci], s, kr_name(kr));
                      } else {
                          uint32_t m = shape_mode(s);
                          size_t zi = shape_in(s);
                          size_t zo = shape_out(s);
                          char tg[48]; snprintf(tg, sizeof(tg), "cf.%d.%u.%u", g_node[ci], g_ctype[ci], s);
                          kern_return_t kr = callm(tg, ci, s, (int)m, 0, zi, 0, zo);
                          [l appendFormat:@"%u:%@ ", s, kr_name(kr)];
                      }
                  }
                  plog(@"CF n%d t%u %@", g_node[ci], g_ctype[ci], l);
                  ulog(@"CF n%d t%u %@", g_node[ci], g_ctype[ci], l);
              }
          }

          static void summary(void) {
              NSString* st = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              int lines = 0, oks = 0, wins = 0;
              for (NSString* ln in [st componentsSeparatedByString:@"\n"]) {
                  if (!ln.length) continue;
                  lines++;
                  if ([ln hasPrefix:@"WIN "]) { wins++; oks++; plog(@"SUM %@", ln); }
                  else if ([ln hasPrefix:@"OK "]) { oks++; plog(@"SUM %@", ln); }
              }
              plog(@"SUMMARY lines=%d oks=%d wins=%d ok0=%d ok5=%d ok9=%d ok4=%d best=%d conns=%d", lines, oks, wins, g_ok0, g_ok5, g_ok9, g_ok4, g_best, g_nconn);
              ulog(@"SUMMARY lines=%d oks=%d wins=%d ok5=%d best=%d", lines, oks, wins, g_ok5, g_best);
              for (uint32_t s = 0; s < SEL_N; s++) {
                  if (g_oks[s]) ulog(@"OKSHAPE s%u m%u %u/%zu/%zu", s, g_okm[s], g_oksi[s], g_okzi[s], g_okzo[s]);
                  if (g_sok[s]) ulog(@"OKSCAL s%u m%u n%u v=%llu", s, g_smode[s], g_sic[s], (unsigned long long)g_sval[s]);
                  if (g_lok[s]) ulog(@"OKLAY s%u off=%zu w=%zu sz=%zu", s, g_loff[s], g_lw[s], g_lsz[s]);
              }
          }

          static void verdict(void) {
              NSMutableString* b = [NSMutableString string];
              for (uint32_t s = 0; s < SEL_N; s++) {
                  if (g_oks[s]) [b appendFormat:@"%u(OK m%u/%u/%zu/%zu) ", s, g_okm[s], g_oksi[s], g_okzi[s], g_okzo[s]];
                  else if (g_hit_s[s]) [b appendFormat:@"%u(m%u/%zu/%zu) ", s, g_bmode[s], g_bsi[s], g_bso[s]];
              }
              plog(@"VERDICT ok0=%d ok5=%d ok9=%d ok4=%d hits=%d conns=%d best=%d hit=[%@]", g_ok0, g_ok5, g_ok9, g_ok4, g_hits, g_nconn, g_best, b);
              ulog(@"VERDICT ok0=%d ok5=%d ok9=%d ok4=%d best=%d hit=[%@]", g_ok0, g_ok5, g_ok9, g_ok4, g_best, b);
              for (uint32_t s = 0; s < SEL_N; s++) {
                  if (g_sok[s]) plog(@"VSCAL s%u m%u n%u v=%llu", s, g_smode[s], g_sic[s], (unsigned long long)g_sval[s]);
                  if (g_lok[s]) plog(@"VLAY s%u off=%zu w=%zu sz=%zu", s, g_loff[s], g_lw[s], g_lsz[s]);
              }
          }

          static void do_step(int s) {
              switch (s) {
                  case 0: break;
                  case 1: census(); break;
                  case 2: dump_sig(); break;
                  case 3: dump_tree(); break;
                  case 4: prop_dump(); break;
                  case 5: vt_start(); break;
                  case 6: ulog(@"vt=%d", (int)vt_encode()); break;
                  case 7: child_open(); break;
                  case 8: root_open(); break;
                  case 9: ping_sweep(); break;
                  case 10: handshake(); break;
                  case 11: arg_probe(); break;
                  case 12: layout_probe(); break;
                  case 13: child_retry(); break;
                  case 14: confirm_all(); break;
                  case 15: summary(); break;
                  case 16: verdict(); break;
              }
          }

          static void run(void) {
              latch_build();
              char b[512]; doc_path("state.txt", b, sizeof(b));
              g_fd = open(b, O_CREAT | O_WRONLY | O_APPEND, 0644);
              g_seen = [NSMutableSet set];
              load_state();
              g_step = load_step();

              mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &g_wake);
              mach_port_insert_right(mach_task_self(), g_wake, g_wake, MACH_MSG_TYPE_MAKE_SEND);

              plog(@"=== LAUNCH step=%d build=%s", g_step, BUILD_TAG);
              if (g_fd >= 0) fsync(g_fd);
              ulog(@"BUILD %s", BUILD_TAG);
              ulog(@"STEP %d/%d: %s", g_step, STEP_MAX, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);

              if (g_step > STEP_MAX) {
                  ulog(@"ALL DONE - replay");
                  summary();
                  verdict();
                  if (g_fd >= 0) fsync(g_fd);
                  close(g_fd); g_fd = -1;
                  return;
              }

              int svc = find_root();
              ulog(@"svc=%d", svc);
              plog(@"svc=%d", svc);
              if (!g_root) { ulog(@"NO ROOT"); g_stop = 1; }

              while (g_step <= STEP_MAX && !g_stop) {
                  load_try();
                  if (g_try >= TRY_MAX) {
                      ulog(@"SKIP %d", g_step);
                      plog(@"SKIP %d", g_step);
                      g_step++; save_step(g_step);
                      usleep(150000);
                      continue;
                  }
                  g_try++; save_try();
                  ulog(@"CHAIN %d %s", g_step, STEP_NAME[g_step]);
                  do_step(g_step);
                  plog(@"STEP %d OK calls=%d hits=%d ok0=%d ok5=%d ok9=%d ok4=%d best=%d", g_step, g_done, g_hits, g_ok0, g_ok5, g_ok9, g_ok4, g_best);
                  if (g_fd >= 0) fsync(g_fd);
                  ulog(@"STEP %d SURVIVED", g_step);
                  g_step++; save_step(g_step);
                  if (g_step <= STEP_MAX) usleep(400000);
              }

              ulog(@"CHAIN END");
              plog(@"CHAIN END");
              if (g_fd >= 0) fsync(g_fd);
              close(g_fd); g_fd = -1;
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              g_lines = [NSMutableArray array];
              signal(SIGSEGV, sigh); signal(SIGBUS, sigh); signal(SIGABRT, sigh);
              signal(SIGILL, sigh); signal(SIGFPE, sigh);

              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 44, 344, 44)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightRegular];
              g_hb.numberOfLines = 2;
              g_hb.text = @BUILD_TAG;
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 92; r.size.height -= 100;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              [NSTimer scheduledTimerWithTimeInterval:0.25 repeats:YES block:^(NSTimer*) {
                  g_hb.text = [NSString stringWithFormat:@"%s step %d/%d c=%d h=%d ok0=%d ok5=%d best=%d", BUILD_TAG, g_step, STEP_MAX, g_done, g_hits, g_ok0, g_ok5, g_best];
                  flush_ui();
              }];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC), dispatch_get_global_queue(0,0), ^{ run(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          MAINEOF

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: syntax
        run: |
          set +e
          xcrun -sdk iphoneos clang -fsyntax-only -x objective-c \
            -target arm64-apple-ios18.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -F "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/PrivateFrameworks" \
            -F "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks" \
            -Wno-implicit-function-declaration \
            Sources/main.m > s.log 2>&1
          rc=$?
          set -e
          grep -nE "error:" s.log | head -40
          exit $rc

      - name: build
        run: |
          mkdir -p out/Payload
          set +e
          xcodebuild -project probe.xcodeproj -target probe \
            -sdk iphoneos -configuration Release \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/out/Payload \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_CFLAGS="-Wno-implicit-function-declaration" \
            OTHER_LDFLAGS="-F$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/PrivateFrameworks" \
            build > b.log 2>&1
          rc=$?
          set -e
          echo "=== rc=$rc ==="
          grep -nE "error:|fatal error:|Undefined symbols" b.log | head -40
          echo "=== end ==="
          exit $rc

      - name: ipa
        run: |
          ls -la out/Payload
          cd out && zip -r probe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.ipa
          if-no-files-found: error
