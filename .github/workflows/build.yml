          }

          static void probe_req(void) {
              if (!g_reqprobe) { plog(@"PROBE no sym"); ulog(@"probe no sym"); return; }
              if (g_root) {
                  kern_return_t kr = g_reqprobe(g_root, 0);
                  plog(@"PROBE root -> %@", kr_name(kr)); ulog(@"PROBE root %@", kr_name(kr));
                  if (kr == KERN_SUCCESS) __sync_fetch_and_add(&g_probe_ok, 1);
              }
              for (int i = 1; i <= g_nchild; i++) {
                  if (!g_child[i]) continue;
                  kern_return_t kr = g_reqprobe(g_child[i], 0);
                  plog(@"PROBE c%d -> %@", i, kr_name(kr));
                  if (kr == KERN_SUCCESS) __sync_fetch_and_add(&g_probe_ok, 1);
              }
              for (int i = 1; i <= g_pn; i++) {
                  if (!g_pkid[i]) continue;
                  kern_return_t kr = g_reqprobe(g_pkid[i], 0);
                  plog(@"PROBE pk%d -> %@", i, kr_name(kr));
                  if (kr == KERN_SUCCESS) __sync_fetch_and_add(&g_probe_ok, 1);
              }
              ulog(@"probe req ok=%d", g_probe_ok);
          }

          static void s9_after(void) {
              if (!g_nconn) { ulog(@"s9a no conn"); return; }
              int moved = 0;
              ulog(@"S9A start conns=%d", g_nconn);
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 64;
                  memset(sb, AAM, sizeof(sb));
                  kern_return_t kr = rawv(g_conn[ci], 9, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  __sync_fetch_and_add(&g_done, 1);
                  plog(@"S9A n%d -> %@", g_node[ci], kr_name(kr));
                  if (kr != 0xe00002bc) { moved++; __sync_fetch_and_add(&g_hits, 1); ulog(@"!!! S9A n%d %@", g_node[ci], kr_name(kr)); }
                  usleep(40);
              }
              ulog(@"s9a moved=%d", moved);
          }

          static void arity(void) {
              if (!g_nconn) { ulog(@"AR no conn"); return; }
              ulog(@"AR start conns=%d sels 0-15 sic 0-16", g_nconn);
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (uint32_t s = 0; s <= 15; s++) {
                      int ok = 0, err = 0, bad = 0, oth = 0, last = -1;
                      for (uint32_t sic = 0; sic <= 16; sic++) {
                          uint64_t sin[SCO] = {0};
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[512]; size_t szb = 512;
                          memset(sb, AAM, sizeof(sb));
                          kern_return_t kr = rawv(g_conn[ci], s, 0, sin, sic, NULL, 0, so, &sc, sb, &szb);
                          __sync_fetch_and_add(&g_done, 1);
                          int c = krclass(kr);
                          if (c == 0) { ok++; g_ok_sel |= (1ULL << (s & 63)); }
                          else if (c == 1) err++;
                          else if (c == 2) bad++;
                          else oth++;
                          if (c != 2 && c != last) {
                              plog(@"AR n%d s%u sic%u -> %@ sc%zu szb%zu so0=%llu", g_node[ci], s, sic, kr_name(kr), sc, szb, (unsigned long long)so[0]);
                              if (c == 0) ulog(@"!!! AR n%d s%u sic%u OK", g_node[ci], s, sic);
                          }
                          last = c;
                          usleep(20);
                      }
                      plog(@"ARSUM n%d s%u ok=%d err=%d bad=%d oth=%d", g_node[ci], s, ok, err, bad, oth);
                      if (ok || err || oth) ulog(@"ARSUM n%d s%u ok=%d err=%d bad=%d oth=%d", g_node[ci], s, ok, err, bad, oth);
                  }
              }
              ulog(@"ar done okmask=0x%llx", (unsigned long long)g_ok_sel);
          }

          static void prop_surface(void) {
              if (!g_setprop || !g_surfid) { ulog(@"psurf nosym"); return; }
              if (!g_nconn || !g_vicn) { ulog(@"psurf dry conns=%d vic=%d", g_nconn, g_vicn); return; }
              ulog(@"PSURF start conns=%d vic=%d", g_nconn, g_vicn);
              const char* keys[4] = { "IOSurface", "Surface", "IOSurfaceRef", "Buffer" };
              int accepted = 0;
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  int vi = ci % g_vicn;
                  IOSurfaceRef s = g_vic[vi];
                  if (!s) continue;
                  uint32_t sid = g_surfid(s);
                  for (int k = 0; k < 4; k++) {
                      kern_return_t kr = g_setprop(g_conn[ci], (__bridge CFStringRef)@(keys[k]), (CFTypeRef)s);
                      __sync_fetch_and_add(&g_done, 1);
                      plog(@"PSURF n%d k=%s vid=0x%x -> %@", g_node[ci], keys[k], sid, kr_name(kr));
                      if (kr != KERN_SUCCESS) continue;
                      accepted++;
                      __sync_fetch_and_add(&g_propok, 1);
                      ulog(@"!!! PSURF n%d %s ACCEPTED vid=0x%x", g_node[ci], keys[k], sid);
                      probe_x(ci, 0, 0, 0, 0, 0, 0, 0, "ps0");
                      probe_x(ci, 2, 0, 0, 0, 0, 0, 0, "ps2");
                      probe_x(ci, 9, 0, 0, 0, 0, 0, 0, "ps9");
                      probe_x(ci, 9, 0, 0, 0, 4096, 0, 2, "ps9s");
                      probe_x(ci, 0, 1, 0, 0, 0, 4096, 2, "ps0i");
                      probe_x(ci, 9, 2, 0, 0, 0, 0, 2, "ps9a");
                      int m = drain_port("psurf");
                      if (m) ulog(@"!!! PSURF n%d %s async msgs=%d", g_node[ci], keys[k], m);
                      vic_fill(vi, AAM);
                      probe_x(ci, 9, 0, 0, 0, 0, 0, 2, "ps9w");
                      size_t first = 0, dirty = 0;
                      if (vic_scan(vi, &first, &dirty)) {
                          __sync_fetch_and_add(&g_canary_w, 1);
                          plog(@"PSURFW n%d %s first=0x%zx dirty=%zu", g_node[ci], keys[k], first, dirty);
                          ulog(@"!!! PSURF n%d %s SURFACE WRITTEN first=0x%zx dirty=%zu", g_node[ci], keys[k], first, dirty);
                      }
                  }
                  g_setprop(g_conn[ci], CFSTR("IOSurfaceID"), (__bridge CFTypeRef)@(sid));
                  g_setprop(g_conn[ci], CFSTR("ImageWidth"), (__bridge CFTypeRef)@(1920));
                  g_setprop(g_conn[ci], CFSTR("ImageHeight"), (__bridge CFTypeRef)@(1080));
                  g_setprop(g_conn[ci], CFSTR("PixelFormat"), (__bridge CFTypeRef)@(0x42475241));
                  g_setprop(g_conn[ci], CFSTR("BytesPerRow"), (__bridge CFTypeRef)@(7680));
                  if (g_allocusize) g_setprop(g_conn[ci], CFSTR("AllocSize"), (__bridge CFTypeRef)@((uint64_t)g_allocusize(s)));
                  probe_x(ci, 9, 0, 0, 0, 0, 0, 2, "ps9n");
                  probe_x(ci, 2, 0, 0, 0, 0, 0, 2, "ps2n");
                  probe_x(ci, 0, 0, 0, 0, 0, 0, 2, "ps0n");
                  usleep(60);
              }
              int m = drain_port("psurf-end");
              ulog(@"psurf done accepted=%d async=%d", accepted, m);
          }

          static void arm_matrix(void) {
              static const int arms[16] = { 0, 2, 1, 3, 4, 5, 6, 7, 8, 10, 11, 12, 13, 14, 15, 9 };
              if (!g_nconn) { ulog(@"ARM no conn"); return; }
              ulog(@"ARM start conns=%d (props already set)", g_nconn);
              int flips = 0;
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  int vi = g_vicn ? (ci % g_vicn) : -1;
                  uintptr_t base = (vi >= 0 && g_baseaddr && g_vic[vi]) ? (uintptr_t)g_baseaddr(g_vic[vi]) : 0;
                  for (int ai = 0; ai < 16; ai++) {
                      uint32_t arm = (uint32_t)arms[ai];
                      for (int v = 0; v < 4; v++) {
                          uint64_t arg = 0;
                          if (v == 1) arg = g_sid;
                          else if (v == 2) arg = (uint64_t)g_conn[ci];
                          else if (v == 3) arg = (uint64_t)base;
                          uint64_t sin[SCO] = {0}; sin[0] = arg;
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[512]; size_t szb = 512; memset(sb, AAM, sizeof(sb));
                          kern_return_t akr = rawv(g_conn[ci], arm, 0, sin, 0, NULL, 0, so, &sc, sb, &szb);
                          uint64_t sin2[SCO] = {0}; sin2[0] = arg;
                          uint64_t so2[SCO] = {0}; size_t sc2 = 0;
                          uint8_t sb2[512]; size_t szb2 = 512; memset(sb2, AAM, sizeof(sb2));
                          kern_return_t skr = rawv(g_conn[ci], 9, 0, sin2, 0, NULL, 0, so2, &sc2, sb2, &szb2);
                          __sync_fetch_and_add(&g_done, 2);
                          plog(@"ARM n%d arm%u v%d akr=%@ s9=%@ szb=%zu so0=%llu", g_node[ci], arm, v, kr_name(akr), kr_name(skr), szb2, (unsigned long long)so2[0]);
                          if (skr == KERN_SUCCESS) { flips++; __sync_fetch_and_add(&g_hits, 1); ulog(@"!!! ARM n%d arm%u v%d -> s9 OK", g_node[ci], arm, v); }
                          usleep(25);
                      }
                  }
              }
              int m = drain_port("arm");
              ulog(@"arm done flips=%d async=%d", flips, m);
          }

          static void agg_table(NSString* st) {
              int cnt[64][3][9]; memset(cnt, 0, sizeof(cnt));
              for (NSString* ln in [st componentsSeparatedByString:@"\n"]) {
                  if (![ln hasPrefix:@"P "] && ![ln hasPrefix:@"X "]) continue;
                  if ([ln rangeOfString:@"-> BadArg"].location == NSNotFound) continue;
                  uint32_t s = 0, sic = 0; int m = 0;
                  if (sscanf(ln.UTF8String, "%*s %*s n%*d s%u sic%u m%d", &s, &sic, &m) != 3) continue;
                  if (s < 64 && m < 3 && sic < 9) cnt[s][m][sic]++;
              }
              NSMutableString* roll = [NSMutableString string];
              for (uint32_t s = 0; s < 64; s++) for (int m = 0; m < 3; m++) for (uint32_t sic = 0; sic < 9; sic++) {
                  if (!cnt[s][m][sic]) continue;
                  plog(@"AGG s%u m%d sic%u bad=%d", s, m, sic, cnt[s][m][sic]);
                  if (sic == 0 && m == 0) [roll appendFormat:@" s%u:%d", s, cnt[s][m][sic]];
              }
              if (roll.length) { plog(@"AGG sic0m0%@", roll); ulog(@"AGG sic0m0%@", roll); }
          }

          static void summary(void) {
              NSString* st = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!st) { ulog(@"no state"); return; }
              NSMutableArray* keep = [NSMutableArray array];
              int lines = 0, bad = 0, nonbad = 0, pairs = 0, canw = 0, canp = 0;
              for (NSString* ln in [st componentsSeparatedByString:@"\n"]) {
                  if (!ln.length) continue;
                  lines++;
                  if ([ln hasPrefix:@"VERDICT"]) { [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"PAIR "]) { pairs++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"CAN "]) {
                      canp++;
                      if ([ln rangeOfString:@"hit=1"].location != NSNotFound) { canw++; [keep addObject:ln]; }
                      continue;
                  }
                  if ([ln hasPrefix:@"P "] || [ln hasPrefix:@"X "]) {
                      if ([ln rangeOfString:@"-> BadArg"].location != NSNotFound) { bad++; continue; }
                      nonbad++; [keep addObject:ln]; continue;
                  }
                  if ([ln hasPrefix:@"ADD "] || [ln hasPrefix:@"ADDM "] || [ln hasPrefix:@"TRAP "] || [ln hasPrefix:@"SWEEP "] || [ln hasPrefix:@"SIG "] ||
                      [ln hasPrefix:@"SIGMASK "] || [ln hasPrefix:@"PROP "] || [ln hasPrefix:@"SETPS "] || [ln hasPrefix:@"GETP "] ||
                      [ln hasPrefix:@"SEQ "] || [ln hasPrefix:@"GAPCH "] || [ln hasPrefix:@"S9SID "] || [ln hasPrefix:@"S9A "] ||
                      [ln hasPrefix:@"WS "] || [ln hasPrefix:@"PROBE "] || [ln hasPrefix:@"PROBESYM "] || [ln hasPrefix:@"SYM "] ||
                      [ln hasPrefix:@"NOTIF "] || [ln hasPrefix:@"NOTIFMSG "] || [ln hasPrefix:@"PSURF "] || [ln hasPrefix:@"PSURFW "] ||
                      [ln hasPrefix:@"AM "] || [ln hasPrefix:@"AR "] || [ln hasPrefix:@"ARSUM "] || [ln hasPrefix:@"ARM "] ||
                      [ln hasPrefix:@"OOBSZ "] || [ln hasPrefix:@"OUTW "] ||
                      [ln hasPrefix:@"SO0 "] || [ln hasPrefix:@"GAP "] || [ln hasPrefix:@"CH "] || [ln hasPrefix:@"PK "] ||
                      [ln hasPrefix:@"PKO "] || [ln hasPrefix:@"SIGNAL "] || [ln hasPrefix:@"VIC "] || [ln hasPrefix:@"NODE "] ||
                      [ln hasPrefix:@"DEV "] || [ln hasPrefix:@"STEP "] || [ln hasPrefix:@"MAP "] || [ln hasPrefix:@"LIVE "] ||
                      [ln hasPrefix:@"SVC "] || [ln hasPrefix:@"PROLOGUE "] || [ln hasPrefix:@"REHYDRATE "] ||
                      [ln hasPrefix:@"census"] || [ln hasPrefix:@"JCLS "]) {
                      [keep addObject:ln]; continue;
                  }
              }
              plog(@"REPLAY lines=%d probes=%d bad=%d nonbad=%d pairs=%d canw=%d", lines, canp, bad, nonbad, pairs, canw);
              ulog(@"REPLAY probes=%d bad=%d nonbad=%d pairs=%d canw=%d", canp, bad, nonbad, pairs, canw);
              agg_table(st);
              NSUInteger cap = keep.count > 260 ? 260 : keep.count;
              for (NSUInteger i = 0; i < cap; i++) { plog(@"KEEP %@", keep[i]); ulog(@"%@", keep[i]); }
              if (keep.count > cap) ulog(@"... +%lu", (unsigned long)(keep.count - cap));
          }

          static void verdict(void) {
              refresh_counts();
              if (g_replay) { plog(@"VERDICT: REPLAYED from state, counters restored"); ulog(@"VERDICT: replayed, counters restored"); }
              if (g_nconn == 0 || g_pairn == 0) {
                  plog(@"VERDICT: DRY conns=%d pairs=%d vic=%d - tail metrics vacuous", g_nconn, g_pairn, g_vicn);
                  ulog(@"VERDICT: DRY conns=%d pairs=%d", g_nconn, g_pairn);
              }
              int hi = 0;
              for (int s = 16; s < HI_MAX; s++) if (g_any_sel[s]) hi++;
              plog(@"VERDICT probes=%d badarg=%d writes=%d oob=%d gap=%d outw=%d nonbad=%d so0=%d sicok=%d addok=%d trapok=%d sigp=%d propok=%d getpok=%d probeok=%d notifok=%d notifmsg=%d hi=%d tblmask=0x%llx okmask=0x%llx livemask=0x%llx conns=%d",
                   g_probes, g_badarg, g_canary_w, g_oobsz, g_gapread, g_outw, g_nonbad, g_s0nz, g_sic_ok, g_addok, g_trap_ok, g_sigp, g_propok, g_getpropok, g_probe_ok, g_notifok, g_notifmsg, hi, (unsigned long long)g_tbl_mask, (unsigned long long)g_ok_sel, (unsigned long long)g_live_sel, g_nconn);
              ulog(@"VERDICT probes=%d badarg=%d writes=%d oob=%d outw=%d nonbad=%d sicok=%d addok=%d trapok=%d sigp=%d propok=%d getpok=%d probeok=%d notifok=%d msg=%d hi=%d",
                   g_probes, g_badarg, g_canary_w, g_oobsz, g_outw, g_nonbad, g_sic_ok, g_addok, g_trap_ok, g_sigp, g_propok, g_getpropok, g_probe_ok, g_notifok, g_notifmsg, hi);
              if (g_tbl_mask) { plog(@"VERDICT: table mask 0x%llx okmask 0x%llx", (unsigned long long)g_tbl_mask, (unsigned long long)g_ok_sel); ulog(@"VERDICT: table mask 0x%llx ok=0x%llx", (unsigned long long)g_tbl_mask, (unsigned long long)g_ok_sel); }
              if (hi) { plog(@"VERDICT: selectors above 15: %d", hi); ulog(@"VERDICT: selectors above 15: %d", hi); }
              if (g_sigp == 0) { plog(@"VERDICT: no signature anywhere"); ulog(@"VERDICT: no signature anywhere"); }
              else { plog(@"VERDICT: live responses=%d, succeeding selectors=0x%llx", g_sigp, (unsigned long long)g_ok_sel); ulog(@"VERDICT: live=%d ok=0x%llx", g_sigp, (unsigned long long)g_ok_sel); }
              plog(@"VERDICT notif t0=%d t1=%d t2=%d t3=%d msg=%d", g_notift[0], g_notift[1], g_notift[2], g_notift[3], g_notifmsg);
              ulog(@"VERDICT notif t=%d/%d/%d/%d msg=%d", g_notift[0], g_notift[1], g_notift[2], g_notift[3], g_notifmsg);
              if (g_symno) { plog(@"VERDICT: %d optional syms MISSING", g_symno); ulog(@"VERDICT: %d syms missing", g_symno); }
              if (g_symok) { plog(@"VERDICT: %d optional syms present", g_symok); ulog(@"VERDICT: %d syms present", g_symok); }
              if (g_probesym == 1) { plog(@"VERDICT: reqprobe present"); ulog(@"VERDICT: reqprobe present"); }
              else if (g_probesym == -1) { plog(@"VERDICT: reqprobe ABSENT - step 27 dead, drop it"); ulog(@"VERDICT: reqprobe absent, drop step 27"); }
              else { plog(@"VERDICT: reqprobe unresolved"); ulog(@"VERDICT: reqprobe unresolved"); }
              if (g_getpropok) { plog(@"VERDICT: GETPROP READBACK WORKS x%d", g_getpropok); ulog(@"VERDICT: getprop readback works"); }
              else { plog(@"VERDICT: no property readback - setprop unverified despite %d OK", g_propok); ulog(@"VERDICT: no readback, setprop unverified"); }
              if (g_notifmsg) { plog(@"VERDICT: ASYNC COMPLETIONS DELIVERED x%d", g_notifmsg); ulog(@"VERDICT: async delivered"); }
              if (g_probe_ok) { plog(@"VERDICT: request-probe ok x%d", g_probe_ok); ulog(@"VERDICT: probe req ok"); }
              if (g_addok) { plog(@"VERDICT: ADDCLIENT ACCEPTED x%d", g_addok); ulog(@"VERDICT: ADDCLIENT ACCEPTED"); }
              if (g_trap_ok) { plog(@"VERDICT: trap succeeded x%d", g_trap_ok); ulog(@"VERDICT: trap succeeded"); }
              if (g_sic_ok) { plog(@"VERDICT: selector accepted args x%d", g_sic_ok); ulog(@"VERDICT: args accepted"); }
              if (g_notifok) { plog(@"VERDICT: notification port set x%d", g_notifok); ulog(@"VERDICT: notif port set"); }
              if (g_canary_w) { plog(@"VERDICT: OOB WRITE x%d", g_canary_w); ulog(@"VERDICT: OOB WRITE"); }
              if (g_oobsz) { plog(@"VERDICT: szb overrun x%d", g_oobsz); ulog(@"VERDICT: szb overrun"); }
              if (g_outw) { plog(@"VERDICT: output written x%d", g_outw); ulog(@"VERDICT: output written"); }
              if (g_s0nz) { plog(@"VERDICT: scalar returned x%d", g_s0nz); ulog(@"VERDICT: scalar returned"); }
              if (g_probes == 0) { plog(@"VERDICT: ZERO probes"); ulog(@"VERDICT: ZERO probes"); }
              if (g_nonbad == 0) { plog(@"VERDICT: nothing responded anywhere"); ulog(@"VERDICT: nothing responded"); }
          }

          static int prologue(void) {
              ulog(@"PROLOGUE rebuild");
              plog(@"PROLOGUE start");
              unlink(doc_file("try.txt").UTF8String);
              if (!g_root) find_root();
              if (!g_root) { plog(@"PROLOGUE FAIL no-root"); ulog(@"PROLOGUE FAIL no-root"); return 0; }
              int c0 = g_nconn;
              svc_open();
              plog(@"PROLOGUE svc +%d", g_nconn - c0); ulog(@"PROLOGUE svc +%d", g_nconn - c0);
              c0 = g_nconn;
              root_open();
              plog(@"PROLOGUE root +%d", g_nconn - c0); ulog(@"PROLOGUE root +%d", g_nconn - c0);
              c0 = g_nconn;
              child_open();
              plog(@"PROLOGUE child +%d", g_nconn - c0); ulog(@"PROLOGUE child +%d", g_nconn - c0);
              c0 = g_nconn;
              parent_kids();
              plog(@"PROLOGUE pk +%d", g_nconn - c0); ulog(@"PROLOGUE pk +%d", g_nconn - c0);
              surf_make();
              surf_alloc();
              plog(@"PROLOGUE conns=%d vic=%d pair=%d sid=0x%x", g_nconn, g_vicn, g_pairn, g_sid);
              ulog(@"PROLOGUE conns=%d vic=%d pair=%d", g_nconn, g_vicn, g_pairn);
              if (g_nconn < 1) { plog(@"PROLOGUE FAIL conns=0"); ulog(@"PROLOGUE FAIL conns=0"); return 0; }
              if (g_pairn < 1) { plog(@"PROLOGUE WARN pairs=0"); ulog(@"PROLOGUE WARN pairs=0"); }
              return 1;
          }

          static void do_step(int s) {
              switch (s) {
                  case 0: break;
                  case 1: census(); break;
                  case 2: dump_sig(); break;
                  case 3: dev_info(); break;
                  case 4: tree_up(); break;
                  case 5: svc_open(); break;
                  case 6: dump_tree(); break;
                  case 7: prop_dump(); break;
                  case 8: parent_kids(); break;
                  case 9: vt_start(); break;
                  case 10: ulog(@"vt=%d", (int)vt_encode()); break;
                  case 11: root_open(); break;
                  case 12: child_open(); break;
                  case 13: map_all(); break;
                  case 14: surf_make(); break;
                  case 15: surf_alloc(); break;
                  case 16: traps(); break;
                  case 17: addclient_all(); break;
                  case 18:
                      canary(2, 0, 4096, 0, 0, 0, "s2v");
                      canary(9, 0, 4096, 0, 0, 0, "s9v");
                      canary(9, 1, 0, 4096, 0, 0, "s9si");
                      canary(9, 1, 0, 4096, 4, 0, "s9si4");
                      break;
                  case 19: prop_rich(); break;
                  case 20: prop_readback(); break;
                  case 21: seq_probe(); break;
                  case 22: gap_forensics(); break;
                  case 23: argmatrix(); break;
                  case 24: s9_sid(); break;
                  case 25: wide_sweep(); break;
                  case 26: notif(); break;
                  case 27: probe_req(); break;
                  case 28: s9_after(); break;
                  case 29: arity(); break;
                  case 30: prop_surface(); break;
                  case 31: arm_matrix(); break;
                  case 32: summary(); break;
                  case 33: verdict(); break;
              }
          }

          static void run(void) {
              latch_build();
              char b[512]; doc_path("state.txt", b, sizeof(b));
              g_fd = open(b, O_CREAT | O_WRONLY | O_APPEND, 0644);
              g_seen = [NSMutableSet set];
              load_state();
              g_step = load_step();
              if (g_step > STEP_MAX) g_replay = 1;

              mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &g_wake);
              mach_port_insert_right(mach_task_self(), g_wake, g_wake, MACH_MSG_TYPE_MAKE_SEND);

              void* is = dlopen("/System/Library/PrivateFrameworks/IOSurface.framework/IOSurface", RTLD_LAZY);
              if (!is) is = dlopen("/System/Library/Frameworks/IOSurface.framework/IOSurface", RTLD_LAZY);
              void* ik = dlopen("/System/Library/Frameworks/IOKit.framework/IOKit", RTLD_LAZY);
              void* ih = ik ? ik : RTLD_DEFAULT;
              g_surfcreate = (fn_surfcreate)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceCreate");
              g_surflock = (fn_surflock)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceLock");
              g_surfunlock = (fn_surfunlock)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceUnlock");
              g_allocusize = (fn_allocusize)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceGetAllocSize");
              g_baseaddr = (fn_baseaddr)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceGetBaseAddress");
              g_surfid = (fn_surfid)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceGetID");
              g_getsurf = (fn_getsurf)dlsym(RTLD_DEFAULT, "CVPixelBufferGetIOSurface");
              g_addclient = (fn_addclient)dlsym(ih, "IOConnectAddClient");
              g_setprop = (fn_setprop)dlsym(ih, "IOConnectSetCFProperty");
              g_setprops = (fn_setprops)dlsym(ih, "IOConnectSetCFProperties");
              g_getprop = (fn_getprop)dlsym(ih, "IOConnectGetCFProperty");
              g_setnotif = (fn_setnotif)dlsym(ih, "IOConnectSetNotificationPort");
              g_reqprobe = (fn_reqprobe)dlsym(ih, "IOServiceRequestProbe");
              g_trap0 = (fn_trap0)dlsym(ih, "IOConnectTrap0");
              g_trap1 = (fn_trap1)dlsym(ih, "IOConnectTrap1");
              g_trap2 = (fn_trap2)dlsym(ih, "IOConnectTrap2");
              g_trap3 = (fn_trap3)dlsym(ih, "IOConnectTrap3");
              g_trap4 = (fn_trap4)dlsym(ih, "IOConnectTrap4");
              g_trap5 = (fn_trap5)dlsym(ih, "IOConnectTrap5");
              g_trap6 = (fn_trap6)dlsym(ih, "IOConnectTrap6");
              int ntr = (g_trap0?1:0)+(g_trap1?1:0)+(g_trap2?1:0)+(g_trap3?1:0)+(g_trap4?1:0)+(g_trap5?1:0)+(g_trap6?1:0);
              plog(@"syms is=%p create=%p lock=%p base=%p alloc=%p addclient=%p setprop=%p setprops=%p getprop=%p setnotif=%p reqprobe=%p traps=%d",
                   is, (void*)g_surfcreate, (void*)g_surflock, (void*)g_baseaddr, (void*)g_allocusize,
                   (void*)g_addclient, (void*)g_setprop, (void*)g_setprops, (void*)g_getprop, (void*)g_setnotif,
                   (void*)g_reqprobe, ntr);
              plog(@"SYM addclient %s", g_addclient ? "ok" : "no");
              plog(@"SYM setprop %s", g_setprop ? "ok" : "no");
              plog(@"SYM setprops %s", g_setprops ? "ok" : "no");
              plog(@"SYM getprop %s", g_getprop ? "ok" : "no");
              plog(@"SYM setnotif %s", g_setnotif ? "ok" : "no");
              plog(@"SYM reqprobe %s", g_reqprobe ? "ok" : "no");
              plog(@"SYM traps %d", ntr);
              plog(@"PROBESYM %s", g_reqprobe ? "ok" : "no");
              ulog(@"IOSurface=%s addclient=%s setprop=%s getprop=%s setnotif=%s traps=%d",
                   is ? "ok" : "FAIL", g_addclient ? "ok" : "FAIL", g_setprop ? "ok" : "FAIL",
                   g_getprop ? "ok" : "FAIL", g_setnotif ? "ok" : "FAIL", ntr);

              plog(@"=== LAUNCH step=%d build=%s wake=0x%x", g_step, BUILD_TAG, g_wake);
              if (g_fd >= 0) fsync(g_fd);
              ulog(@"BUILD %s", BUILD_TAG);
              ulog(@"STEP %d/%d: %s", g_step, STEP_MAX, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);

              if (g_step > 15 && (g_nconn == 0 || g_pairn == 0)) {
                  ulog(@"REHYDRATE from %d (conns=%d pair=%d)", g_step, g_nconn, g_pairn);
                  plog(@"REHYDRATE need conns=%d pair=%d step=%d", g_nconn, g_pairn, g_step);
                  if (prologue()) {
                      g_step = 16; save_step(g_step);
                      ulog(@"REHYDRATE ok -> resume 16");
                  } else {
                      g_step = 5; save_step(g_step);
                      unlink(doc_file("try.txt").UTF8String);
                      ulog(@"REHYDRATE fail -> restart 5");
                      plog(@"REHYDRATE FAIL restart 5");
                  }
              }

              int svc = find_root();
              ulog(@"svc=%d", svc);
              if (!g_root) { ulog(@"NO ROOT"); g_stop = 1; }

              while (g_step <= STEP_MAX && !g_stop) {
                  load_try();
                  if (g_try >= TRY_MAX) { ulog(@"SKIP %d", g_step); plog(@"SKIP %d", g_step); g_step++; save_step(g_step); usleep(150000); continue; }
                  g_try++; save_try();
                  ulog(@"CHAIN %d %s", g_step, STEP_NAME[g_step]);
                  int h0 = g_hits, d0 = g_done;
                  do_step(g_step);
                  int dh = g_hits - h0, dd = g_done - d0;
                  plog(@"STEP %d calls+%d hits+%d relive=%d", g_step, dd, dh, g_relive);
                  plog(@"LIVE step=%d conns=%d vic=%d pair=%d probes=%d badarg=%d writes=%d oob=%d gap=%d outw=%d trapok=%d sigp=%d propok=%d getpok=%d probeok=%d notifok=%d notifmsg=%d hi=%d tblmask=0x%llx",
                       g_step, g_nconn, g_vicn, g_pairn, g_probes, g_badarg, g_canary_w, g_oobsz, g_gapread, g_outw, g_trap_ok, g_sigp, g_propok, g_getpropok, g_probe_ok, g_notifok, g_notifmsg, g_hi_sel, (unsigned long long)g_tbl_mask);
                  if (g_fd >= 0) fsync(g_fd);
                  ulog(@"STEP %d SURVIVED (+%d calls)", g_step, dd);
                  g_step++; save_step(g_step);
                  if (g_step <= STEP_MAX) usleep(250000);
              }
              ulog(@"CHAIN END"); plog(@"CHAIN END");
              summary();
              verdict();
              if (g_fd >= 0) { fsync(g_fd); close(g_fd); g_fd = -1; }
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              g_lines = [NSMutableArray array];
              signal(SIGSEGV, sigh); signal(SIGBUS, sigh); signal(SIGABRT, sigh); signal(SIGILL, sigh); signal(SIGFPE, sigh);
              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;
              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 44, 344, 44)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:9 weight:UIFontWeightRegular];
              g_hb.numberOfLines = 3;
              g_hb.text = @BUILD_TAG;
              [vc.view addSubview:g_hb];
              CGRect r = vc.view.bounds; r.origin.y = 92; r.size.height -= 100;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot";
              [vc.view addSubview:g_tv];
              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];
              [NSTimer scheduledTimerWithTimeInterval:0.25 repeats:YES block:^(NSTimer*) {
                  g_tick++;
                  if (g_tick % 4 == 0) refresh_counts();
                  g_hb.text = [NSString stringWithFormat:@"%s %d/%d conn=%d vic=%d pair=%d pr=%d bad=%d w=%d oob=%d gap=%d ow=%d add=%d tr=%d pp=%d gpo=%d pq=%d nf=%d msg=%d sg=%d hi=%d tm=%llx ok=%llx", BUILD_TAG, g_step, STEP_MAX, g_nconn, g_vicn, g_pairn, g_probes, g_badarg, g_canary_w, g_oobsz, g_gapread, g_outw, g_addok, g_trap_ok, g_propok, g_getpropok, g_probe_ok, g_notifok, g_notifmsg, g_sigp, g_hi_sel, (unsigned long long)g_tbl_mask, (unsigned long long)g_ok_sel];
                  flush_ui();
              }];
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC), dispatch_get_global_queue(0,0), ^{ run(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) { @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); } }
          MAINEOF

      - name: plist
        run: |
          cat > out/Payload/probe.app/Info.plist <<'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>probe</string>
            <key>CFBundleIdentifier</key><string>com.buurza47.probe</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>probe</string>
            <key>CFBundleDisplayName</key><string>buurd73</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>73</string>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          </dict></plist>
          PEOF
          plutil -lint out/Payload/probe.app/Info.plist
          wc -l Sources/main.m

      - name: api-guard
        run: |
          set -e
          for sym in IOConnectSetCFProperty IOConnectSetCFProperties IOConnectGetCFProperty IOConnectSetNotificationPort IOConnectAddClient IOServiceRequestProbe; do
            if grep -n "$sym" Sources/main.m; then
              echo "::warning::$sym referenced — confirm dlsym, never by name"
            fi
          done

      - name: avail-guard
        run: |
          set -e
          if grep -nE '\bIOServiceRequestProbe\s*\(' Sources/main.m | grep -v 'g_reqprobe'; then
            echo "::warning::direct IOServiceRequestProbe call — should go through g_reqprobe"
          fi || true

      - name: cast-guard
        run: |
          set -e
          if grep -nE '__bridge CFTypeRef\)[A-Za-z_]' Sources/main.m; then
            echo "::warning::__bridge on a CF type — use a plain (CFTypeRef) cast"
          fi || true

      - name: build
        run: |
          set -euo pipefail
          APP=out/Payload/probe.app
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          find stub -type f
          xcrun -sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc \
            -isysroot "$SDK" -I stub -O1 -std=gnu11 \
            -Wno-implicit-function-declaration -Wno-typedef-redefinition \
            -Wno-deprecated-declarations -Wno-nullability-completeness \
            -Wno-c2x-extensions \
            -framework UIKit -framework Foundation -framework CoreFoundation \
            -framework IOKit -framework VideoToolbox -framework CoreMedia \
            -framework CoreVideo -framework Security \
            Sources/main.m -o "$APP/probe"
          chmod +x "$APP/probe"
          file "$APP/probe"
          lipo -info "$APP/probe"

      - name: sign
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none out/Payload/probe.app/probe
          otool -l out/Payload/probe.app/probe | grep -A1 LC_CODE_SIGNATURE | head -3

      - name: ipa
        run: |
          set -euo pipefail
          test -f out/Payload/probe.app/probe || { echo "NO BINARY"; exit 1; }
          cd out && rm -f probe.ipa && zip -r -q probe.ipa Payload && cd ..
          test -s out/probe.ipa || { echo "ZIP EMPTY"; exit 1; }
          shasum -a 256 out/probe.ipa

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: probe-ipa-${{ github.run_number }}-${{ github.run_attempt }}
          path: out/probe.ipa
          if-no-files-found: error
          retention-days: 3
