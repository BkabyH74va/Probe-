name: build
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scaffold
        run: |
          mkdir -p Sources
          cat > project.yml <<'PROJEOF'
          name: probe
          options: { bundleIdPrefix: com.buurza32, deploymentTarget: { iOS: "18.0" } }
          targets:
            probe:
              type: application
              platform: iOS
              sources: [Sources]
              entitlements: { path: probe.entitlements }
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: buurd32
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "34"
                  UILaunchScreen: {}
              settings:
                ARCHS: "arm64"
                SUPPORTED_PLATFORMS: "iphoneos"
                SDKROOT: "iphoneos"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                OTHER_CFLAGS: "-Wno-implicit-function-declaration"
              dependencies:
                - sdk: IOKit.framework
                - sdk: UIKit.framework
                - sdk: VideoToolbox.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
                - sdk: Security.framework
          PROJEOF
          cat > probe.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>get-task-allow</key><true/>
            <key>com.apple.private.iosurface</key><true/>
            <key>com.apple.private.IOSurface</key><true/>
            <key>com.apple.private.memory.ownership-transfer</key><true/>
            <key>com.apple.private.coremedia.extensions</key><true/>
            <key>com.apple.private.video.encoder</key><true/>
            <key>com.apple.private.jpeg.encoder</key><true/>
            <key>com.apple.private.hardware.jpeg</key><true/>
            <key>com.apple.coremedia.allow-alternate-video-decoder-selection</key><true/>
            <key>com.apple.private.trusted-certs</key><true/>
          </dict></plist>
          ENTEOF
          cat > Sources/main.m <<'MAINEOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <VideoToolbox/VideoToolbox.h>
          #import <CoreVideo/CoreVideo.h>
          #import <Security/Security.h>
          #import <mach/mach.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>
          #include <stdarg.h>
          #include <dlfcn.h>

          extern int csops(pid_t pid, unsigned int ops, void* uaddr, size_t usize);

          typedef uint32_t (*fn_surfid)(IOSurfaceRef);
          typedef kern_return_t (*fn_addclient)(io_connect_t, io_connect_t);
          static fn_addclient g_addclient = NULL;

          #define BUILD_TAG "v32-children"
          #define MAXC 40
          #define STEP_MAX 21
          #define TRY_MAX 2
          #define MAXCHILD 8
          #define FIXED 4096
          #define SEL_N 32
          #define SCO 6
          #define CSZ_N 4
          #define MAG_N 6
          #define SVC_N 6
          #define UNTRIED ((kern_return_t)0xffffffff)

          static UITextView* g_tv;
          static UILabel* g_hb;
          static NSMutableArray* g_lines;
          static volatile int g_hits = 0, g_done = 0;
          static volatile int g_step = 0;
          static volatile int g_stop = 0;
          static volatile int g_vt_done = 0;
          static volatile int g_ok4 = 0;
          static volatile int g_ok0 = 0;
          static volatile int g_ok5 = 0;
          static volatile int g_5flip = 0;
          static volatile int g_m1hit = 0;
          static volatile int g_m2hit = 0;
          static int g_try = 0;
          static int g_fd = -1;
          static int g_nchild = 0;
          static int g_root_idx = -1;
          static int g_best = -1;
          static uint32_t g_sid = 0;
          static io_service_t g_root = 0;
          static io_service_t g_child[MAXCHILD + 1];
          static NSMutableSet* g_seen;
          static pthread_mutex_t g_lk = PTHREAD_MUTEX_INITIALIZER;
          static VTCompressionSessionRef g_vt = NULL;
          static CVPixelBufferRef g_surf = NULL;
          static mach_port_t g_wake = MACH_PORT_NULL;

          static io_connect_t g_conn[MAXC];
          static uint32_t g_ctype[MAXC];
          static int g_node[MAXC];
          static kern_return_t g_s9res[MAXC];
          static int g_nconn = 0;

          static int g_hit_s[SEL_N];
          static size_t g_bsi[SEL_N];
          static size_t g_bso[SEL_N];
          static uint32_t g_bmode[SEL_N];

          static int g_oks[SEL_N];
          static uint32_t g_okm[SEL_N];
          static uint32_t g_oksi[SEL_N];
          static size_t g_okzi[SEL_N];
          static size_t g_okzo[SEL_N];

          static int g_w4 = 0;
          static uint32_t g_w4_sic = 0;
          static size_t g_w4_zis = 0;
          static size_t g_w4_zos = 0;
          static uint8_t g_w4_pay[FIXED];
          static uint64_t g_w4_sc[SCO] = {0};
          static kern_return_t g_5prev = 0xe00002bc;
          static int g_s4_att = 0;

          static const size_t CSZ[CSZ_N] = { 24, 32, 64, 4096 };
          static const uint64_t MAG[MAG_N] = { 0x4a504547ULL, 0x6a706567ULL, 0x42475241ULL, 0x00000001ULL, 0xdeadbeefULL, 0xfeedfaceULL };
          static const char* SVC[SVC_N] = {
              "AppleJPEGDriver", "AppleJPEGDriverUserClient", "AppleJPEGDecoder",
              "AppleJPEGEncoder", "AppleJPEGAccelerator", "AppleJPEGInterface"
          };

          static const char* STEP_NAME[STEP_MAX + 1] = {
              "boot", "census", "sig-blob", "tree-up", "svc-open", "dump-tree",
              "prop-dump", "vt-init", "vt-encode", "root-open", "addclient",
              "child-open", "child-sweep", "ping-sweep", "s9-payload", "sweep-m1",
              "out-struct", "seq-test", "combo-m1", "confirm", "summary", "verdict"
          };

          static void ulog(NSString* fmt, ...) {
              va_list ap; va_start(ap, fmt);
              NSString* s = [[NSString alloc] initWithFormat:fmt arguments:ap];
              va_end(ap);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [g_lines addObject:s];
                  if (g_lines.count > 240) [g_lines removeObjectsInRange:NSMakeRange(0, 48)];
              });
          }
          static void plog(NSString* fmt, ...) {
              if (g_fd < 0) return;
              va_list ap; va_start(ap, fmt);
              NSString* s = [[NSString alloc] initWithFormat:fmt arguments:ap];
              va_end(ap);
              NSData* d = [[s stringByAppendingString:@"\n"] dataUsingEncoding:NSUTF8StringEncoding];
              pthread_mutex_lock(&g_lk);
              write(g_fd, d.bytes, d.length);
              pthread_mutex_unlock(&g_lk);
          }
          static void flush_ui(void) {
              g_tv.text = [g_lines componentsJoinedByString:@"\n"];
              if (g_lines.count) [g_tv scrollRangeToVisible:NSMakeRange(g_tv.text.length, 0)];
          }
          static void sigh(int sig) {
              char b[96];
              int n = snprintf(b, sizeof(b), "SIGNAL %d at step %d (%s)\n", sig, g_step, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);
              if (g_fd >= 0) { write(g_fd, b, n); fsync(g_fd); }
              signal(sig, SIG_DFL);
              raise(sig);
          }
          static NSString* kr_name(kern_return_t kr) {
              switch (kr) {
                  case KERN_SUCCESS: return @"OK";
                  case 0xe00002bc: return @"Error";
                  case 0xe00002bd: return @"NoMem";
                  case 0xe00002be: return @"NoRes";
                  case 0xe00002c1: return @"NotPriv";
                  case 0xe00002c2: return @"BadArg";
                  case 0xe00002c5: return @"Excl";
                  case 0xe00002c7: return @"Unsup";
                  case 0xe00002cc: return @"NotOpen";
                  case 0xe00002d4: return @"Busy";
                  case 0xe00002e2: return @"NotPerm";
                  case 0xe00002f0: return @"NotFound";
                  case 0xdeadbeef: return @"dup";
                  default: return [NSString stringWithFormat:@"0x%x", kr];
              }
          }
          static NSString* hexn(const uint8_t* p, size_t n, size_t cap) {
              if (!n) return @"-";
              if (n > cap) n = cap;
              NSMutableString* s = [NSMutableString string];
              for (size_t i = 0; i < n; i++) [s appendFormat:@"%02x", p[i]];
              return s;
          }
          static NSString* doc_file(const char* f) {
              NSString* d = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              return [d stringByAppendingPathComponent:@(f)];
          }
          static void doc_path(const char* f, char* b, size_t n) {
              NSString* p = doc_file(f);
              strncpy(b, p.UTF8String, n - 1);
              b[n - 1] = 0;
          }
          static int load_step(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("step.txt") encoding:NSUTF8StringEncoding error:nil];
              return s ? s.intValue : 0;
          }
          static void save_step(int v) {
              [[NSString stringWithFormat:@"%d", v] writeToFile:doc_file("step.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_try(void) {
              g_try = 0;
              NSString* s = [NSString stringWithContentsOfFile:doc_file("try.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!s) return;
              NSArray<NSString*>* f = [s componentsSeparatedByString:@":"];
              if (f.count != 2) return;
              NSString* a = f[0];
              NSString* b = f[1];
              if (a.intValue == g_step) g_try = b.intValue;
          }
          static void save_try(void) {
              [[NSString stringWithFormat:@"%d:%d", g_step, g_try] writeToFile:doc_file("try.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void latch_build(void) {
              NSString* bt = [NSString stringWithContentsOfFile:doc_file("build.txt") encoding:NSUTF8StringEncoding error:nil];
              if ([bt isEqualToString:@BUILD_TAG]) return;
              unlink(doc_file("state.txt").UTF8String);
              save_step(0);
              g_try = 0;
              save_try();
              g_root_idx = -1;
              g_best = -1;
              [@BUILD_TAG writeToFile:doc_file("build.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_state(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              for (NSString* ln in [s componentsSeparatedByString:@"\n"]) {
                  if ([ln hasPrefix:@"K "]) [g_seen addObject:[ln substringFromIndex:2]];
              }
          }

          static void note_ok(uint32_t sel, uint32_t mode, uint32_t sic, size_t zis, size_t zos) {
              if (sel >= SEL_N) return;
              g_oks[sel] = 1;
              g_okm[sel] = mode;
              g_oksi[sel] = sic;
              g_okzi[sel] = zis;
              g_okzo[sel] = zos;
              g_hit_s[sel] = 1;
              g_bmode[sel] = mode;
              g_bsi[sel] = zis;
              g_bso[sel] = zos;
          }

          static kern_return_t rawv(io_connect_t c, uint32_t sel, int mode, uint64_t* sin, uint32_t sic,
                                    uint8_t* sinS, size_t zis, uint64_t* sout, size_t* soCnt,
                                    uint8_t* soutS, size_t* soSz) {
              uint32_t sc = soCnt ? (uint32_t)*soCnt : 0;
              size_t szb = soSz ? *soSz : 0;
              kern_return_t kr;
              if (mode == 0) {
                  kr = IOConnectCallScalarMethod(c, sel, sin, sic, sout, &sc);
              } else if (mode == 1) {
                  kr = IOConnectCallMethod(c, sel, sin, sic, zis ? sinS : NULL, zis, sout, &sc, szb ? soutS : NULL, &szb);
              } else {
                  uint64_t ref = 1;
                  kr = IOConnectCallAsyncMethod(c, sel, g_wake, &ref, 1, sin, sic, zis ? sinS : NULL, zis, sout, &sc, szb ? soutS : NULL, &szb);
              }
              if (soCnt) *soCnt = sc;
              if (soSz) *soSz = szb;
              return kr;
          }

          static kern_return_t hb(void) {
              if (g_best < 0 || g_best >= g_nconn) return (kern_return_t)0xe00002cc;
              uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
              return rawv(g_conn[g_best], 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
          }

          static kern_return_t p5(const char* tag, int loud) {
              if (g_best < 0) return (kern_return_t)0xe00002cc;
              uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[FIXED]; size_t szb = 0;
              kern_return_t kr = rawv(g_conn[g_best], 9, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
              if (kr != g_5prev) {
                  plog(@"FLIP9 %s -> %@ (was %@)", tag, kr_name(kr), kr_name(g_5prev));
                  ulog(@"### FLIP9 %s -> %@", tag, kr_name(kr));
                  g_5prev = kr;
                  __sync_fetch_and_add(&g_5flip, 1);
                  if (kr == KERN_SUCCESS) { __sync_fetch_and_add(&g_ok5, 1); note_ok(9, 0, 0, 0, 0); }
              } else if (loud) {
                  ulog(@"### 9 %@ at %s", kr_name(kr), tag);
              }
              return kr;
          }

          static void desc_into(uint8_t* in, size_t n) {
              uint32_t w = 1920, h = 1080, f = 0x42475241, bpr = 7680, pl = 1;
              if (n >= 4) memcpy(in, &g_sid, 4);
              if (n >= 8) memcpy(in + 4, &w, 4);
              if (n >= 12) memcpy(in + 8, &h, 4);
              if (n >= 16) memcpy(in + 12, &f, 4);
              if (n >= 20) memcpy(in + 16, &bpr, 4);
              if (n >= 24) memcpy(in + 20, &pl, 4);
          }

          static void att(const char* tag, int mode, uint32_t sic, size_t zis, size_t zos, uint8_t* in, uint64_t* sin) {
              if (g_best < 0) return;
              g_s4_att++;
              uint64_t so[SCO] = {0}; size_t sc = 0;
              uint8_t sb[FIXED]; size_t szb = 0;
              kern_return_t h = hb();
              kern_return_t kr = rawv(g_conn[g_best], 4, mode, sin, sic, in, zis, so, &sc, sb, &szb);
              kern_return_t k9 = p5(tag, 0);
              __sync_fetch_and_add(&g_done, 1);
              plog(@"S4 %s m%d n%u/%zu/%zu hb=%@ -> %@ sc=%zu szb=%zu s9=%@ so0=%llu %@",
                   tag, mode, sic, zis, zos, kr_name(h), kr_name(kr), sc, szb, kr_name(k9),
                   (unsigned long long)so[0], hexn(sb, szb, 96));
              if (kr == KERN_SUCCESS) {
                  plog(@"WIN4 %s m%d n%u/%zu/%zu so0=%llu sc=%zu szb=%zu", tag, mode, sic, zis, zos, (unsigned long long)so[0], sc, szb);
                  ulog(@"!!! WIN4 %s m%d %u/%zu/%zu so0=%llu", tag, mode, sic, zis, zos, (unsigned long long)so[0]);
                  __sync_fetch_and_add(&g_hits, 1);
                  __sync_fetch_and_add(&g_ok4, 1);
                  note_ok(4, (uint32_t)mode, sic, zis, zos);
                  if (!g_w4) {
                      g_w4 = 1; g_w4_sic = sic; g_w4_zis = zis; g_w4_zos = zos;
                      if (in) memcpy(g_w4_pay, in, zis > FIXED ? FIXED : zis);
                      if (sin) memcpy(g_w4_sc, sin, sizeof(uint64_t) * SCO);
                  }
              } else if (kr != 0xe00002bc && kr != 0xe00002c2) {
                  ulog(@"!! S4 %s m%d -> %@", tag, mode, kr_name(kr));
              }
              usleep(300);
          }

          static int find_root(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching("AppleJPEGDriver"), &it) != KERN_SUCCESS) return 0;
              int svc = 0;
              io_service_t s;
              while ((s = IOIteratorNext(it))) {
                  svc++;
                  if (!g_root) g_root = s; else IOObjectRelease(s);
              }
              IOObjectRelease(it);
              return svc;
          }

          static void census(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching("IOService"), &it) != KERN_SUCCESS) {
                  ulog(@"no census"); return;
              }
              NSMutableDictionary* cnt = [NSMutableDictionary dictionary];
              io_object_t o; int n = 0;
              while ((o = IOIteratorNext(it)) && n < 4000) {
                  n++;
                  io_name_t cls; IOObjectGetClass(o, cls);
                  NSString* s = @(cls);
                  if ([s rangeOfString:@"JPEG"].location != NSNotFound || [s rangeOfString:@"jpeg"].location != NSNotFound) {
                      NSNumber* c = cnt[s];
                      cnt[s] = @(c.intValue + 1);
                  }
                  IOObjectRelease(o);
              }
              IOObjectRelease(it);
              for (NSString* k in cnt) {
                  plog(@"JCLS %@ x%d", k, [cnt[k] intValue]);
                  ulog(@"JCLS %@ x%d", k, [cnt[k] intValue]);
              }
              plog(@"census nodes=%d jcls=%lu", n, (unsigned long)cnt.count);
              ulog(@"census=%d jcls=%lu", n, (unsigned long)cnt.count);
          }

          static void dump_sig(void) {
              unsigned int fl = 0;
              int rc = csops(getpid(), 0, &fl, sizeof(fl));
              plog(@"csops rc=%d f=0x%x gta=%d dpl=%d plat=%d", rc, fl, (fl & 4) ? 1 : 0, (fl & 0x2000000) ? 1 : 0, (fl & 0x4000000) ? 1 : 0);
              ulog(@"csops rc=%d f=0x%x", rc, fl);
          }

          static void dump_node(io_object_t o, const char* lbl) {
              io_name_t cls; IOObjectGetClass(o, cls);
              plog(@"NODE %s class=%s", lbl, cls);
              ulog(@"NODE %s %s", lbl, cls);
          }

          static void tree_up(void) {
              if (!g_root) { ulog(@"no root"); return; }
              io_registry_entry_t par = 0;
              if (IORegistryEntryGetParentEntry(g_root, kIOServicePlane, &par) != KERN_SUCCESS || !par) {
                  ulog(@"no parent"); return;
              }
              io_name_t pc; IOObjectGetClass(par, pc);
              plog(@"PARENT %s", pc);
              ulog(@"PARENT %s", pc);
              io_iterator_t it = 0;
              if (IORegistryEntryGetChildIterator(par, kIOServicePlane, &it) == KERN_SUCCESS) {
                  io_object_t s; int i = 0;
                  while ((s = IOIteratorNext(it)) && i < 24) {
                      i++;
                      char lb[16]; snprintf(lb, sizeof(lb), "p%d", i);
                      dump_node(s, lb);
                      io_connect_t c = 0;
                      kern_return_t kr = IOServiceOpen(s, mach_task_self(), 0, &c);
                      plog(@"SIB %d open=%@", i, kr_name(kr));
                      ulog(@"SIB %d open=%@", i, kr_name(kr));
                      if (kr == KERN_SUCCESS) IOServiceClose(c);
                      IOObjectRelease(s);
                  }
                  IOObjectRelease(it);
              }
              IOObjectRelease(par);
          }

          static void svc_open(void) {
              for (int i = 0; i < SVC_N; i++) {
                  io_iterator_t it = 0;
                  if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching(SVC[i]), &it) != KERN_SUCCESS) {
                      plog(@"SVC %s nomatch", SVC[i]);
                      continue;
                  }
                  io_service_t s; int n = 0;
                  while ((s = IOIteratorNext(it))) {
                      n++;
                      if (n == 1) {
                          for (uint32_t t = 0; t <= 3; t++) {
                              io_connect_t c = 0;
                              kern_return_t kr = IOServiceOpen(s, mach_task_self(), t, &c);
                              if (kr == KERN_SUCCESS) {
                                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
                                  kern_return_t k0 = rawv(c, 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                                  uint64_t s2[SCO] = {0}; size_t c2 = 0; uint8_t b2[64]; size_t z2 = 0;
                                  kern_return_t k2 = rawv(c, 2, 0, NULL, 0, NULL, 0, s2, &c2, b2, &z2);
                                  plog(@"SVC %s t%u open s0=%@ s2=%@", SVC[i], t, kr_name(k0), kr_name(k2));
                                  ulog(@"SVC %s t%u %@/%@", SVC[i], t, kr_name(k0), kr_name(k2));
                                  if (k0 == KERN_SUCCESS && g_nconn < MAXC) {
                                      g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_node[g_nconn] = -1 - i;
                                      if (g_best < 0) g_best = g_nconn;
                                      g_nconn++;
                                  } else {
                                      IOServiceClose(c);
                                  }
                              } else {
                                  plog(@"SVC %s t%u %@", SVC[i], t, kr_name(kr));
                              }
                          }
                      }
                      IOObjectRelease(s);
                  }
                  IOObjectRelease(it);
                  plog(@"SVC %s count=%d", SVC[i], n);
              }
          }

          static void dump_tree(void) {
              if (!g_root) { ulog(@"no root"); return; }
              dump_node(g_root, "0");
              io_iterator_t ch = 0;
              if (IORegistryEntryGetChildIterator(g_root, kIOServicePlane, &ch) != KERN_SUCCESS) {
                  ulog(@"no child iter"); return;
              }
              io_object_t c;
              while ((c = IOIteratorNext(ch)) && g_nchild < MAXCHILD) {
                  g_nchild++;
                  g_child[g_nchild] = c;
                  char lb[16]; snprintf(lb, sizeof(lb), "c%d", g_nchild);
                  dump_node(c, lb);
              }
              IOObjectRelease(ch);
              plog(@"children=%d", g_nchild);
              ulog(@"children=%d", g_nchild);
          }

          static void dump_props(io_object_t o, int node) {
              CFMutableDictionaryRef props = NULL;
              if (IORegistryEntryCreateCFProperties(o, &props, kCFAllocatorDefault, 0) != KERN_SUCCESS || !props) {
                  plog(@"PROPS %d none", node);
                  return;
              }
              NSDictionary* d = (__bridge NSDictionary*)props;
              for (id k in d) {
                  NSString* ks = [k description];
                  NSString* vs = [d[k] description];
                  if (vs.length > 200) vs = [vs substringToIndex:200];
                  plog(@"PROPS %d %@ = %@", node, ks, vs);
              }
              plog(@"PROPS %d count=%lu", node, (unsigned long)d.count);
              ulog(@"PROPS %d n=%lu", node, (unsigned long)d.count);
              CFRelease(props);
          }

          static void prop_dump(void) {
              if (!g_root) { ulog(@"no root"); return; }
              dump_props(g_root, 0);
              for (int i = 1; i <= g_nchild; i++) dump_props(g_child[i], i);
              plog(@"PROPS done children=%d", g_nchild);
              ulog(@"PROPS done children=%d", g_nchild);
          }

          static void vt_cb(void* ref, void* src, OSStatus st, VTEncodeInfoFlags fl, CMSampleBufferRef sb) { g_vt_done = 1; }

          static void vt_start(void) {
              VTCompressionSessionCreate(NULL, 1920, 1080, kCMVideoCodecType_H264, NULL, NULL, NULL, vt_cb, NULL, &g_vt);
              if (g_vt) VTCompressionSessionPrepareToEncodeFrames(g_vt);
          }

          static int vt_encode(void) {
              if (!g_vt) return -1;
              CVPixelBufferRef pb = NULL;
              NSDictionary* a = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              if (CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, (__bridge CFDictionaryRef)a, &pb) != kCVReturnSuccess) return -2;
              CVPixelBufferLockBaseAddress(pb, 0);
              memset(CVPixelBufferGetBaseAddress(pb), 0x80, CVPixelBufferGetDataSize(pb));
              CVPixelBufferUnlockBaseAddress(pb, 0);
              VTEncodeInfoFlags fl = 0;
              OSStatus st = VTCompressionSessionEncodeFrame(g_vt, pb, CMTimeMake(1, 30), CMTimeMake(1, 30), NULL, NULL, &fl);
              CVPixelBufferRelease(pb);
              for (int i = 0; i < 300 && !g_vt_done; i++) usleep(10000);
              return (int)st;
          }

          static int surf_make(void) {
              if (g_surf) return 1;
              NSDictionary* p = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              CVReturn r = CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, (__bridge CFDictionaryRef)p, &g_surf);
              if (r != kCVReturnSuccess || !g_surf) {
                  plog(@"surf=0 rc=%d", (int)r);
                  ulog(@"surf=0 rc=%d", (int)r);
                  return 0;
              }
              IOSurfaceRef s = CVPixelBufferGetIOSurface(g_surf);
              fn_surfid idf = (fn_surfid)dlsym(RTLD_DEFAULT, "IOSurfaceGetID");
              g_sid = (s && idf) ? idf(s) : 0;
              plog(@"surf=1 id=%u", g_sid);
              ulog(@"surf=1 id=%u", g_sid);
              return 1;
          }

          static void root_open(void) {
              NSMutableString* l = [NSMutableString string];
              for (uint32_t t = 0; t <= 1 && g_nconn < MAXC; t++) {
                  io_connect_t c = 0;
                  kern_return_t kr = IOServiceOpen(g_root, mach_task_self(), t, &c);
                  if (kr == KERN_SUCCESS) {
                      g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_node[g_nconn] = 0;
                      if (g_root_idx < 0) g_root_idx = g_nconn;
                      if (g_best < 0) g_best = g_nconn;
                      g_nconn++;
                      [l appendFormat:@"%u:OK ", t];
                  } else {
                      [l appendFormat:@"%u:%@ ", t, kr_name(kr)];
                  }
              }
              plog(@"rootopen conns=%d best=%d %@", g_nconn, g_best, l);
              ulog(@"rootopen conns=%d best=%d %@", g_nconn, g_best, l);
          }

          static void addclient(void) {
              if (g_nconn < 2) { ulog(@"addclient needs 2 conns"); return; }
              if (!g_addclient) { plog(@"ADDCLIENT unavailable"); ulog(@"ADDCLIENT unavailable"); return; }
              kern_return_t kr = g_addclient(g_conn[0], g_conn[1]);
              plog(@"ADDCLIENT c0+c1 -> %@", kr_name(kr));
              ulog(@"ADDCLIENT -> %@", kr_name(kr));
          }

          static void child_open(void) {
              NSMutableString* l = [NSMutableString string];
              for (int i = 1; i <= g_nchild; i++) {
                  if (!g_child[i]) { [l appendFormat:@"c%d:none ", i]; continue; }
                  for (uint32_t t = 0; t <= 2 && g_nconn < MAXC; t++) {
                      io_connect_t c = 0;
                      kern_return_t kr = IOServiceOpen(g_child[i], mach_task_self(), t, &c);
                      if (kr == KERN_SUCCESS) {
                          uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
                          kern_return_t k0 = rawv(c, 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                          plog(@"CHILDOPEN c%d t%u -> OK s0=%@", i, t, kr_name(k0));
                          [l appendFormat:@"c%d.t%u:OK/s0=%@" , i, t, kr_name(k0)];
                          g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_node[g_nconn] = i;
                          g_nconn++;
                      } else {
                          plog(@"CHILDOPEN c%d t%u -> %@", i, t, kr_name(kr));
                          [l appendFormat:@"c%d.t%u:%@ ", i, t, kr_name(kr)];
                      }
                  }
              }
              plog(@"childopen conns=%d %@", g_nconn, l);
              ulog(@"childopen conns=%d %@", g_nconn, l);
          }

          static void child_sweep(void) {
              NSMutableString* l = [NSMutableString string];
              int swept = 0;
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (g_node[ci] <= 0) continue;
                  int child = g_node[ci];
                  BOOL first = YES;
                  for (int pj = 0; pj < ci; pj++) if (g_node[pj] == child) { first = NO; break; }
                  if (!first) continue;
                  swept++;
                  for (uint32_t s = 0; s < SEL_N; s++) {
                      uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[128]; size_t szb = 0;
                      kern_return_t kr = rawv(g_conn[ci], s, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                      if (s == 9) g_s9res[ci] = kr;
                      __sync_fetch_and_add(&g_done, 1);
                      plog(@"CS c%d s%u -> %@ sc=%zu szb=%zu so0=%llu %@", child, s, kr_name(kr), sc, szb, (unsigned long long)so[0], hexn(sb, szb, 32));
                      if (kr == KERN_SUCCESS) {
                          [l appendFormat:@"c%d.s%u:OK ", child, s];
                          ulog(@"!!! CS c%d s%u OK so0=%llu", child, s, (unsigned long long)so[0]);
                          __sync_fetch_and_add(&g_hits, 1);
                          note_ok(s, 0, 0, 0, 0);
                      } else if (kr != 0xe00002c2) {
                          [l appendFormat:@"c%d.s%u:%@ ", child, s, kr_name(kr)];
                          ulog(@"!! CS c%d s%u -> %@", child, s, kr_name(kr));
                      }
                      usleep(200);
                  }
              }
              plog(@"CSWEEP n=%d %@", swept, l);
              ulog(@"CSWEEP n=%d %@", swept, l);
          }

          static void ping_sweep(void) {
              if (g_best < 0 && g_root_idx >= 0) g_best = g_root_idx;
              if (g_best < 0) { ulog(@"no conn"); return; }
              NSMutableString* l = [NSMutableString string];
              for (uint32_t s = 0; s < SEL_N; s++) {
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
                  kern_return_t kr = rawv(g_conn[g_best], s, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  if (s == 9) g_s9res[g_best] = kr;
                  plog(@"PING s%u -> %@ sc=%zu szb=%zu so0=%llu %@", s, kr_name(kr), sc, szb, (unsigned long long)so[0], hexn(sb, szb, 32));
                  if (kr == KERN_SUCCESS) {
                      [l appendFormat:@"%u:OK ", s];
                      note_ok(s, 0, 0, 0, 0);
                      ulog(@"PING s%u OK", s);
                  } else if (kr != 0xe00002c2) {
                      [l appendFormat:@"%u:%@ ", s, kr_name(kr)];
                      ulog(@"PING s%u -> %@", s, kr_name(kr));
                  }
                  usleep(200);
              }
              plog(@"PING m0 %@", l);
              ulog(@"PING m0 %@", l);
          }

          static void s9_payload(void) {
              static const size_t ZS[10] = { 0, 4, 8, 16, 24, 32, 64, 256, 1024, 4096 };
              int n = 0;
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (g_s9res[ci] == UNTRIED) continue;
                  if (g_s9res[ci] == 0xe00002c2) continue;
                  n++;
                  for (uint32_t sic = 0; sic <= 4; sic++) {
                      for (int z = 0; z < 10; z++) {
                          size_t zis = ZS[z];
                          if (sic == 0 && zis == 0) continue;
                          uint8_t* in = calloc(1, FIXED);
                          uint64_t sin[SCO] = {0};
                          if (!in) continue;
                          desc_into(in, zis);
                          for (uint32_t k = 0; k < sic && k < SCO; k++) sin[k] = MAG[k % MAG_N];
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[FIXED]; size_t szb = 0;
                          int mode = zis ? 1 : 0;
                          kern_return_t kr = rawv(g_conn[ci], 9, mode, sin, sic, in, zis, so, &sc, sb, &szb);
                          __sync_fetch_and_add(&g_done, 1);
                          plog(@"P9 n%d m%d sc_=%u zi=%zu -> %@ sc=%zu szb=%zu so0=%llu %@",
                               g_node[ci], mode, sic, zis, kr_name(kr), sc, szb, (unsigned long long)so[0], hexn(sb, szb, 64));
                          if (kr == KERN_SUCCESS) {
                              ulog(@"!!! P9 n%d sc_=%u zi=%zu OK so0=%llu", g_node[ci], sic, zis, (unsigned long long)so[0]);
                              __sync_fetch_and_add(&g_hits, 1);
                              note_ok(9, (uint32_t)mode, sic, zis, 0);
                          } else if (kr != 0xe00002c2) {
                              ulog(@"!! P9 n%d sc_=%u zi=%zu -> %@", g_node[ci], sic, zis, kr_name(kr));
                          }
                          free(in);
                          usleep(250);
                      }
                  }
              }
              ulog(@"p9 done conns=%d", n);
          }

          static void sweep_mode(int mode, const char* tag) {
              if (g_best < 0) { ulog(@"sweep no conn"); return; }
              NSMutableString* l = [NSMutableString string];
              for (uint32_t s = 0; s < SEL_N; s++) {
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[256]; size_t szb = 0;
                  kern_return_t h = hb();
                  kern_return_t kr = rawv(g_conn[g_best], s, mode, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  __sync_fetch_and_add(&g_done, 1);
                  plog(@"SW%s s%u hb=%@ -> %@ sc=%zu szb=%zu so0=%llu %@", tag, s, kr_name(h), kr_name(kr), sc, szb, (unsigned long long)so[0], hexn(sb, szb, 64));
                  if (kr == KERN_SUCCESS) {
                      [l appendFormat:@"%u:OK ", s];
                      ulog(@"!!! SW%s s%u OK so0=%llu", tag, s, (unsigned long long)so[0]);
                      __sync_fetch_and_add(&g_hits, 1);
                      __sync_fetch_and_add(&g_m1hit, 1);
                      note_ok(s, (uint32_t)mode, 0, 0, 0);
                  } else if (kr != 0xe00002c2) {
                      [l appendFormat:@"%u:%@ ", s, kr_name(kr)];
                      ulog(@"!! SW%s s%u -> %@", tag, s, kr_name(kr));
                      __sync_fetch_and_add(&g_m1hit, 1);
                      if (!g_hit_s[s]) { g_hit_s[s] = 1; g_bmode[s] = (uint32_t)mode; }
                  }
                  usleep(250);
              }
              plog(@"SW%s %@", tag, l);
              ulog(@"SW%s done m1hit=%d", tag, g_m1hit);
          }

          static void out_struct(void) {
              if (g_best < 0) return;
              static const uint32_t SEL3[3] = { 4, 5, 9 };
              static const size_t ZO[2] = { 128, 4096 };
              for (int d = 0; d < 3; d++) {
                  for (int o = 0; o < 2; o++) {
                      for (int zi = 0; zi < 2; zi++) {
                          size_t zis = zi ? 4096 : 0;
                          uint8_t* in = calloc(1, FIXED);
                          uint64_t sin[SCO] = {0};
                          if (!in) continue;
                          desc_into(in, zis);
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[FIXED]; size_t szb = 0;
                          kern_return_t h = hb();
                          kern_return_t kr = rawv(g_conn[g_best], SEL3[d], 1, sin, 0, in, zis, so, &sc, sb, &szb);
                          __sync_fetch_and_add(&g_done, 1);
                          plog(@"OS s%u m1 zi=%zu zo=%zu hb=%@ -> %@ sc=%zu szb=%zu so0=%llu %@",
                               SEL3[d], zis, ZO[o], kr_name(h), kr_name(kr), sc, szb,
                               (unsigned long long)so[0], hexn(sb, szb, 96));
                          if (kr == KERN_SUCCESS) {
                              ulog(@"!!! OS s%u m1 zi=%zu zo=%zu OK", SEL3[d], zis, ZO[o]);
                              __sync_fetch_and_add(&g_hits, 1);
                              note_ok(SEL3[d], 1, 0, zis, ZO[o]);
                              if (SEL3[d] == 4 && !g_w4) {
                                  g_w4 = 1; g_w4_sic = 0; g_w4_zis = zis; g_w4_zos = ZO[o];
                                  memcpy(g_w4_pay, in, zis > FIXED ? FIXED : zis);
                              }
                          } else if (kr != 0xe00002c2 && kr != 0xe00002bc) {
                              ulog(@"!! OS s%u m1 zi=%zu zo=%zu -> %@", SEL3[d], zis, ZO[o], kr_name(kr));
                          }
                          free(in);
                          usleep(300);
                      }
                  }
              }
          }

          static void seq_test(void) {
              if (g_best < 0) { ulog(@"seq no conn"); return; }
              static const uint32_t T[3] = { 4, 5, 9 };
              uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
              kern_return_t k0 = rawv(g_conn[g_best], 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
              plog(@"SEQ s0 -> %@", kr_name(k0));
              ulog(@"SEQ s0 -> %@", kr_name(k0));
              for (int i = 0; i < 3; i++) {
                  for (int m = 0; m <= 1; m++) {
