              else if (a0 == 2) sin[0] = g_sid;
              else if (a0 == 3) for (uint32_t k = 0; k < SCO; k++) sin[k] = SV[k % SV_N];
              else if (a0 == 4) sin[0] = (uint64_t)g_cbuf;
