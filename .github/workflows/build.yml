name: build
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scaffold
        run: |
          mkdir -p Sources
          cat > project.yml <<'PROJEOF'
          name: probe
          options: { bundleIdPrefix: com.buurza25, deploymentTarget: { iOS: "18.0" } }
          targets:
            probe:
              type: application
              platform: iOS
              sources: [Sources]
              entitlements: { path: probe.entitlements }
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: buurd25
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "25"
                  UILaunchScreen: {}
              settings:
                ARCHS: "arm64"
                SUPPORTED_PLATFORMS: "iphoneos"
                SDKROOT: "iphoneos"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                OTHER_CFLAGS: "-Wno-implicit-function-declaration"
              dependencies:
                - sdk: IOKit.framework
                - sdk: UIKit.framework
                - sdk: VideoToolbox.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
                - sdk: Security.framework
          PROJEOF
          cat > probe.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>get-task-allow</key><true/>
          </dict></plist>
          ENTEOF
          cat > Sources/main.m <<'MAINEOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <VideoToolbox/VideoToolbox.h>
          #import <CoreVideo/CoreVideo.h>
          #import <Security/Security.h>
          #import <mach/mach.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>
          #include <dlfcn.h>

          extern int csops(pid_t pid, unsigned int ops, void* uaddr, size_t usize);

          typedef struct __SecTask *SecTaskRef;
          typedef SecTaskRef (*fn_create)(CFAllocatorRef);
          typedef CFTypeRef (*fn_copy)(SecTaskRef, CFStringRef, CFErrorRef*);
          typedef uint32_t (*fn_surfid)(IOSurfaceRef);

          #define BUILD_TAG "v25-abi"
          #define MAXC 128
          #define STEP_MAX 14
          #define TRY_MAX 2
          #define MAXCHILD 8
          #define TYPE_MAX 7
          #define FIXED 4096
          #define SEL_N 32
          #define SZ_N 6
          #define SCO 5

          static UITextView* g_tv;
          static UILabel* g_hb;
          static NSMutableArray* g_lines;
          static volatile int g_hits = 0, g_done = 0;
          static volatile int g_step = 0;
          static volatile int g_stop = 0;
          static volatile int g_vt_done = 0;
          static volatile int g_ok4 = 0;
          static volatile int g_ok0 = 0;
          static int g_try = 0;
          static int g_fd = -1;
          static int g_nchild = 0;
          static int g_root_idx = -1;
          static uint32_t g_sid = 0;
          static io_service_t g_root = 0;
          static io_service_t g_child[MAXCHILD + 1];
          static NSMutableSet* g_seen;
          static pthread_mutex_t g_lk = PTHREAD_MUTEX_INITIALIZER;
          static VTCompressionSessionRef g_vt = NULL;
          static CVPixelBufferRef g_surf = NULL;
          static mach_port_t g_wake = MACH_PORT_NULL;

          static io_connect_t g_conn[MAXC];
          static uint32_t g_ctype[MAXC];
          static int g_node[MAXC];
          static int g_nconn = 0;

          static int g_hit_s[SEL_N];
          static size_t g_bsi[SEL_N];
          static size_t g_bso[SEL_N];
          static uint32_t g_bmode[SEL_N];

          static const size_t SZ[SZ_N] = { 0, 8, 16, 32, 64, 4096 };

          static const char* STEP_NAME[STEP_MAX + 1] = {
              "boot", "census", "sig-blob", "prop-dump", "vt-init", "vt-encode",
              "dump-tree", "open-all", "scalar-sweep", "method-grid", "async-sweep",
              "open-chain", "surf-probe", "confirm", "verdict"
          };

          static void ui(NSString* s) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  [g_lines addObject:s];
                  if (g_lines.count > 200) [g_lines removeObjectsInRange:NSMakeRange(0, 40)];
              });
          }
          static void flush_ui(void) {
              g_tv.text = [g_lines componentsJoinedByString:@"\n"];
              if (g_lines.count) [g_tv scrollRangeToVisible:NSMakeRange(g_tv.text.length, 0)];
          }
          static void persist(NSString* s) {
              if (g_fd < 0) return;
              NSData* d = [[s stringByAppendingString:@"\n"] dataUsingEncoding:NSUTF8StringEncoding];
              pthread_mutex_lock(&g_lk);
              write(g_fd, d.bytes, d.length);
              pthread_mutex_unlock(&g_lk);
          }
          static void bread(const char* tag) {
              persist([NSString stringWithFormat:@"PRE step=%d %s", g_step, tag]);
              if (g_fd >= 0) fsync(g_fd);
          }
          static void sigh(int sig) {
              char b[96];
              int n = snprintf(b, sizeof(b), "SIGNAL %d at step %d (%s)\n",
                               sig, g_step, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);
              if (g_fd >= 0) { write(g_fd, b, n); fsync(g_fd); }
              signal(sig, SIG_DFL);
              raise(sig);
          }
          static NSString* kr_name(kern_return_t kr) {
              switch (kr) {
                  case KERN_SUCCESS: return @"OK";
                  case 0xe00002bc: return @"Error";
                  case 0xe00002bd: return @"NoMem";
                  case 0xe00002be: return @"NoRes";
                  case 0xe00002c1: return @"NotPriv";
                  case 0xe00002c2: return @"BadArg";
                  case 0xe00002c5: return @"Excl";
                  case 0xe00002c7: return @"Unsup";
                  case 0xe00002cc: return @"NotOpen";
                  case 0xe00002d4: return @"Busy";
                  case 0xe00002e2: return @"NotPerm";
                  case 0xdeadbeef: return @"dup";
                  default: return [NSString stringWithFormat:@"0x%x", kr];
              }
          }
          static NSString* hexn(const uint8_t* p, size_t n, size_t cap) {
              if (!n) return @"-";
              if (n > cap) n = cap;
              NSMutableString* s = [NSMutableString string];
              for (size_t i = 0; i < n; i++) [s appendFormat:@"%02x", p[i]];
              return s;
          }
          static NSString* doc_file(const char* f) {
              NSString* d = [NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              return [d stringByAppendingPathComponent:@(f)];
          }
          static void doc_path(const char* f, char* b, size_t n) {
              NSString* p = doc_file(f);
              strncpy(b, p.UTF8String, n - 1);
              b[n - 1] = 0;
          }
          static int load_step(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("step.txt")
                  encoding:NSUTF8StringEncoding error:nil];
              return s ? s.intValue : 0;
          }
          static void save_step(int v) {
              [[NSString stringWithFormat:@"%d", v] writeToFile:doc_file("step.txt")
                  atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_try(void) {
              g_try = 0;
              NSString* s = [NSString stringWithContentsOfFile:doc_file("try.txt")
                  encoding:NSUTF8StringEncoding error:nil];
              if (!s) return;
              NSArray<NSString*>* f = [s componentsSeparatedByString:@":"];
              if (f.count != 2) return;
              NSString* a = f[0];
              NSString* b = f[1];
              if (a.intValue == g_step) g_try = b.intValue;
          }
          static void save_try(void) {
              [[NSString stringWithFormat:@"%d:%d", g_step, g_try] writeToFile:doc_file("try.txt")
                  atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void latch_build(void) {
              NSString* bt = [NSString stringWithContentsOfFile:doc_file("build.txt")
                  encoding:NSUTF8StringEncoding error:nil];
              if ([bt isEqualToString:@BUILD_TAG]) return;
              unlink(doc_file("state.txt").UTF8String);
              save_step(0);
              g_try = 0;
              save_try();
              g_root_idx = -1;
              [@BUILD_TAG writeToFile:doc_file("build.txt")
                  atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_state(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("state.txt")
                  encoding:NSUTF8StringEncoding error:nil];
              for (NSString* ln in [s componentsSeparatedByString:@"\n"]) {
                  if ([ln hasPrefix:@"K "]) [g_seen addObject:[ln substringFromIndex:2]];
              }
          }
          static BOOL seen_key(NSString* k) {
              pthread_mutex_lock(&g_lk);
              BOOL r = [g_seen containsObject:k];
              [g_seen addObject:k];
              pthread_mutex_unlock(&g_lk);
              return r;
          }

          static kern_return_t callm(const char* tag, int ci, uint32_t sel, int mode,
                                     uint32_t sinCnt, size_t sinSz, size_t soutCnt, size_t soutSz) {
              if (ci < 0) ci = 0;
              if (ci >= g_nconn) return (kern_return_t)0xe00002cc;
              uint32_t t = g_ctype[ci];
              int nd = g_node[ci];
              NSString* key = [NSString stringWithFormat:@"%d:%u:%u:m%d:%u:%zu:%zu:%zu:%s",
                               nd, t, sel, mode, sinCnt, sinSz, soutCnt, soutSz, tag];
              if (seen_key(key)) return (kern_return_t)0xdeadbeef;
              persist([NSString stringWithFormat:@"K %@", key]);
              bread(tag);

              uint64_t* sin = calloc(1, sizeof(uint64_t) * (SCO + 1));
              uint64_t* sout = calloc(1, sizeof(uint64_t) * (SCO + 1));
              uint8_t* sinS = calloc(1, FIXED);
              uint8_t* soutS = calloc(1, FIXED);
              if (!sin || !sout || !sinS || !soutS) return (kern_return_t)0xe00002bd;
              uint32_t soutCntR = (uint32_t)soutCnt;
              size_t soutSzR = soutSz;
              kern_return_t kr;

              if (mode == 0) {
                  kr = IOConnectCallScalarMethod(g_conn[ci], sel, sin, sinCnt, sout, &soutCntR);
              } else if (mode == 1) {
                  kr = IOConnectCallMethod(g_conn[ci], sel, sin, sinCnt,
                                           sinSz ? sinS : NULL, sinSz,
                                           sout, &soutCntR,
                                           soutSz ? soutS : NULL, &soutSzR);
              } else {
                  uint64_t ref = 1;
                  kr = IOConnectCallAsyncMethod(g_conn[ci], sel, g_wake, &ref, 1,
                                                sin, sinCnt,
                                                sinSz ? sinS : NULL, sinSz,
                                                sout, &soutCntR,
                                                soutSz ? soutS : NULL, &soutSzR);
              }
              __sync_fetch_and_add(&g_done, 1);
              if (kr == KERN_SUCCESS) {
                  persist([NSString stringWithFormat:@"OK %s n%d t%u s%u m%d si=%u/%zu so=%zu/%zu SOUT %llu %@ SSTRUCT %@",
                           tag, nd, t, sel, mode, sinCnt, sinSz, soutCntR, soutSzR,
                           soutCntR ? (unsigned long long)sout[0] : 0ULL, hexn(soutS, soutSzR, 128)]);
                  __sync_fetch_and_add(&g_hits, 1);
                  if (sel == 4) __sync_fetch_and_add(&g_ok4, 1);
                  if (sel == 0) __sync_fetch_and_add(&g_ok0, 1);
                  ui([NSString stringWithFormat:@"!!! OK %s n%d t%u m%d so=%zu", tag, nd, t, mode, soutSzR]);
              } else if (kr != 0xe00002c2 && kr != 0xe00002c7 && kr != 0xe00002cc && kr != 0xdeadbeef) {
                  persist([NSString stringWithFormat:@"%d %u %u m%d si=%u/%zu so=%zu %@ | %s",
                           nd, t, sel, mode, sinCnt, sinSz, soutSz, kr_name(kr), tag]);
                  __sync_fetch_and_add(&g_hits, 1);
                  ui([NSString stringWithFormat:@"!! %s n%d t%u m%d -> %@", tag, nd, t, mode, kr_name(kr)]);
                  if (!g_hit_s[sel]) { g_hit_s[sel] = 1; g_bsi[sel] = sinSz; g_bso[sel] = soutSz; g_bmode[sel] = mode; }
              } else {
                  persist([NSString stringWithFormat:@"%d %u %u m%d si=%u/%zu so=%zu %@ | %s",
                           nd, t, sel, mode, sinCnt, sinSz, soutSz, kr_name(kr), tag]);
              }
              free(sin); free(sout); free(sinS); free(soutS);
              usleep(300);
              return kr;
          }

          static int find_root(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching("AppleJPEGDriver"), &it) != KERN_SUCCESS) return 0;
              int svc = 0;
              io_service_t s;
              while ((s = IOIteratorNext(it))) {
                  svc++;
                  if (!g_root) g_root = s; else IOObjectRelease(s);
              }
              IOObjectRelease(it);
              return svc;
          }

          static void census(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching("IOService"), &it) != KERN_SUCCESS) {
                  ui(@"no census"); return;
              }
              NSMutableDictionary* cnt = [NSMutableDictionary dictionary];
              io_object_t o; int n = 0;
              while ((o = IOIteratorNext(it)) && n < 4000) {
                  n++;
                  io_name_t cls; IOObjectGetClass(o, cls);
                  NSString* s = @(cls);
                  if ([s rangeOfString:@"JPEG"].location != NSNotFound ||
                      [s rangeOfString:@"jpeg"].location != NSNotFound) {
                      NSNumber* c = cnt[s];
                      cnt[s] = @(c.intValue + 1);
                  }
                  IOObjectRelease(o);
              }
              IOObjectRelease(it);
              for (NSString* k in cnt) persist([NSString stringWithFormat:@"JCLS %@ x%d", k, [cnt[k] intValue]]);
              persist([NSString stringWithFormat:@"census nodes=%d jcls=%lu", n, (unsigned long)cnt.count]);
              ui([NSString stringWithFormat:@"census=%d jcls=%lu", n, (unsigned long)cnt.count]);
              for (NSString* k in cnt) ui([NSString stringWithFormat:@"JCLS %@ x%d", k, [cnt[k] intValue]]);
          }

          static void dump_sig(void) {
              unsigned int fl = 0;
              int rc = csops(getpid(), 0, &fl, sizeof(fl));
              persist([NSString stringWithFormat:@"csops rc=%d f=0x%x gta=%d dpl=%d plat=%d dbg=%d",
                       rc, fl, (fl & 4) ? 1 : 0, (fl & 0x2000000) ? 1 : 0,
                       (fl & 0x4000000) ? 1 : 0, (fl & 0x10000000) ? 1 : 0]);
              ui([NSString stringWithFormat:@"csops rc=%d f=0x%x", rc, fl]);
          }

          static void dump_props(io_object_t o, int node) {
              CFMutableDictionaryRef props = NULL;
              if (IORegistryEntryCreateCFProperties(o, &props, kCFAllocatorDefault, 0) != KERN_SUCCESS || !props) {
                  persist([NSString stringWithFormat:@"PROPS %d none", node]);
                  return;
              }
              NSDictionary* d = (__bridge NSDictionary*)props;
              for (id k in d) {
                  NSString* ks = [k description];
                  NSString* vs = [d[k] description];
                  if (vs.length > 160) vs = [vs substringToIndex:160];
                  persist([NSString stringWithFormat:@"PROPS %d %@ = %@", node, ks, vs]);
              }
              persist([NSString stringWithFormat:@"PROPS %d count=%lu", node, (unsigned long)d.count]);
              ui([NSString stringWithFormat:@"PROPS %d n=%lu", node, (unsigned long)d.count]);
              CFRelease(props);
          }

          static void prop_dump(void) {
              if (!g_root) { ui(@"no root"); return; }
              dump_props(g_root, 0);
              for (int i = 1; i <= g_nchild; i++) dump_props(g_child[i], i);
          }

          static void match_uc(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching("AppleJPEGDriverUserClient"), &it) != KERN_SUCCESS) {
                  ui(@"no uc match"); return;
              }
              io_object_t o; int n = 0, got = 0;
              while ((o = IOIteratorNext(it)) && n < 16) {
                  n++;
                  io_connect_t c = 0;
                  kern_return_t kr = IOServiceOpen(o, mach_task_self(), 0, &c);
                  persist([NSString stringWithFormat:@"uc %d open=%@", n, kr_name(kr)]);
                  if (kr == KERN_SUCCESS && g_nconn < MAXC) {
                      got++;
                      g_conn[g_nconn] = c; g_ctype[g_nconn] = 0; g_node[g_nconn] = 100 + n;
                      g_nconn++;
                  }
                  IOObjectRelease(o);
              }
              IOObjectRelease(it);
              persist([NSString stringWithFormat:@"uc nodes=%d got=%d", n, got]);
              ui([NSString stringWithFormat:@"uc nodes=%d got=%d", n, got]);
          }

          static void dump_node(io_object_t o, int node) {
              io_name_t cls; IOObjectGetClass(o, cls);
              persist([NSString stringWithFormat:@"NODE %d class=%s", node, cls]);
              ui([NSString stringWithFormat:@"NODE %d %s", node, cls]);
          }

          static int probe_open(io_service_t s, int node, uint32_t maxType) {
              int got = 0;
              for (uint32_t t = 0; t <= maxType && g_nconn < MAXC; t++) {
                  io_connect_t c = 0;
                  if (IOServiceOpen(s, mach_task_self(), t, &c) != KERN_SUCCESS) continue;
                  int idx = g_nconn;
                  g_conn[idx] = c; g_ctype[idx] = t; g_node[idx] = node;
                  g_nconn++; got++;
              }
              return got;
          }

          static void dump_tree(void) {
              if (!g_root) { ui(@"no root"); return; }
              dump_node(g_root, 0);
              io_iterator_t ch = 0;
              if (IORegistryEntryGetChildIterator(g_root, kIOServicePlane, &ch) != KERN_SUCCESS) {
                  ui(@"no child iter"); return;
              }
              io_object_t c;
              while ((c = IOIteratorNext(ch)) && g_nchild < MAXCHILD) {
                  g_nchild++;
                  g_child[g_nchild] = c;
                  dump_node(c, g_nchild);
              }
              IOObjectRelease(ch);
              persist([NSString stringWithFormat:@"children=%d", g_nchild]);
              ui([NSString stringWithFormat:@"children=%d", g_nchild]);
          }

          static void open_all(void) {
              int base = g_nconn;
              int got = probe_open(g_root, 0, TYPE_MAX);
              if (g_nconn > base) g_root_idx = base;
              persist([NSString stringWithFormat:@"root got=%d idx=%d nchild=%d", got, g_root_idx, g_nchild]);
              ui([NSString stringWithFormat:@"root got=%d idx=%d", got, g_root_idx]);
              for (int i = 1; i <= g_nchild; i++) {
                  NSMutableString* l = [NSMutableString string];
                  for (uint32_t t = 0; t <= TYPE_MAX; t++) {
                      io_connect_t c = 0;
                      kern_return_t kr = IOServiceOpen(g_child[i], mach_task_self(), t, &c);
                      [l appendFormat:@"%u:%@ ", t, kr_name(kr)];
                      if (kr == KERN_SUCCESS && g_nconn < MAXC) {
                          g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_node[g_nconn] = i;
                          g_nconn++;
                      }
                  }
                  persist([NSString stringWithFormat:@"child %d %@", i, l]);
                  ui([NSString stringWithFormat:@"child %d %@", i, l]);
              }
              persist([NSString stringWithFormat:@"conns=%d", g_nconn]);
              ui([NSString stringWithFormat:@"conns=%d", g_nconn]);
          }

          static void vt_cb(void* ref, void* src, OSStatus st, VTEncodeInfoFlags fl,
                            CMSampleBufferRef sb) { g_vt_done = 1; }

          static void vt_start(void) {
              VTCompressionSessionCreate(NULL, 1920, 1080, kCMVideoCodecType_H264,
                  NULL, NULL, NULL, vt_cb, NULL, &g_vt);
              if (g_vt) VTCompressionSessionPrepareToEncodeFrames(g_vt);
          }

          static int vt_encode(void) {
              if (!g_vt) return -1;
              CVPixelBufferRef pb = NULL;
              NSDictionary* a = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              if (CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA,
                      (__bridge CFDictionaryRef)a, &pb) != kCVReturnSuccess) return -2;
              CVPixelBufferLockBaseAddress(pb, 0);
              memset(CVPixelBufferGetBaseAddress(pb), 0x80, CVPixelBufferGetDataSize(pb));
              CVPixelBufferUnlockBaseAddress(pb, 0);
              VTEncodeInfoFlags fl = 0;
              OSStatus st = VTCompressionSessionEncodeFrame(g_vt, pb, CMTimeMake(1, 30),
                  CMTimeMake(1, 30), NULL, NULL, &fl);
              CVPixelBufferRelease(pb);
              for (int i = 0; i < 300 && !g_vt_done; i++) usleep(10000);
              return (int)st;
          }

          static void scalar_sweep(void) {
              for (uint32_t s = 0; s < SEL_N; s++) {
                  NSMutableString* l = [NSMutableString string];
                  for (uint32_t si = 0; si < SCO; si++) {
                      for (uint32_t so = 0; so < SCO; so++) {
                          char tg[48]; snprintf(tg, sizeof(tg), "sc.%u.%u.%u", s, si, so);
                          kern_return_t kr = callm(tg, g_root_idx, s, 0, si, 0, so, 0);
                          [l appendFormat:@"%u.%u:%@ ", si, so, kr_name(kr)];
                      }
                  }
                  persist([NSString stringWithFormat:@"SC s%u %@", s, l]);
                  ui([NSString stringWithFormat:@"SC s%u %@", s, l]);
              }
          }

          static void method_grid(void) {
              for (uint32_t s = 0; s < SEL_N; s++) {
                  NSMutableString* l = [NSMutableString string];
                  for (uint32_t si = 0; si < 3; si++) {
                      for (int z = 0; z < SZ_N; z++) {
                          char tg[48]; snprintf(tg, sizeof(tg), "mg.%u.%u.%zu", s, si, SZ[z]);
                          kern_return_t kr = callm(tg, g_root_idx, s, 1, si, SZ[z], 0, FIXED);
                          [l appendFormat:@"%u/%zu:%@ ", si, SZ[z], kr_name(kr)];
                      }
                  }
                  persist([NSString stringWithFormat:@"MG s%u %@", s, l]);
                  ui([NSString stringWithFormat:@"MG s%u %@", s, l]);
              }
          }

          static void async_sweep(void) {
              if (g_wake == MACH_PORT_NULL) { ui(@"no wake port"); return; }
              size_t outs[3] = {0, 64, FIXED};
              for (uint32_t s = 0; s < SEL_N; s++) {
                  NSMutableString* l = [NSMutableString string];
                  for (int i = 0; i < 3; i++) {
                      char tg[48]; snprintf(tg, sizeof(tg), "as.%u.%d", s, i);
                      kern_return_t kr = callm(tg, g_root_idx, s, 2, 0, 0, 0, outs[i]);
                      [l appendFormat:@"%zu:%@ ", outs[i], kr_name(kr)];
                  }
                  persist([NSString stringWithFormat:@"AS s%u %@", s, l]);
                  ui([NSString stringWithFormat:@"AS s%u %@", s, l]);
              }
          }

          static void open_chain(void) {
              uint8_t* in = calloc(1, FIXED);
              if (!in) return;
              NSMutableString* l = [NSMutableString string];
              for (uint32_t s = 0; s <= 5; s++) {
                  uint32_t m = g_hit_s[s] ? g_bmode[s] : 1;
                  size_t zi = g_hit_s[s] ? g_bsi[s] : FIXED;
                  size_t zo = g_hit_s[s] ? g_bso[s] : FIXED;
                  char tg[40]; snprintf(tg, sizeof(tg), "oc.%u", s);
                  kern_return_t kr = callm(tg, g_root_idx, s, (int)m, 0, zi, 0, zo);
                  [l appendFormat:@"%u(m%d/%zu/%zu):%@ ", s, m, zi, zo, kr_name(kr)];
              }
              free(in);
              persist([NSString stringWithFormat:@"OC %@", l]);
              ui([NSString stringWithFormat:@"OC %@", l]);
          }

          static void surf_probe(void) {
              NSDictionary* p = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              CVReturn r = CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA,
                                               (__bridge CFDictionaryRef)p, &g_surf);
              if (r != kCVReturnSuccess || !g_surf) {
                  persist([NSString stringWithFormat:@"surf=0 rc=%d", (int)r]);
                  ui([NSString stringWithFormat:@"surf=0 rc=%d", (int)r]);
                  return;
              }
              IOSurfaceRef s = CVPixelBufferGetIOSurface(g_surf);
              fn_surfid idf = (fn_surfid)dlsym(RTLD_DEFAULT, "IOSurfaceGetID");
              g_sid = (s && idf) ? idf(s) : 0;
              persist([NSString stringWithFormat:@"sid=%u", g_sid]);
              ui([NSString stringWithFormat:@"sid=%u", g_sid]);
              for (uint32_t sel = 0; sel <= 5; sel++) {
                  uint32_t m = g_hit_s[sel] ? g_bmode[sel] : 1;
                  size_t zi = g_hit_s[sel] ? g_bsi[sel] : 24;
                  size_t zo = g_hit_s[sel] ? g_bso[sel] : FIXED;
                  if (zi < 24) zi = 24;
                  uint8_t* in = calloc(1, zi);
                  if (!in) continue;
                  uint32_t w = 1920, h = 1080, f = 0x42475241;
                  memcpy(in, &g_sid, 4);
                  memcpy(in + 4, &w, 4);
                  memcpy(in + 8, &h, 4);
                  memcpy(in + 12, &f, 4);
                  char tg[40]; snprintf(tg, sizeof(tg), "sx.%u", sel);
                  callm(tg, g_root_idx, sel, (int)m, 1, zi, 0, zo);
                  free(in);
              }
          }

          static void confirm_all(void) {
              for (int ci = 0; ci < g_nconn; ci++) {
                  NSMutableString* l = [NSMutableString string];
                  for (uint32_t s = 0; s < SEL_N; s++) {
                      uint32_t m = g_hit_s[s] ? g_bmode[s] : 1;
                      size_t zi = g_hit_s[s] ? g_bsi[s] : FIXED;
                      size_t zo = g_hit_s[s] ? g_bso[s] : FIXED;
                      char tg[48]; snprintf(tg, sizeof(tg), "cf.%d.%u.%u", g_node[ci], g_ctype[ci], s);
                      kern_return_t kr = callm(tg, ci, s, (int)m, 0, zi, 0, zo);
                      [l appendFormat:@"%u:%@ ", s, kr_name(kr)];
                  }
                  persist([NSString stringWithFormat:@"CF n%d t%u %@", g_node[ci], g_ctype[ci], l]);
                  ui([NSString stringWithFormat:@"CF n%d t%u %@", g_node[ci], g_ctype[ci], l]);
              }
          }

          static void verdict(void) {
              NSMutableString* b = [NSMutableString string];
              for (uint32_t s = 0; s < SEL_N; s++) {
                  if (g_hit_s[s]) [b appendFormat:@"%u(m%u/%zu/%zu) ", s, g_bmode[s], g_bsi[s], g_bso[s]];
              }
              persist([NSString stringWithFormat:@"VERDICT ok0=%d ok4=%d hits=%d conns=%d hit=[%@]",
                       g_ok0, g_ok4, g_hits, g_nconn, b]);
              ui([NSString stringWithFormat:@"VERDICT ok0=%d ok4=%d hit=[%@]", g_ok0, g_ok4, b]);
          }

          static void do_step(int s) {
              switch (s) {
                  case 0: break;
                  case 1: census(); break;
                  case 2: dump_sig(); break;
                  case 3: prop_dump(); break;
                  case 4: vt_start(); break;
                  case 5: ui([NSString stringWithFormat:@"vt=%d", (int)vt_encode()]); break;
                  case 6: dump_tree(); break;
                  case 7: open_all(); break;
                  case 8: scalar_sweep(); break;
                  case 9: method_grid(); break;
                  case 10: async_sweep(); break;
                  case 11: open_chain(); break;
                  case 12: surf_probe(); break;
                  case 13: confirm_all(); break;
                  case 14: verdict(); break;
              }
          }

          static void run(void) {
              latch_build();
              char b[512]; doc_path("state.txt", b, sizeof(b));
              g_fd = open(b, O_CREAT | O_WRONLY | O_APPEND, 0644);
              g_seen = [NSMutableSet set];
              load_state();
              g_step = load_step();

              mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &g_wake);
              mach_port_insert_right(mach_task_self(), g_wake, g_wake, MACH_MSG_TYPE_MAKE_SEND);

              persist([NSString stringWithFormat:@"=== LAUNCH step=%d build=%s", g_step, BUILD_TAG]);
              if (g_fd >= 0) fsync(g_fd);
              ui([NSString stringWithFormat:@"BUILD %s", BUILD_TAG]);
              ui([NSString stringWithFormat:@"STEP %d/%d: %s", g_step, STEP_MAX,
                  STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]]);
              if (g_step > STEP_MAX) { ui(@"ALL DONE"); return; }

              int svc = find_root();
              ui([NSString stringWithFormat:@"svc=%d", svc]);
              persist([NSString stringWithFormat:@"svc=%d", svc]);
              if (!g_root) { ui(@"NO ROOT"); g_stop = 1; }

              while (g_step <= STEP_MAX && !g_stop) {
                  load_try();
                  if (g_try >= TRY_MAX) {
                      ui([NSString stringWithFormat:@"SKIP %d", g_step]);
                      persist([NSString stringWithFormat:@"SKIP %d", g_step]);
                      g_step++; save_step(g_step);
                      usleep(150000);
                      continue;
                  }
                  g_try++; save_try();
                  ui([NSString stringWithFormat:@"CHAIN %d %s", g_step, STEP_NAME[g_step]]);
                  do_step(g_step);
                  persist([NSString stringWithFormat:@"STEP %d OK calls=%d hits=%d ok0=%d ok4=%d",
                           g_step, g_done, g_hits, g_ok0, g_ok4]);
                  if (g_fd >= 0) fsync(g_fd);
                  ui([NSString stringWithFormat:@"STEP %d SURVIVED", g_step]);
                  g_step++; save_step(g_step);
                  if (g_step <= STEP_MAX) usleep(400000);
              }

              ui(@"CHAIN END");
              persist(@"CHAIN END");
              if (g_fd >= 0) fsync(g_fd);
              close(g_fd); g_fd = -1;
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              g_lines = [NSMutableArray array];
              signal(SIGSEGV, sigh); signal(SIGBUS, sigh); signal(SIGABRT, sigh);
              signal(SIGILL, sigh); signal(SIGFPE, sigh);

              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 44, 344, 44)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightRegular];
              g_hb.numberOfLines = 2;
              g_hb.text = @BUILD_TAG;
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 92; r.size.height -= 100;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              [NSTimer scheduledTimerWithTimeInterval:0.25 repeats:YES block:^(NSTimer*) {
                  g_hb.text = [NSString stringWithFormat:@"%s step %d/%d c=%d h=%d ok0=%d ok4=%d",
                               BUILD_TAG, g_step, STEP_MAX, g_done, g_hits, g_ok0, g_ok4];
                  flush_ui();
              }];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC),
                             dispatch_get_global_queue(0,0), ^{ run(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          MAINEOF

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: syntax
        run: |
          set +e
          xcrun -sdk iphoneos clang -fsyntax-only -x objective-c \
            -target arm64-apple-ios18.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -F "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/PrivateFrameworks" \
            -F "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks" \
            -Wno-implicit-function-declaration \
            Sources/main.m > s.log 2>&1
          rc=$?
          set -e
          grep -nE "error:" s.log | head -40
          exit $rc

      - name: build
        run: |
          mkdir -p out/Payload
          set +e
          xcodebuild -project probe.xcodeproj -target probe \
            -sdk iphoneos -configuration Release \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/out/Payload \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_CFLAGS="-Wno-implicit-function-declaration" \
            OTHER_LDFLAGS="-F$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/PrivateFrameworks" \
            build > b.log 2>&1
          rc=$?
          set -e
          echo "=== rc=$rc ==="
          grep -nE "error:|fatal error:|Undefined symbols" b.log | head -40
          echo "=== end ==="
          exit $rc

      - name: ipa
        run: |
          ls -la out/Payload
          cd out && zip -r probe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.ipa
          if-no-files-found: error
