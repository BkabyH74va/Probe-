name: build
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scaffold
        run: |
          mkdir -p Sources
          cat > project.yml <<'EOF'
          name: probe
          options: { bundleIdPrefix: com.buurza, deploymentTarget: { iOS: "18.0" } }
          targets:
            probe:
              type: application
              platform: iOS
              sources: [Sources]
              entitlements: { path: probe.entitlements }
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: buurd
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
              settings:
                ARCHS: "arm64e arm64"
                SUPPORTED_PLATFORMS: "iphoneos"
                SDKROOT: "iphoneos"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                OTHER_CFLAGS: "-Wno-implicit-function-declaration"
              dependencies:
                - sdk: IOKit.framework
                - sdk: UIKit.framework
                - sdk: VideoToolbox.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
                - sdk: Security.framework
          EOF
          cat > probe.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>com.apple.security.iokit-user-client-class</key>
            <array><string>AVEVideoEncoderUserClient</string></array>
          </dict></plist>
          EOF
          cat > Sources/main.m <<'EOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <Security/Security.h>
          #import <VideoToolbox/VideoToolbox.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/sysctl.h>

          typedef struct __SecTask *SecTaskRef;
          extern SecTaskRef SecTaskCreateFromSelf(CFAllocatorRef);
          extern CFTypeRef SecTaskCopyValueForEntitlement(SecTaskRef, CFStringRef, CFErrorRef *);
          extern int csops(pid_t, unsigned int, void *, size_t);

          #define CS_OPS_STATUS            0
          #define CS_OPS_ENTITLEMENTS_BLOB 7

          static UITextView* g_tv;
          static UILabel* g_hb;
          static NSUInteger g_ticks = 0;
          static int g_ave = 0, g_jpeg = 0;
          static NSMutableString* g_sum;
          static VTCompressionSessionRef g_vt = NULL;
          static dispatch_semaphore_t g_sem;

          static void add_line(NSString* s) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  g_tv.text = [g_tv.text stringByAppendingFormat:@"\n%@", s];
                  [g_tv scrollRangeToVisible:NSMakeRange(g_tv.text.length, 0)];
                  NSLog(@"PROBE: %@", s);
              });
          }

          static void sum(NSString* s) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  [g_sum appendFormat:@"\n%@", s];
                  NSLog(@"SUM: %@", s);
              });
          }

          static void dump_file(void) {
              NSString* p = [NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory, NSUserDomainMask, YES).firstObject
                  stringByAppendingPathComponent:@"probe.txt"];
              [g_tv.text writeToFile:p atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }

          static NSString* sysctl_str(const char* key) {
              char b[256] = {0}; size_t l = sizeof(b);
              if (sysctlbyname(key, b, &l, NULL, 0) != 0) return @"?";
              return @(b);
          }

          static NSString* kr_name(kern_return_t kr) {
              switch (kr) {
                  case KERN_SUCCESS: return @"OK";
                  case 0xe00002c2:   return @"BadArg";
                  case 0xe00002c7:   return @"Unsup";
                  case 0xe00002be:   return @"NoRes";
                  case 0xe00002bd:   return @"NoMem";
                  case 0xe00002c5:   return @"Excl";
                  case 0xe00002c1:   return @"NotPriv";
                  case 0xe00002e2:   return @"NotPerm";
                  default:           return [NSString stringWithFormat:@"0x%x", kr];
              }
          }

          static void check_sig(void) {
              uint32_t f = 0;
              if (csops(getpid(), CS_OPS_STATUS, &f, sizeof(f)) == 0)
                  sum([NSString stringWithFormat:@"csflags=0x%08x platform=%d gettaskallow=%d",
                       f, !!(f & 0x04000000), !!(f & 0x00000004)]);
              SecTaskRef t = SecTaskCreateFromSelf(kCFAllocatorDefault);
              if (t) {
                  const char* k[] = { "platform-application",
                      "com.apple.private.security.no-container", "get-task-allow" };
                  for (int i = 0; i < 3; i++) {
                      CFTypeRef v = SecTaskCopyValueForEntitlement(t, (__bridge CFStringRef)@(k[i]), NULL);
                      sum([NSString stringWithFormat:@"ent %s = %@", k[i], v ? @"YES" : @"nil"]);
                      if (v) CFRelease(v);
                  }
                  CFRelease(t);
              }
          }

          static void vt_out(void* r, void* s, OSStatus st, VTEncodeInfoFlags f, CMSampleBufferRef sb) {
              dispatch_semaphore_signal(g_sem);
          }

          static void vt_warm(void) {
              g_sem = dispatch_semaphore_create(0);
              if (VTCompressionSessionCreate(NULL, 1920, 1080, kCMVideoCodecType_H264,
                      NULL, NULL, NULL, vt_out, NULL, &g_vt) != noErr || !g_vt) {
                  sum(@"vt create FAIL"); return;
              }
              sum(@"vt create ok");
              VTCompressionSessionPrepareToEncodeFrames(g_vt);
              CVPixelBufferRef pb = NULL;
              CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, NULL, &pb);
              if (!pb) return;
              VTCompressionSessionEncodeFrame(g_vt, pb, CMTimeMake(1, 30), CMTimeMake(1, 30), NULL, NULL, NULL);
              dispatch_semaphore_wait(g_sem, dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC));
              CVPixelBufferRelease(pb);
          }

          static void map_sel(io_connect_t c, const char* tag) {
              NSMutableString* row = [NSMutableString string];
              int live = 0;
              for (uint32_t sel = 0; sel < 48; sel++) {
                  uint64_t out[16] = {0}; uint32_t oc = 16;
                  kern_return_t kr = IOConnectCallScalarMethod(c, sel, NULL, 0, out, &oc);
                  if (kr == KERN_SUCCESS || kr == 0xe00002c2 ||
                      kr == 0xe00002be || kr == 0xe00002bd) {
                      live++;
                      [row appendFormat:@" %u=%@", sel, kr_name(kr)];
                  }
                  usleep(3000);
              }
              add_line([NSString stringWithFormat:@"  %s live=%d ->%@", tag, live, row.length ? row : @" -"]);
          }

          static void deepen(io_connect_t c, const char* tag) {
              for (uint32_t sel = 0; sel < 48; sel++) {
                  uint64_t o1[16] = {0}; uint32_t oc1 = 16;
                  if (IOConnectCallScalarMethod(c, sel, NULL, 0, o1, &oc1) != 0xe00002c2) continue;
                  for (int ic = 1; ic <= 4; ic++) {
                      uint64_t in[8] = {0}; uint64_t out[16] = {0}; uint32_t oc = 16;
                      kern_return_t kr = IOConnectCallScalarMethod(c, sel, in, (uint32_t)ic, out, &oc);
                      add_line([NSString stringWithFormat:@"    %s sel %u in=%d -> %@ out0=0x%llx",
                                tag, sel, ic, kr_name(kr), out[0]]);
                      if (kr != 0xe00002c2) break;
                  }
              }
          }

          static void do_ave(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching("AppleAVE2Driver"), &it) != KERN_SUCCESS) return;
              io_service_t s;
              while ((s = IOIteratorNext(it))) {
                  for (int t = 0; t <= 6; t++) {
                      io_connect_t c = 0;
                      kern_return_t kr = IOServiceOpen(s, mach_task_self(), (uint32_t)t, &c);
                      if (kr == KERN_SUCCESS) g_ave++;
                      add_line([NSString stringWithFormat:@"AVE t=%d -> %@", t, kr_name(kr)]);
                  }
                  IOObjectRelease(s);
              }
              IOObjectRelease(it);
          }

          static void do_jpeg(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching("AppleJPEGDriver"), &it) != KERN_SUCCESS) {
                  add_line(@"JPEG: no match"); return;
              }
              io_service_t s; int nodes = 0;
              while ((s = IOIteratorNext(it)) && nodes < 3) {
                  nodes++;
                  add_line([NSString stringWithFormat:@"JPEG node %d", nodes]);
                  for (int t = 20; t <= 26; t++) {
                      io_connect_t c = 0;
                      kern_return_t kr = IOServiceOpen(s, mach_task_self(), (uint32_t)t, &c);
                      if (kr != KERN_SUCCESS) { add_line([NSString stringWithFormat:@"  t=%d -> %@", t, kr_name(kr)]); continue; }
                      g_jpeg++;
                      char tag[24]; snprintf(tag, sizeof(tag), "n%d.t%d", nodes, t);
                      add_line([NSString stringWithFormat:@"  t=%d OPEN conn=%u", t, c]);
                      map_sel(c, tag);
                      deepen(c, tag);
                  }
                  IOObjectRelease(s);
              }
              IOObjectRelease(it);
          }

          static void run_probe(void) {
              g_sum = [NSMutableString string];
              add_line(@"[+] probe start");
              check_sig();
              add_line(@"[*] vt");
              vt_warm();
              usleep(400000);
              add_line(@"[*] AVE");
              do_ave();
              add_line(@"[*] JPEG");
              do_jpeg();
              add_line(@"=========== SUMMARY ===========");
              add_line([NSString stringWithFormat:@"os=%@ model=%@", sysctl_str("kern.osproductversion"), sysctl_str("hw.model")]);
              add_line(g_sum);
              add_line([NSString stringWithFormat:@"ave_opens=%d jpeg_opens=%d", g_ave, g_jpeg]);
              add_line(g_jpeg ? @"[+] JPEG CLIENT LIVE" : @"[-] JPEG dead");
              add_line(@"[*] done");
              dump_file();
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 50, 340, 18)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
              g_hb.text = @"alive ticks=0";
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 72; r.size.height -= 80;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot ok";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              [NSTimer scheduledTimerWithTimeInterval:0.5 repeats:YES block:^(NSTimer* t) {
                  g_ticks++;
                  g_hb.text = [NSString stringWithFormat:@"alive ticks=%lu", (unsigned long)g_ticks];
              }];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC),
                             dispatch_get_global_queue(0,0), ^{ run_probe(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          EOF

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: build
        run: |
          mkdir -p out/Payload
          xcodebuild -project probe.xcodeproj -target probe \
            -sdk iphoneos -configuration Release \
            -arch arm64e -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/out/Payload \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_CFLAGS="-Wno-implicit-function-declaration" \
            build

      - name: ipa
        run: |
          ls -la out/Payload
          cd out && zip -r probe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.ipa
          if-no-files-found: error
