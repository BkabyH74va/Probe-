name: build
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scaffold
        run: |
          mkdir -p Sources
          cat > project.yml <<'EOF'
          name: probe
          options: { bundleIdPrefix: com.buurza, deploymentTarget: { iOS: "18.0" } }
          targets:
            probe:
              type: application
              platform: iOS
              sources: [Sources]
              entitlements: { path: probe.entitlements }
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: buurd
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
              settings:
                ARCHS: "arm64e arm64"
                SUPPORTED_PLATFORMS: "iphoneos"
                SDKROOT: "iphoneos"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
              dependencies:
                - sdk: IOKit.framework
                - sdk: UIKit.framework
                - sdk: VideoToolbox.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
          EOF
          cat > probe.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
          </dict></plist>
          EOF
          cat > Sources/main.m <<'EOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <VideoToolbox/VideoToolbox.h>
          #import <CoreVideo/CoreVideo.h>
          #include <unistd.h>

          static UITextView* g_tv;
          static UILabel* g_hb;
          static NSUInteger g_ticks = 0;
          static VTCompressionSessionRef g_vt = NULL;
          static dispatch_semaphore_t g_sem;

          static void add_line(NSString* s) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  g_tv.text = [g_tv.text stringByAppendingFormat:@"\n%@", s];
                  NSLog(@"PROBE: %@", s);
              });
          }

          static void dump_file(void) {
              NSString* p = [NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory, NSUserDomainMask, YES).firstObject
                  stringByAppendingPathComponent:@"probe.txt"];
              [g_tv.text writeToFile:p atomically:YES
                          encoding:NSUTF8StringEncoding error:nil];
          }

          static void vt_out(void* ref, void* src, OSStatus st,
                             VTEncodeInfoFlags fl, CMSampleBufferRef sbuf) {
              dispatch_semaphore_signal(g_sem);
          }

          static void vt_full(void) {
              g_sem = dispatch_semaphore_create(0);
              OSStatus st = VTCompressionSessionCreate(NULL, 1920, 1080,
                      kCMVideoCodecType_H264, NULL, NULL, NULL, vt_out, NULL, &g_vt);
              add_line([NSString stringWithFormat:@"vt create=%d", (int)st]);
              if (!g_vt) return;

              VTCompressionSessionPrepareToEncodeFrames(g_vt);

              CVPixelBufferRef pb = NULL;
              CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, NULL, &pb);
              if (pb) {
                  VTCompressionSessionEncodeFrame(g_vt, pb,
                      CMTimeMake(1, 30), CMTimeMake(1, 30), NULL, NULL, NULL);
                  long w = dispatch_semaphore_wait(g_sem,
                      dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC));
                  add_line([NSString stringWithFormat:@"vt encode waited=%ld", w]);
                  CVPixelBufferRelease(pb);
              }
          }

          static int try_open_type(NSString* cls, int type) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching(cls.UTF8String), &it) != KERN_SUCCESS) return -1;
              io_service_t svc = IOIteratorNext(it);
              IOObjectRelease(it);
              if (!svc) return 0;
              io_connect_t c = 0;
              kern_return_t kr = IOServiceOpen(svc, mach_task_self(), (uint32_t)type, &c);
              BOOL uc = IOObjectConformsTo(svc, "IOUserClient");
              IOObjectRelease(svc);
              add_line([NSString stringWithFormat:@"%@ type=%d uc=%d open=0x%x conn=%u",
                        cls, type, (int)uc, kr, c]);
              return kr == KERN_SUCCESS;
          }

          static void dump_subtree(io_service_t root, const char* plane) {
              io_iterator_t it = 0;
              if (IORegistryEntryGetChildIterator(root, plane, &it) != KERN_SUCCESS) return;
              io_service_t s; int n = 0;
              while ((s = IOIteratorNext(it)) && n < 200) {
                  io_name_t nm; IOObjectGetClass(s, nm);
                  BOOL uc = IOObjectConformsTo(s, "IOUserClient");
                  io_connect_t c = 0;
                  kern_return_t kr = IOServiceOpen(s, mach_task_self(), 0, &c);
                  add_line([NSString stringWithFormat:@"  child %s uc=%d open=0x%x", nm, (int)uc, kr]);
                  IOObjectRelease(s); n++;
              }
              IOObjectRelease(it);
          }

          static io_service_t find_one(const char* cls) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching(cls), &it) != KERN_SUCCESS) return 0;
              io_service_t s = IOIteratorNext(it);
              IOObjectRelease(it);
              return s;
          }

          static void run_probe(void) {
              add_line(@"[+] probe start");

              io_service_t ave = find_one("AppleAVE2Driver");
              if (!ave) { add_line(@"no AppleAVE2Driver node yet"); }
              else {
                  add_line(@"[*] subtree of AppleAVE2Driver:");
                  dump_subtree(ave, kIOServicePlane);
                  IOObjectRelease(ave);
              }

              add_line(@"[*] warmup VT with a real frame");
              vt_full();

              for (int i = 0; i < 4; i++) {
                  usleep(400000);
                  add_line([NSString stringWithFormat:@"--- after encode %d ---", i]);
                  try_open_type(@"AVEVideoEncoder", 0);
                  for (int t = 0; t <= 3; t++) try_open_type(@"AppleAVE2Driver", t);
              }

              add_line(@"[*] done");
              dump_file();
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 50, 340, 18)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
              g_hb.text = @"alive ticks=0";
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 72;
              r.size.height -= 80;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:13 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot ok";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              [NSTimer scheduledTimerWithTimeInterval:0.5 repeats:YES block:^(NSTimer* t) {
                  g_ticks++;
                  g_hb.text = [NSString stringWithFormat:@"alive ticks=%lu",
                               (unsigned long)g_ticks];
              }];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC),
                             dispatch_get_global_queue(0,0), ^{ run_probe(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          EOF

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: build
        run: |
          mkdir -p out/Payload
          xcodebuild -project probe.xcodeproj -target probe \
            -sdk iphoneos -configuration Release \
            -arch arm64e -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/out/Payload \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: ipa
        run: |
          ls -la out/Payload
          cd out && zip -r probe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.ipa
          if-no-files-found: error
