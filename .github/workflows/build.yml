name: build
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scaffold
        run: |
          mkdir -p Sources
          cat > project.yml <<'PROJEOF'
          name: probe
          options: { bundleIdPrefix: com.buurza15, deploymentTarget: { iOS: "18.0" } }
          targets:
            probe:
              type: application
              platform: iOS
              sources: [Sources]
              entitlements: { path: probe.entitlements }
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: buurd15
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "15"
                  UILaunchScreen: {}
              settings:
                ARCHS: "arm64"
                SUPPORTED_PLATFORMS: "iphoneos"
                SDKROOT: "iphoneos"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                OTHER_CFLAGS: "-Wno-implicit-function-declaration"
              dependencies:
                - sdk: IOKit.framework
                - sdk: UIKit.framework
                - sdk: VideoToolbox.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
                - sdk: Security.framework
          PROJEOF
          cat > probe.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>get-task-allow</key><true/>
          </dict></plist>
          ENTEOF
          cat > Sources/main.m <<'MAINEOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <VideoToolbox/VideoToolbox.h>
          #import <CoreVideo/CoreVideo.h>
          #import <mach/mach.h>
          #import <mach/vm_region.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>

          extern kern_return_t mach_vm_region(vm_map_t, mach_vm_address_t *,
              mach_vm_size_t *, vm_region_flavor_t, vm_region_info_t,
              mach_msg_type_number_t *, mach_port_t *);

          #define BUILD_TAG "v15-open"
          #define MAXC 24
          #define STEP_MAX 12
          #define TRY_MAX 2

          static UITextView* g_tv;
          static UILabel* g_hb;
          static NSMutableArray* g_lines;
          static volatile int g_hits = 0, g_done = 0;
          static volatile int g_step = 0;
          static volatile int g_stop = 0;
          static volatile int g_vt_done = 0;
          static int g_try = 0;
          static int g_open_idx = -1;
          static int g_fd = -1;
          static NSMutableSet* g_seen;
          static pthread_mutex_t g_lk = PTHREAD_MUTEX_INITIALIZER;
          static VTCompressionSessionRef g_vt = NULL;

          static io_connect_t g_conn[MAXC];
          static uint32_t g_ctype[MAXC];
          static int g_nconn = 0;

          static const uint32_t FUZZ_VALS[12] = {
              1, 8, 16, 64, 256, 1024, 4096, 8192, 0x10000, 0x100000, 0x7fffffff, 0xffffffff
          };
          static const uint32_t MAGIC_VALS[8] = {1, 2, 4, 0x10, 0x100, 0x1000, 0x10000, 0x100000};
          static const uint32_t MAGIC_OFFS[5] = {0, 4, 120, 124, 128};

          static const char* STEP_NAME[STEP_MAX + 1] = {
              "boot", "vt-init", "vt-encode", "type-sweep-s5", "magic-sweep",
              "s4-on-open", "mm-sweep", "mm-write", "cmd124-zero-511",
              "cmd128-zero-511", "cmd122-zero-127", "hmap124", "fuzz-300"
          };

          static void ui(NSString* s) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  [g_lines addObject:s];
                  if (g_lines.count > 200) [g_lines removeObjectsInRange:NSMakeRange(0, 40)];
              });
          }
          static void flush_ui(void) {
              g_tv.text = [g_lines componentsJoinedByString:@"\n"];
              if (g_lines.count) [g_tv scrollRangeToVisible:NSMakeRange(g_tv.text.length, 0)];
          }
          static void persist(NSString* s) {
              if (g_fd < 0) return;
              NSData* d = [[s stringByAppendingString:@"\n"] dataUsingEncoding:NSUTF8StringEncoding];
              pthread_mutex_lock(&g_lk);
              write(g_fd, d.bytes, d.length);
              pthread_mutex_unlock(&g_lk);
          }
          static void bread(const char* tag) {
              persist([NSString stringWithFormat:@"PRE step=%d %s", g_step, tag]);
              if (g_fd >= 0) fsync(g_fd);
          }
          static void sigh(int sig) {
              char b[96];
              int n = snprintf(b, sizeof(b), "SIGNAL %d at step %d (%s)\n",
                               sig, g_step, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);
              if (g_fd >= 0) { write(g_fd, b, n); fsync(g_fd); }
              signal(sig, SIG_DFL);
              raise(sig);
          }
          static NSString* kr_name(kern_return_t kr) {
              switch (kr) {
                  case KERN_SUCCESS: return @"OK";
                  case 0xe00002bc: return @"Error";
                  case 0xe00002bd: return @"NoMem";
                  case 0xe00002be: return @"NoRes";
                  case 0xe00002c1: return @"NotPriv";
                  case 0xe00002c2: return @"BadArg";
                  case 0xe00002c5: return @"Excl";
                  case 0xe00002c7: return @"Unsup";
                  case 0xe00002cc: return @"NotOpen";
                  case 0xe00002d4: return @"Busy";
                  case 0xe00002e2: return @"NotPerm";
                  default: return [NSString stringWithFormat:@"0x%x", kr];
              }
          }
          static NSString* hex(const uint8_t* p, size_t n) {
              if (!n) return @"-";
              if (n > 64) n = 64;
              NSMutableString* s = [NSMutableString string];
              for (size_t i = 0; i < n; i++) [s appendFormat:@"%02x", p[i]];
              return s;
          }
          static NSString* doc_file(const char* f) {
              NSString* d = [NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              return [d stringByAppendingPathComponent:@(f)];
          }
          static void doc_path(const char* f, char* b, size_t n) {
              NSString* p = doc_file(f);
              strncpy(b, p.UTF8String, n - 1);
              b[n - 1] = 0;
          }
          static int load_step(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("step.txt")
                  encoding:NSUTF8StringEncoding error:nil];
              return s ? s.intValue : 0;
          }
          static void save_step(int v) {
              [[NSString stringWithFormat:@"%d", v] writeToFile:doc_file("step.txt")
                  atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_try(void) {
              g_try = 0;
              NSString* s = [NSString stringWithContentsOfFile:doc_file("try.txt")
                  encoding:NSUTF8StringEncoding error:nil];
              if (!s) return;
              NSArray<NSString*>* f = [s componentsSeparatedByString:@":"];
              if (f.count != 2) return;
              NSString* a = f[0];
              NSString* b = f[1];
              if (a.intValue == g_step) g_try = b.intValue;
          }
          static void save_try(void) {
              [[NSString stringWithFormat:@"%d:%d", g_step, g_try] writeToFile:doc_file("try.txt")
                  atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void latch_build(void) {
              NSString* bt = [NSString stringWithContentsOfFile:doc_file("build.txt")
                  encoding:NSUTF8StringEncoding error:nil];
              if ([bt isEqualToString:@BUILD_TAG]) return;
              unlink(doc_file("state.txt").UTF8String);
              save_step(0);
              g_try = 0;
              save_try();
              [@BUILD_TAG writeToFile:doc_file("build.txt")
                  atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_state(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("state.txt")
                  encoding:NSUTF8StringEncoding error:nil];
              for (NSString* ln in [s componentsSeparatedByString:@"\n"]) {
                  if ([ln hasPrefix:@"K "]) [g_seen addObject:[ln substringFromIndex:2]];
              }
          }
          static BOOL seen_key(NSString* k) {
              pthread_mutex_lock(&g_lk);
              BOOL r = [g_seen containsObject:k];
              [g_seen addObject:k];
              pthread_mutex_unlock(&g_lk);
              return r;
          }

          static kern_return_t callp(const char* tag, int ci, uint32_t sel,
                                     const uint8_t* in, size_t sz, size_t outsz, BOOL always) {
              if (ci < 0) ci = 0;
              uint32_t t = g_ctype[ci];
              NSString* key = [NSString stringWithFormat:@"%u:%u:%zu:%zu:%s", t, sel, sz, outsz, tag];
              if (seen_key(key)) return (kern_return_t)0xdeadbeef;
              persist([NSString stringWithFormat:@"K %@", key]);
              bread(tag);
              uint8_t out[4096]; size_t oSz = outsz;
              memset(out, 0xCC, sizeof(out));
              kern_return_t kr = IOConnectCallStructMethod(g_conn[ci], sel, in, sz,
                                                           outsz ? out : NULL, &oSz);
              __sync_fetch_and_add(&g_done, 1);
              if (kr == KERN_SUCCESS) {
                  persist([NSString stringWithFormat:@"OK %s t%u s%u out=%zu %@ IN %@",
                           tag, t, sel, oSz, hex(out, oSz), hex(in, sz)]);
                  __sync_fetch_and_add(&g_hits, 1);
                  ui([NSString stringWithFormat:@"!!! OK %s t%u out=%zu %@", tag, t, oSz, hex(out, oSz)]);
              } else if (kr != 0xe00002c2 && kr != 0xe00002c7 && kr != 0xe00002cc) {
                  persist([NSString stringWithFormat:@"%u %u %zu %@ | %s", t, sel, sz, kr_name(kr), tag]);
                  __sync_fetch_and_add(&g_hits, 1);
                  ui([NSString stringWithFormat:@"!! %s t%u -> %@", tag, t, kr_name(kr)]);
              } else {
                  persist([NSString stringWithFormat:@"%u %u %zu %@ | %s", t, sel, sz, kr_name(kr), tag]);
                  if (always) ui([NSString stringWithFormat:@"%s t%u -> %@", tag, t, kr_name(kr)]);
              }
              usleep(300);
              return kr;
          }

          static int open_all(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching("AppleJPEGDriver"), &it) != KERN_SUCCESS) return 0;
              int svc = 0;
              io_service_t s;
              while ((s = IOIteratorNext(it))) {
                  svc++;
                  for (uint32_t t = 0; t <= 40 && g_nconn < MAXC; t++) {
                      io_connect_t c = 0;
                      if (IOServiceOpen(s, mach_task_self(), t, &c) == KERN_SUCCESS) {
                          g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_nconn++;
                      }
                  }
                  IOObjectRelease(s);
              }
              IOObjectRelease(it);
              return svc;
          }

          static void vt_cb(void* ref, void* src, OSStatus st, VTEncodeInfoFlags fl,
                            CMSampleBufferRef sb) { g_vt_done = 1; }

          static void vt_start(void) {
              VTCompressionSessionCreate(NULL, 1920, 1080, kCMVideoCodecType_H264,
                  NULL, NULL, NULL, vt_cb, NULL, &g_vt);
              if (g_vt) VTCompressionSessionPrepareToEncodeFrames(g_vt);
          }

          static int vt_encode(void) {
              if (!g_vt) return -1;
              CVPixelBufferRef pb = NULL;
              NSDictionary* a = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              if (CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA,
                      (__bridge CFDictionaryRef)a, &pb) != kCVReturnSuccess) return -2;
              CVPixelBufferLockBaseAddress(pb, 0);
              memset(CVPixelBufferGetBaseAddress(pb), 0x80, CVPixelBufferGetDataSize(pb));
              CVPixelBufferUnlockBaseAddress(pb, 0);
              VTEncodeInfoFlags fl = 0;
              OSStatus st = VTCompressionSessionEncodeFrame(g_vt, pb, CMTimeMake(1, 30),
                  CMTimeMake(1, 30), NULL, NULL, &fl);
              CVPixelBufferRelease(pb);
              for (int i = 0; i < 300 && !g_vt_done; i++) usleep(10000);
              return (int)st;
          }

          static void type_sweep(void) {
              for (int i = 0; i < g_nconn; i++) {
                  uint8_t* in = calloc(1, 4096);
                  char tg[32]; snprintf(tg, sizeof(tg), "ts%u", g_ctype[i]);
                  kern_return_t kr = callp(tg, i, 5, in, 4096, 4096, YES);
                  free(in);
                  if (kr == KERN_SUCCESS && g_open_idx < 0) {
                      g_open_idx = i;
                      persist([NSString stringWithFormat:@"OPEN type=%u idx=%d", g_ctype[i], i]);
                      ui([NSString stringWithFormat:@"### OPEN t%u idx=%d", g_ctype[i], i]);
                  }
              }
          }

          static void s_zero(uint32_t sel) {
              uint8_t* in = calloc(1, 4096);
              char tg[32]; snprintf(tg, sizeof(tg), "z%u", sel);
              callp(tg, g_open_idx, sel, in, 4096, 4096, YES);
              free(in);
          }

          static size_t map_extent(mach_vm_address_t addr, mach_vm_size_t claim, BOOL* wr) {
              *wr = NO;
              mach_vm_address_t q = addr; mach_vm_size_t qsz = 0;
              vm_region_basic_info_data_64_t info;
              mach_port_t obj = MACH_PORT_NULL;
              mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64;
              kern_return_t r = mach_vm_region(mach_task_self(), &q, &qsz, VM_REGION_BASIC_INFO_64,
                                               (vm_region_info_t)&info, &cnt, &obj);
              if (obj != MACH_PORT_NULL) mach_port_deallocate(mach_task_self(), obj);
              if (r != KERN_SUCCESS) return 0;
              *wr = (info.protection & VM_PROT_WRITE) != 0;
              size_t real = (size_t)qsz;
              if (real > (size_t)claim) real = (size_t)claim;
              if (real > (1u << 20)) real = 1u << 20;
              return real;
          }

          static void mm_range(uint32_t lo, uint32_t hi, BOOL touch) {
              int ci = g_open_idx < 0 ? 0 : g_open_idx;
              for (uint32_t mt = lo; mt <= hi; mt++) {
                  char tg[32]; snprintf(tg, sizeof(tg), "mm%u", mt);
                  bread(tg);
                  mach_vm_address_t addr = 0; mach_vm_size_t size = 0;
                  kern_return_t kr = IOConnectMapMemory64(g_conn[ci], mt, mach_task_self(),
                                                          &addr, &size, kIOMapAnywhere);
                  persist([NSString stringWithFormat:@"map %u %@ %llu | %s", mt, kr_name(kr), size, tg]);
                  if (kr != KERN_SUCCESS) { ui([NSString stringWithFormat:@"%s -> %@", tg, kr_name(kr)]); continue; }
                  __sync_fetch_and_add(&g_hits, 1);
                  BOOL wr = NO; size_t ext = map_extent(addr, size, &wr);
                  ui([NSString stringWithFormat:@"!!! %s claim=%llu real=%zu wr=%d", tg, size, ext, (int)wr]);
                  if (touch && ext >= 64 && wr) {
                      uint8_t* p = (uint8_t*)addr;
                      ui([NSString stringWithFormat:@"    pre %@", hex(p, ext > 64 ? 64 : ext)]);
                      memset(p, 0xFF, ext > 4096 ? 4096 : ext);
                      s_zero(5); s_zero(4);
                      ui([NSString stringWithFormat:@"    post %@", hex(p, ext > 64 ? 64 : ext)]);
                  } else if (ext >= 64) ui(@"    read-only");
                  IOConnectUnmapMemory64(g_conn[ci], mt, mach_task_self(), addr);
              }
          }

          static void magic_sweep(void) {
              for (int o = 0; o < 5; o++) {
                  for (int v = 0; v < 8; v++) {
                      uint8_t* in = calloc(1, 4096);
                      memcpy(in + MAGIC_OFFS[o], &MAGIC_VALS[v], 4);
                      char tg[40]; snprintf(tg, sizeof(tg), "mg%d.%u", MAGIC_OFFS[o], MAGIC_VALS[v]);
                      callp(tg, g_open_idx, 5, in, 4096, 4096, NO);
                      free(in);
                  }
              }
          }

          static void cmd_zero(uint32_t off, uint32_t from, uint32_t to) {
              for (uint32_t v = from; v <= to; v++) {
                  uint8_t* in = calloc(1, 4096);
                  memcpy(in + off, &v, 4);
                  char tg[40]; snprintf(tg, sizeof(tg), "c%u.%u", off, v);
                  callp(tg, g_open_idx, 5, in, 4096, 4096, NO);
                  free(in);
              }
          }

          static void cmd122(void) {
              for (uint32_t v = 0; v <= 127; v++) {
                  uint8_t* in = calloc(1, 4096);
                  uint16_t h = (uint16_t)v;
                  memcpy(in + 122, &h, 2);
                  char tg[40]; snprintf(tg, sizeof(tg), "c122.%u", v);
                  callp(tg, g_open_idx, 5, in, 4096, 4096, NO);
                  free(in);
              }
          }

          static void hmap(uint32_t sel, int lo, int hi) {
              uint8_t* in = calloc(1, 4096);
              for (int i = lo; i <= hi; i++) {
                  in[i] = 0xFF;
                  char tg[40]; snprintf(tg, sizeof(tg), "h%u.%d", sel, i);
                  callp(tg, g_open_idx, sel, in, 4096, 4096, NO);
                  in[i] = 0;
              }
              free(in);
          }

          static void fuzz(int rounds) {
              for (int r = 0; r < rounds; r++) {
                  uint8_t* in = calloc(1, 4096);
                  uint32_t n = 1 + arc4random_uniform(6);
                  for (uint32_t k = 0; k < n; k++) {
                      uint32_t off = arc4random_uniform(1024) & ~3u;
                      uint32_t v = FUZZ_VALS[arc4random_uniform(12)];
                      memcpy(in + off, &v, 4);
                  }
                  char tg[32]; snprintf(tg, sizeof(tg), "f.%d", r);
                  callp(tg, g_open_idx, 5, in, 4096, 4096, NO);
                  free(in);
              }
          }

          static void do_step(int s) {
              switch (s) {
                  case 0: break;
                  case 1: vt_start(); break;
                  case 2: ui([NSString stringWithFormat:@"vt=%d done=%d", (int)vt_encode(), g_vt_done]); break;
                  case 3: type_sweep(); break;
                  case 4: if (g_open_idx >= 0) magic_sweep(); else ui(@"no open type"); break;
                  case 5: if (g_open_idx >= 0) s_zero(4); else ui(@"no open type"); break;
                  case 6: mm_range(0, 31, NO); break;
                  case 7: mm_range(0, 7, YES); break;
                  case 8: if (g_open_idx >= 0) cmd_zero(124, 0, 511); else ui(@"no open type"); break;
                  case 9: if (g_open_idx >= 0) cmd_zero(128, 0, 511); else ui(@"no open type"); break;
                  case 10: if (g_open_idx >= 0) cmd122(); else ui(@"no open type"); break;
                  case 11: if (g_open_idx >= 0) hmap(5, 0, 511); else ui(@"no open type"); break;
                  case 12: if (g_open_idx >= 0) fuzz(300); else ui(@"no open type"); break;
              }
          }

          static void run(void) {
              latch_build();
              char b[512]; doc_path("state.txt", b, sizeof(b));
              g_fd = open(b, O_CREAT | O_WRONLY | O_APPEND, 0644);
              g_seen = [NSMutableSet set];
              load_state();
              g_step = load_step();

              persist([NSString stringWithFormat:@"=== LAUNCH step=%d build=%s", g_step, BUILD_TAG]);
              if (g_fd >= 0) fsync(g_fd);

              ui([NSString stringWithFormat:@"BUILD %s", BUILD_TAG]);
              ui([NSString stringWithFormat:@"STEP %d/%d: %s", g_step, STEP_MAX,
                  STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]]);

              if (g_step > STEP_MAX) { ui(@"ALL DONE"); return; }

              int svc = open_all();
              ui([NSString stringWithFormat:@"svc=%d conns=%d", svc, g_nconn]);
              persist([NSString stringWithFormat:@"svc=%d conns=%d", svc, g_nconn]);
              if (!g_nconn) { ui(@"NO CONN — STOP"); g_stop = 1; }

              while (g_step <= STEP_MAX && !g_stop) {
                  load_try();
                  if (g_try >= TRY_MAX) {
                      ui([NSString stringWithFormat:@"SKIP %d %s", g_step, STEP_NAME[g_step]]);
                      persist([NSString stringWithFormat:@"SKIP %d", g_step]);
                      g_step++; save_step(g_step);
                      usleep(150000);
                      continue;
                  }
                  g_try++; save_try();

                  ui([NSString stringWithFormat:@"CHAIN %d %s", g_step, STEP_NAME[g_step]]);
                  do_step(g_step);

                  persist([NSString stringWithFormat:@"STEP %d OK calls=%d hits=%d open=%d",
                           g_step, g_done, g_hits, g_open_idx]);
                  if (g_fd >= 0) fsync(g_fd);
                  ui([NSString stringWithFormat:@"STEP %d SURVIVED", g_step]);
                  g_step++; save_step(g_step);
                  if (g_step <= STEP_MAX) usleep(400000);
              }

              ui(@"CHAIN END");
              persist(@"CHAIN END");
              if (g_fd >= 0) fsync(g_fd);
              close(g_fd); g_fd = -1;
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              g_lines = [NSMutableArray array];
              signal(SIGSEGV, sigh); signal(SIGBUS, sigh); signal(SIGABRT, sigh);
              signal(SIGILL, sigh); signal(SIGFPE, sigh);

              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 44, 344, 44)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightRegular];
              g_hb.numberOfLines = 2;
              g_hb.text = @BUILD_TAG;
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 92; r.size.height -= 100;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              [NSTimer scheduledTimerWithTimeInterval:0.25 repeats:YES block:^(NSTimer*) {
                  g_hb.text = [NSString stringWithFormat:@"%s step %d/%d c=%d h=%d o=%d",
                               BUILD_TAG, g_step, STEP_MAX, g_done, g_hits, g_open_idx];
                  flush_ui();
              }];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC),
                             dispatch_get_global_queue(0,0), ^{ run(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          MAINEOF

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: syntax
        run: |
          set +e
          xcrun -sdk iphoneos clang -fsyntax-only -x objective-c \
            -target arm64-apple-ios18.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -Wno-implicit-function-declaration \
            Sources/main.m > s.log 2>&1
          rc=$?
          set -e
          grep -nE "error:" s.log | head -40
          exit $rc

      - name: build
        run: |
          mkdir -p out/Payload
          set +e
          xcodebuild -project probe.xcodeproj -target probe \
            -sdk iphoneos -configuration Release \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/out/Payload \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_CFLAGS="-Wno-implicit-function-declaration" \
            build > b.log 2>&1
          rc=$?
          set -e
          echo "=== rc=$rc ==="
          grep -nE "error:|fatal error:" b.log | head -40
          echo "=== end ==="
          exit $rc

      - name: ipa
        run: |
          ls -la out/Payload
          cd out && zip -r probe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.ipa
          if-no-files-found: error
