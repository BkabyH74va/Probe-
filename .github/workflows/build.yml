              }
              uint64_t o2[SCO] = {0}; size_t c2 = 0; uint8_t b2[64]; size_t z2 = 0;
              kern_return_t k2 = rawv(g_conn[g_best], 2, 0, NULL, 0, NULL, 0, o2, &c2, b2, &z2);
              plog(@"SEQ s2 -> %@", kr_name(k2));
              ulog(@"SEQ s2 -> %@", kr_name(k2));
              for (int i = 0; i < 3; i++) {
