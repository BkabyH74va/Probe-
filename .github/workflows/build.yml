name: dylib
on: [push, workflow_dispatch]
jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: source
        run: |
          mkdir -p out
          cat > buurd.m <<'EOF'
          #import <UIKit/UIKit.h>
          #import <mach/mach.h>
          #import <mach-o/dyld.h>
          #import <dlfcn.h>
          #include <string.h>

          // ================= USTAWIENIA =================
          #define OFF_LIST      0x00000000ULL   // wskaznik do listy chunkow
          #define OFF_COUNT     0x00000000ULL   // uint32 liczba entity (0 = uzyj MAX_ENT)
          #define OFF_MATRIX    0x00000000ULL   // float[16] row-major view matrix
          #define OFF_ENT_POS   0x00000000ULL   // float x,y,z w entity
          // ==============================================

          #define STRIDE      0x78
          #define CHUNK_BITS  9
          #define MAX_ENT     4096
          #define MAX_DRAW    28

          static uintptr_t g_base = 0;
          static uint32_t  g_ents = 0;
          static BOOL      g_ready = NO;

          static inline BOOL rd(uintptr_t a, void* b, size_t n) {
              if (!a || a < 0x100000000ULL) return NO;
              vm_size_t got = 0;
              return vm_read_overwrite(mach_task_self(), (vm_address_t)a,
                       (vm_size_t)n, (vm_address_t)b, &got) == KERN_SUCCESS && got == n;
          }
          static inline uint64_t rd64(uintptr_t a) { uint64_t v = 0; rd(a, &v, 8); return v; }
          static inline uint32_t rd32(uintptr_t a) { uint32_t v = 0; rd(a, &v, 4); return v; }
          static inline float    rdf (uintptr_t a) { float    v = 0; rd(a, &v, 4); return v; }

          static BOOL w2s(const float* m, float x, float y, float z, CGPoint* o, CGSize s) {
              float w = m[3]*x + m[7]*y + m[11]*z + m[15];
              if (w <= 0.001f) return NO;
              float cx = m[0]*x + m[4]*y + m[8]*z  + m[12];
              float cy = m[1]*x + m[5]*y + m[9]*z  + m[13];
              float nx = cx / w, ny = cy / w;
              o->x = (s.width  * 0.5f) * (1.0f + nx);
              o->y = (s.height * 0.5f) * (1.0f - ny);
              return YES;
          }

          @interface BUView : UIView
          @property (nonatomic, strong) NSMutableArray<NSString*>* lines;
          @end

          @implementation BUView
          - (instancetype)initWithFrame:(CGRect)f {
              if ((self = [super initWithFrame:f])) {
                  self.backgroundColor = UIColor.clearColor;
                  self.userInteractionEnabled = NO;
                  self.opaque = NO;
                  _lines = [NSMutableArray array];
              }
              return self;
          }
          - (void)drawRect:(CGRect)r {
              NSDictionary* at = @{
                  NSFontAttributeName: [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightRegular],
                  NSForegroundColorAttributeName: UIColor.greenColor };
              CGFloat y = 34;
              for (NSString* s in self.lines) {
                  [s drawAtPoint:CGPointMake(6, y) withAttributes:at];
                  y += 11;
                  if (y > r.size.height - 40) break;
              }
          }
          @end

          static BUView* g_view = NULL;

          static void tick(void) {
              if (!g_ready || !g_base) return;
              CGSize sz = UIScreen.mainScreen.bounds.size;
              NSMutableArray* out = [NSMutableArray array];

              float m[16];
              if (!rd(g_base + OFF_MATRIX, m, sizeof(m))) {
                  [out addObject:@"matrix unreadable"];
              }
              uintptr_t list = rd64(g_base + OFF_LIST);
              uint32_t cnt = OFF_COUNT ? rd32(g_base + OFF_COUNT) : 0;
              if (!cnt || cnt > MAX_ENT) cnt = MAX_ENT;
              g_ents = cnt;

              [out addObject:[NSString stringWithFormat:@"base=%p list=%p n=%u", (void*)g_base, (void*)list, cnt]];

              int shown = 0, live = 0;
              for (uint32_t i = 0; i < cnt && shown < MAX_DRAW; i++) {
                  uintptr_t chunk = rd64(list + ((i >> CHUNK_BITS) * 8));
                  if (!chunk) continue;
                  uintptr_t ent = rd64(chunk + ((i & 0x1FF) * STRIDE));
                  if (!ent) continue;
                  live++;
                  float x = rdf(ent + OFF_ENT_POS);
                  float y = rdf(ent + OFF_ENT_POS + 4);
                  float z = rdf(ent + OFF_ENT_POS + 8);
                  CGPoint p;
                  if (!w2s(m, x, y, z, &p, sz)) continue;
                  [out addObject:[NSString stringWithFormat:@"#%u %4.0f,%4.0f | %.0f %.0f %.0f",
                                 i, p.x, p.y, x, y, z]];
                  shown++;
              }
              [out addObject:[NSString stringWithFormat:@"live=%d shown=%d", live, shown]];

              dispatch_async(dispatch_get_main_queue(), ^{
                  g_view.lines = out;
                  [g_view setNeedsDisplay];
              });
          }

          static void install(void) {
              if (g_view) return;
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow* w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
                  w.windowLevel = UIWindowLevelAlert + 1;
                  w.backgroundColor = UIColor.clearColor;
                  UIViewController* vc = [UIViewController new];
                  vc.view.backgroundColor = UIColor.clearColor;
                  g_view = [[BUView alloc] initWithFrame:UIScreen.mainScreen.bounds];
                  g_view.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                  [vc.view addSubview:g_view];
                  w.rootViewController = vc;
                  [w makeKeyAndVisible];

                  [NSTimer scheduledTimerWithTimeInterval:0.05 repeats:YES block:^(NSTimer* t) { tick(); }];
                  NSLog(@"BUURD: overlay up, base=%p", (void*)g_base);
              });
          }

          __attribute__((constructor))
          static void buurd_init(void) {
              const struct mach_header_64* h = (const struct mach_header_64*)_dyld_get_image_header(0);
              intptr_t slide = _dyld_get_image_vmaddr_slide(0);
              if (h) g_base = (uintptr_t)h + (uintptr_t)slide;
              NSLog(@"BUURD: loaded, hdr=%p slide=%ld base=%p", h, (long)slide, (void*)g_base);
              g_ready = YES;
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2 * NSEC_PER_SEC),
                             dispatch_get_main_queue(), ^{ install(); });
          }
          EOF

      - name: compile
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64e -arch arm64 -dynamiclib -fobjc-arc -O2 \
            -isysroot "$SDK" \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -install_name @executable_path/buurd.dylib \
            -Wl,-undefined,dynamic_lookup \
            -o out/buurd.dylib buurd.m
          lipo -info out/buurd.dylib
          otool -L out/buurd.dylib
          file out/buurd.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: buurd-dylib
          path: out/buurd.dylib
          if-no-files-found: error
