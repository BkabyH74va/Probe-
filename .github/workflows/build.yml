                      kern_return_t kr = rawv(g_conn[g_best], T[i], m, NULL, 0, NULL, 0, o, &c, b, &z);
                      plog(@"SEQ s%u m%d -> %@", T[i], m, kr_name(kr));
                      ulog(@"SEQ s%u m%d -> %@", T[i], m, kr_name(kr));
