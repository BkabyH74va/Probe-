          static void combo_m1(void) {
              surf_make();
              for (uint32_t sic = 0; sic <= 2; sic++) {
                  for (int zi = 0; zi < CSZ_N; zi++) {
                      for (int zo = 0; zo < 2; zo++) {
                          size_t zos = zo ? 4096 : CSZ[zi];
                          uint8_t* in = calloc(1, FIXED);
                          uint64_t sin[SCO] = {0};
                          if (!in) continue;
                          desc_into(in, CSZ[zi]);
                          for (uint32_t k = 0; k < sic && k < SCO; k++) sin[k] = CSZ[zi];
                          char tg[32]; snprintf(tg, sizeof(tg), "a%u.%d.%d", sic, zi, zo);
                          att(tg, 1, sic, CSZ[zi], zos, in, sin);
                          free(in);
                      }
                  }
              }
              ulog(@"combo-m1 att=%d ok4=%d", g_s4_att, g_ok4);
          }

          static void confirm_all(void) {
              if (!g_w4) { ulog(@"no s4 winner"); return; }
              uint8_t* in = calloc(1, FIXED);
              uint64_t sin[SCO] = {0};
              if (!in) return;
              memcpy(in, g_w4_pay, g_w4_zis > FIXED ? FIXED : g_w4_zis);
              memcpy(sin, g_w4_sc, sizeof(uint64_t) * SCO);
              for (int ci = 0; ci < g_nconn; ci++) {
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[FIXED]; size_t szb = 0;
                  kern_return_t kr = rawv(g_conn[ci], 4, 1, sin, g_w4_sic, in, g_w4_zis, so, &sc, sb, &szb);
                  plog(@"CF4 n%d t%u -> %@ so0=%llu szb=%zu", g_node[ci], g_ctype[ci], kr_name(kr), (unsigned long long)so[0], szb);
                  ulog(@"CF4 n%d t%u -> %@", g_node[ci], g_ctype[ci], kr_name(kr));
              }
              free(in);
          }

          static void summary(void) {
              NSString* st = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!st) { ulog(@"no state"); return; }
              NSMutableDictionary* hist = [NSMutableDictionary dictionary];
              NSMutableArray* keep = [NSMutableArray array];
              int lines = 0, calls = 0, bad = 0, wins = 0, flips = 0, sigs = 0, opens = 0;
              for (NSString* ln in [st componentsSeparatedByString:@"\n"]) {
                  if (!ln.length) continue;
                  lines++;
                  if ([ln hasPrefix:@"WIN4 "]) { wins++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"FLIP9 "] || [ln hasPrefix:@"FLIP5 "]) { flips++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"SIGNAL "]) { sigs++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"rootopen"] || [ln hasPrefix:@"ADDCLIENT"] || [ln hasPrefix:@"SVC "] ||
                      [ln hasPrefix:@"PARENT"] || [ln hasPrefix:@"SIB "] || [ln hasPrefix:@"JCLS "] ||
                      [ln hasPrefix:@"PROPS"] || [ln hasPrefix:@"NODE "] || [ln hasPrefix:@"CHILDOPEN"] ||
                      [ln hasPrefix:@"CSWEEP"] || [ln hasPrefix:@"SEQ"] || [ln hasPrefix:@"csops"] ||
                      [ln hasPrefix:@"surf="] || [ln hasPrefix:@"svc="] || [ln hasPrefix:@"TRAP"]) {
                      if ([ln rangeOfString:@"OK"].location != NSNotFound) opens++;
                      [keep addObject:ln];
                      continue;
                  }
                  BOOL isCall = [ln hasPrefix:@"S4 "] || [ln hasPrefix:@"PING "] || [ln hasPrefix:@"SW1 "] ||
                                [ln hasPrefix:@"SW2 "] || [ln hasPrefix:@"OS "] || [ln hasPrefix:@"CS "] ||
                                [ln hasPrefix:@"P9 "];
                  if (!isCall) continue;
                  calls++;
                  NSRange ar = [ln rangeOfString:@" -> "];
                  if (ar.location == NSNotFound) continue;
                  NSString* rest = [ln substringFromIndex:ar.location + 4];
                  NSString* cls = [[rest componentsSeparatedByString:@" "] firstObject];
                  if (!cls.length) continue;
                  NSNumber* c = hist[cls];
                  hist[cls] = @(c.intValue + 1);
                  if ([cls isEqualToString:@"BadArg"]) bad++;
                  else [keep addObject:ln];
              }
              plog(@"REPLAY lines=%d calls=%d bad=%d nonbad=%lu wins=%d flips=%d sigs=%d opens=%d",
                   lines, calls, bad, (unsigned long)(calls - bad), wins, flips, sigs, opens);
              NSMutableString* h = [NSMutableString string];
              for (NSString* k in [[hist allKeys] sortedArrayUsingSelector:@selector(compare:)])
                  [h appendFormat:@"%@=%d ", k, [hist[k] intValue]];
              plog(@"HIST %@", h);
              ulog(@"REPLAY calls=%d bad=%d nonbad=%lu wins=%d flips=%d opens=%d", calls, bad, (unsigned long)(calls - bad), wins, flips, opens);
              ulog(@"HIST %@", h);
              NSUInteger cap = keep.count > 200 ? 200 : keep.count;
              for (NSUInteger i = 0; i < cap; i++) { plog(@"KEEP %@", keep[i]); ulog(@"%@", keep[i]); }
              if (keep.count > cap) ulog(@"... +%lu more", (unsigned long)(keep.count - cap));
          }

          static void verdict(void) {
              NSString* st = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!st) { ulog(@"VERDICT no state"); return; }
              NSMutableDictionary* sel = [NSMutableDictionary dictionary];
              for (NSString* ln in [st componentsSeparatedByString:@"\n"]) {
                  NSRange ar = [ln rangeOfString:@" -> "];
                  if (ar.location == NSNotFound) continue;
                  NSString* pre = [ln substringToIndex:ar.location];
                  NSString* rest = [ln substringFromIndex:ar.location + 4];
                  NSString* cls = [[rest componentsSeparatedByString:@" "] firstObject];
                  if (!cls.length) continue;
                  NSRange hr = [pre rangeOfString:@" hb="];
                  if (hr.location != NSNotFound) pre = [pre substringToIndex:hr.location];
                  NSArray* t = [pre componentsSeparatedByString:@" "];
                  if (!t.count) continue;
                  NSString* key = [t lastObject];
                  if (!key.length) continue;
                  if ([pre hasPrefix:@"CS "] || [pre hasPrefix:@"P9 "]) {
                      if (t.count >= 3) key = [NSString stringWithFormat:@"%@ %@", t[t.count-2], key];
                  }
                  NSString* k2 = [NSString stringWithFormat:@"%@:%@", key, cls];
                  NSNumber* c = sel[k2];
                  sel[k2] = @(c.intValue + 1);
              }
              NSMutableString* b = [NSMutableString string];
              for (NSString* k in [[sel allKeys] sortedArrayUsingSelector:@selector(compare:)])
                  [b appendFormat:@"%@x%d ", k, [sel[k] intValue]];
              plog(@"VERDICT2 %@", b);
              ulog(@"VERDICT2 %@", b);
          }

          static void do_step(int s) {
              switch (s) {
                  case 0: break;
                  case 1: census(); break;
                  case 2: dump_sig(); break;
                  case 3: tree_up(); break;
                  case 4: svc_open(); break;
                  case 5: dump_tree(); break;
                  case 6: prop_dump(); break;
                  case 7: vt_start(); break;
                  case 8: ulog(@"vt=%d", (int)vt_encode()); break;
                  case 9: root_open(); break;
                  case 10: addclient(); break;
                  case 11: child_open(); break;
                  case 12: child_sweep(); break;
                  case 13: ping_sweep(); break;
                  case 14: s9_payload(); break;
                  case 15: sweep_mode(1, "1"); break;
                  case 16: out_struct(); break;
                  case 17: seq_test(); break;
                  case 18: combo_m1(); break;
                  case 19: confirm_all(); break;
                  case 20: summary(); break;
                  case 21: verdict(); break;
              }
          }

          static void run(void) {
              latch_build();
              for (int i = 0; i < MAXC; i++) g_s9res[i] = UNTRIED;
              char b[512]; doc_path("state.txt", b, sizeof(b));
              g_fd = open(b, O_CREAT | O_WRONLY | O_APPEND, 0644);
              g_seen = [NSMutableSet set];
              load_state();
              g_step = load_step();

              mach_port_allocate(mach_task_self(), MACH_RIGHT_RECEIVE, &g_wake);
              mach_port_insert_right(mach_task_self(), g_wake, g_wake, MACH_MSG_TYPE_MAKE_SEND);

              void* ik = dlopen("/System/Library/Frameworks/IOKit.framework/IOKit", RTLD_LAZY);
              g_addclient = (fn_addclient)dlsym(RTLD_DEFAULT, "IOConnectAddClient");
              if (!g_addclient && ik) g_addclient = (fn_addclient)dlsym(ik, "IOConnectAddClient");
              plog(@"addclient sym=%p", (void*)g_addclient);

              plog(@"=== LAUNCH step=%d build=%s wake=0x%x", g_step, BUILD_TAG, g_wake);
              if (g_fd >= 0) fsync(g_fd);
              ulog(@"BUILD %s", BUILD_TAG);
              ulog(@"STEP %d/%d: %s", g_step, STEP_MAX, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);

              if (g_step > STEP_MAX) {
                  ulog(@"ALL DONE - replay");
                  summary();
                  verdict();
                  if (g_fd >= 0) fsync(g_fd);
                  close(g_fd); g_fd = -1;
                  return;
              }

              int svc = find_root();
              ulog(@"svc=%d", svc);
              plog(@"svc=%d", svc);
              if (!g_root) { ulog(@"NO ROOT"); g_stop = 1; }

              while (g_step <= STEP_MAX && !g_stop) {
                  load_try();
                  if (g_try >= TRY_MAX) {
                      ulog(@"SKIP %d", g_step);
                      plog(@"SKIP %d", g_step);
                      g_step++; save_step(g_step);
                      usleep(150000);
                      continue;
                  }
                  g_try++; save_try();
                  ulog(@"CHAIN %d %s", g_step, STEP_NAME[g_step]);
                  do_step(g_step);
                  plog(@"STEP %d OK calls=%d hits=%d ok4=%d flip9=%d m1=%d", g_step, g_done, g_hits, g_ok4, g_5flip, g_m1hit);
                  if (g_fd >= 0) fsync(g_fd);
                  ulog(@"STEP %d SURVIVED", g_step);
                  g_step++; save_step(g_step);
                  if (g_step <= STEP_MAX) usleep(350000);
              }

              ulog(@"CHAIN END");
              plog(@"CHAIN END");
              if (g_fd >= 0) fsync(g_fd);
              close(g_fd); g_fd = -1;
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              g_lines = [NSMutableArray array];
              signal(SIGSEGV, sigh); signal(SIGBUS, sigh); signal(SIGABRT, sigh);
              signal(SIGILL, sigh); signal(SIGFPE, sigh);

              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 44, 344, 44)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightRegular];
              g_hb.numberOfLines = 2;
              g_hb.text = @BUILD_TAG;
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 92; r.size.height -= 100;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              [NSTimer scheduledTimerWithTimeInterval:0.25 repeats:YES block:^(NSTimer*) {
                  g_hb.text = [NSString stringWithFormat:@"%s step %d/%d c=%d ok4=%d flip9=%d m1=%d", BUILD_TAG, g_step, STEP_MAX, g_done, g_ok4, g_5flip, g_m1hit];
                  flush_ui();
              }];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC), dispatch_get_global_queue(0,0), ^{ run(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          MAINEOF

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: syntax
        run: |
          set +e
          xcrun -sdk iphoneos clang -fsyntax-only -x objective-c \
            -target arm64-apple-ios18.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -F "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/PrivateFrameworks" \
            -F "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks" \
            -Wno-implicit-function-declaration \
            Sources/main.m > s.log 2>&1
          rc=$?
          set -e
          grep -nE "error:" s.log | head -40
          exit $rc

      - name: build
        run: |
          mkdir -p out/Payload
          set +e
          xcodebuild -project probe.xcodeproj -target probe \
            -sdk iphoneos -configuration Release \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/out/Payload \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_CFLAGS="-Wno-implicit-function-declaration" \
            OTHER_LDFLAGS="-F$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/PrivateFrameworks" \
            build > b.log 2>&1
          rc=$?
          set -e
          echo "=== rc=$rc ==="
          grep -nE "error:|fatal error:|Undefined symbols" b.log | head -40
          echo "=== end ==="
          exit $rc

      - name: ipa
        run: |
          ls -la out/Payload
          test -d out/Payload/probe.app || { echo "NO APP BUNDLE"; ls -la out/Payload; exit 1; }
          test -f out/Payload/probe.app/probe || { echo "NO BINARY"; ls -la out/Payload/probe.app; exit 1; }
          cd out
          rm -f probe.ipa
          zip -r -q probe.ipa Payload
          ls -la probe.ipa
          test -s probe.ipa || { echo "ZIP EMPTY"; exit 1; }
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: probe-ipa-${{ github.run_number }}
          path: out/probe.ipa
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0
