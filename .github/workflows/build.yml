name: build
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scaffold
        run: |
          mkdir -p Sources
          cat > project.yml <<'EOF'
          name: probe
          options: { bundleIdPrefix: com.buurza, deploymentTarget: { iOS: "18.0" } }
          targets:
            probe:
              type: application
              platform: iOS
              sources: [Sources]
              entitlements: { path: probe.entitlements }
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: buurd
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
              settings:
                ARCHS: "arm64e arm64"
                SUPPORTED_PLATFORMS: "iphoneos"
                SDKROOT: "iphoneos"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                OTHER_CFLAGS: "-Wno-implicit-function-declaration"
              dependencies:
                - sdk: IOKit.framework
                - sdk: UIKit.framework
                - sdk: VideoToolbox.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
                - sdk: Security.framework
          EOF
          cat > probe.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>get-task-allow</key><true/>
          </dict></plist>
          EOF
          cat > Sources/main.m <<'EOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <Security/Security.h>
          #import <VideoToolbox/VideoToolbox.h>
          #include <unistd.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <pthread.h>

          typedef struct __SecTask *SecTaskRef;
          extern int csops(pid_t, unsigned int, void *, size_t);
          #define CS_OPS_STATUS 0

          static UITextView* g_tv;
          static UILabel* g_hb;
          static volatile int g_done = 0, g_total = 0, g_hits = 0, g_stop = 0;
          static int g_fd = -1;
          static NSMutableSet* g_seen;
          static pthread_mutex_t g_lk = PTHREAD_MUTEX_INITIALIZER;

          #define MAXC 24
          static io_connect_t g_conn[MAXC];
          static uint32_t g_ctype[MAXC];
          static int g_nconn = 0;

          static int g_pc = 0;   // para index
          static int g_psel = 0;
          static volatile int g_cursor = 0;
          static int g_npairs = 0;

          static const size_t kCoarse[] = { 8,16,24,32,48,64,96,128,192,256,384,512,768,1024,1536,2048,3072,4096 };
          static const int kNCoarse = sizeof(kCoarse)/sizeof(kCoarse[0]);

          static void ui(NSString* s) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  g_tv.text = [g_tv.text stringByAppendingFormat:@"\n%@", s];
                  [g_tv scrollRangeToVisible:NSMakeRange(g_tv.text.length, 0)];
              });
          }

          static void persist(NSString* line) {
              if (g_fd < 0) return;
              NSData* d = [[line stringByAppendingString:@"\n"] dataUsingEncoding:NSUTF8StringEncoding];
              pthread_mutex_lock(&g_lk);
              write(g_fd, d.bytes, d.length);
              pthread_mutex_unlock(&g_lk);
          }

          static NSString* kr_name(kern_return_t kr) {
              switch (kr) {
                  case KERN_SUCCESS: return @"OK";
                  case 0xe00002bc: return @"Error";
                  case 0xe00002bd: return @"NoMem";
                  case 0xe00002be: return @"NoRes";
                  case 0xe00002c1: return @"NotPriv";
                  case 0xe00002c2: return @"BadArg";
                  case 0xe00002c5: return @"Excl";
                  case 0xe00002c7: return @"Unsup";
                  case 0xe00002cc: return @"NotOpen";
                  case 0xe00002cd: return @"NotReadable";
                  case 0xe00002ce: return @"NotWritable";
                  case 0xe00002d4: return @"Busy";
                  case 0xe00002e2: return @"NotPerm";
                  default: return [NSString stringWithFormat:@"0x%x", kr];
              }
          }
          static NSString* hex(const uint8_t* p, size_t n) {
              if (!n) return @"-";
              if (n > 40) n = 40;
              NSMutableString* s = [NSMutableString string];
              for (size_t i = 0; i < n; i++) [s appendFormat:@"%02x", p[i]];
              return s;
          }

          static void state_path(char* b, size_t n) {
              NSString* p = [NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory, NSUserDomainMask, YES).firstObject
                  stringByAppendingPathComponent:@"state.txt"];
              strncpy(b, p.UTF8String, n - 1);
          }

          static void load_state(void) {
              char b[512]; state_path(b, sizeof(b));
              NSString* s = [NSString stringWithContentsOfFile:@(b) encoding:NSUTF8StringEncoding error:nil];
              if (!s) return;
              for (NSString* ln in [s componentsSeparatedByString:@"\n"]) {
                  if (ln.length < 5) continue;
                  NSArray* f = [ln componentsSeparatedByString:@" "];
                  if (f.count < 3) continue;
                  [g_seen addObject:[NSString stringWithFormat:@"%@:%@:%@", f[0], f[1], f[2]]];
              }
          }

          static int try_one(io_connect_t c, uint32_t type, uint32_t sel, size_t sz,
                             kern_return_t* out_kr) {
              NSString* key = [NSString stringWithFormat:@"%u:%u:%zu", type, sel, sz];
              pthread_mutex_lock(&g_lk);
              BOOL skip = [g_seen containsObject:key];
              pthread_mutex_unlock(&g_lk);
              if (skip) return -1;

              uint8_t* in = calloc(1, sz);
              uint8_t out[4096]; size_t oSz = sizeof(out);
              memset(out, 0xCC, sizeof(out));
              kern_return_t kr = IOConnectCallStructMethod(c, sel, in, sz, out, &oSz);
              free(in);

              pthread_mutex_lock(&g_lk);
              [g_seen addObject:key];
              pthread_mutex_unlock(&g_lk);

              NSString* line = [NSString stringWithFormat:@"%u %u %zu %@ %zu %@",
                                type, sel, sz, kr_name(kr), oSz, hex(out, oSz)];
              persist(line);

              if (kr == 0xe00002c7 || kr == 0xe00002c2) return 0;

              __sync_fetch_and_add(&g_hits, 1);
              ui([NSString stringWithFormat:@"!! t%u s%u sz=%zu -> %@ out=%zu %@",
                  type, sel, sz, kr_name(kr), oSz, hex(out, oSz)]);
              if (out_kr) *out_kr = kr;
              return 1;
          }

          static void* worker(void* arg) {
              while (!g_stop) {
                  int i = __sync_fetch_and_add(&g_cursor, 1);
                  if (i >= g_npairs) break;
                  int ci = i / 48;
                  uint32_t sel = (uint32_t)(i % 48);
                  if (ci >= g_nconn) continue;

                  for (int k = 0; k < kNCoarse; k++) {
                      kern_return_t kr = 0;
                      int r = try_one(g_conn[ci], g_ctype[ci], sel, kCoarse[k], &kr);
                      if (r == 1) {
                          size_t base = kCoarse[k];
                          for (int d = 1; d <= 6; d++) {
                              size_t f = base + (size_t)d * 4;
                              try_one(g_conn[ci], g_ctype[ci], sel, f, NULL);
                          }
                          break;
                      }
                      if (r == 0 && kr == 0xe00002c7) break;
                      usleep(500);
                  }
                  __sync_fetch_and_add(&g_done, 1);
                  dispatch_async(dispatch_get_main_queue(), ^{
                      g_hb.text = [NSString stringWithFormat:@"done=%d/%d hits=%d",
                                   g_done, g_total, g_hits];
                  });
              }
              return NULL;
          }

          static void open_all(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault,
                      IOServiceMatching("AppleJPEGDriver"), &it) != KERN_SUCCESS) return;
              io_service_t s; int nodes = 0;
              while ((s = IOIteratorNext(it)) && nodes < 3 && g_nconn < MAXC) {
                  nodes++;
                  for (int t = 0; t <= 40 && g_nconn < MAXC; t++) {
                      io_connect_t c = 0;
                      if (IOServiceOpen(s, mach_task_self(), (uint32_t)t, &c) == KERN_SUCCESS) {
                          g_conn[g_nconn] = c;
                          g_ctype[g_nconn] = (uint32_t)t;
                          g_nconn++;
                          persist([NSString stringWithFormat:@"OPEN %d %d", nodes, t]);
                      }
                  }
                  IOObjectRelease(s);
              }
              IOObjectRelease(it);
          }

          static void run_probe(void) {
              char b[512]; state_path(b, sizeof(b));
              g_fd = open(b, O_CREAT | O_WRONLY | O_APPEND, 0644);
              g_seen = [NSMutableSet set];
              load_state();
              ui([NSString stringWithFormat:@"resume: %lu entries", (unsigned long)g_seen.count]);

              VTCompressionSessionRef v = NULL;
              VTCompressionSessionCreate(NULL, 1920, 1080, kCMVideoCodecType_H264,
                  NULL, NULL, NULL, NULL, NULL, &v);
              if (v) VTCompressionSessionPrepareToEncodeFrames(v);
              usleep(250000);

              open_all();
              ui([NSString stringWithFormat:@"conns=%d", g_nconn]);
              if (!g_nconn) return;

              g_npairs = g_nconn * 48;
              g_total = g_npairs;

              pthread_t th[4];
              for (int i = 0; i < 4; i++) pthread_create(&th[i], NULL, worker, NULL);
              for (int i = 0; i < 4; i++) pthread_join(th[i], NULL);

              ui([NSString stringWithFormat:@"FINISHED hits=%d", g_hits]);
              ui(g_hits ? @"[+] HITS — send state.txt" : @"[-] no hits");
              close(g_fd); g_fd = -1;
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 50, 340, 18)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
              g_hb.text = @"idle";
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 72; r.size.height -= 80;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC),
                             dispatch_get_global_queue(0,0), ^{ run_probe(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          EOF

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: build
        run: |
          mkdir -p out/Payload
          xcodebuild -project probe.xcodeproj -target probe \
            -sdk iphoneos -configuration Release \
            -arch arm64e -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/out/Payload \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_CFLAGS="-Wno-implicit-function-declaration" \
            build

      - name: ipa
        run: |
          ls -la out/Payload
          cd out && zip -r probe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.ipa
          if-no-files-found: error
