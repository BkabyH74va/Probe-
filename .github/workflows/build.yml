name: probe
options: { bundleIdPrefix: com.buurza8, deploymentTarget: { iOS: "18.0" } }
targets:
  probe:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements: { path: probe.entitlements }
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: buurd8
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "8"
    settings:
      ARCHS: "arm64e arm64"
      SUPPORTED_PLATFORMS: "iphoneos"
      SDKROOT: "iphoneos"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      OTHER_CFLAGS: "-Wno-implicit-function-declaration"
    dependencies:
      - sdk: IOKit.framework
      - sdk: UIKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
