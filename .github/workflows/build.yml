name: build
on: [push, workflow_dispatch]
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scaffold
        run: |
          mkdir -p Sources
          cat > project.yml <<'EOF'
          name: probe
          options: { bundleIdPrefix: com.buurza, deploymentTarget: { iOS: "18.0" } }
          targets:
            probe:
              type: application
              platform: iOS
              sources: [Sources]
              entitlements: { path: probe.entitlements }
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: buurd
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
              settings:
                ARCHS: "arm64e arm64"
                SUPPORTED_PLATFORMS: "iphoneos"
                SDKROOT: "iphoneos"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                OTHER_CFLAGS: "-Wno-implicit-function-declaration"
              dependencies:
                - sdk: IOKit.framework
                - sdk: UIKit.framework
                - sdk: VideoToolbox.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
                - sdk: Security.framework
          EOF
          cat > probe.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>com.apple.security.iokit-user-client-class</key>
            <array>
              <string>AVEVideoEncoderUserClient</string>
              <string>AppleAVE2UserClient</string>
            </array>
          </dict></plist>
          EOF
          cat > Sources/main.m <<'EOF'
          #import <UIKit/UIKit.h>
          #import <IOKit/IOKitLib.h>
          #import <VideoToolbox/VideoToolbox.h>
          #import <CoreVideo/CoreVideo.h>
          #import <Security/Security.h>
          #include <unistd.h>
          #include <dlfcn.h>
          #include <errno.h>
          #include <sys/sysctl.h>

          typedef struct __SecTask *SecTaskRef;
          extern SecTaskRef SecTaskCreateFromSelf(CFAllocatorRef);
          extern CFTypeRef SecTaskCopyValueForEntitlement(SecTaskRef, CFStringRef, CFErrorRef *);
          extern int csops(pid_t, unsigned int, void *, size_t);

          #define CS_OPS_STATUS            0
          #define CS_OPS_ENTITLEMENTS_BLOB 7

          typedef kern_return_t (*fn_auth)(io_service_t, IOOptionBits);

          static UITextView* g_tv;
          static UILabel* g_hb;
          static NSUInteger g_ticks = 0;
          static dispatch_semaphore_t g_sem;
          static VTCompressionSessionRef g_vt = NULL;
          static int g_opens = 0;

          static void add_line(NSString* s) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  g_tv.text = [g_tv.text stringByAppendingFormat:@"\n%@", s];
                  NSLog(@"PROBE: %@", s);
              });
          }

          static void dump_file(void) {
              NSString* p = [NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory, NSUserDomainMask, YES).firstObject
                  stringByAppendingPathComponent:@"probe.txt"];
              [g_tv.text writeToFile:p atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }

          static NSString* sysctl_str(const char* key) {
              char b[256] = {0}; size_t l = sizeof(b);
              if (sysctlbyname(key, b, &l, NULL, 0) != 0) return @"?";
              return @(b);
          }

          // ---- sygnatura binarnego ----
          static void check_csflags(void) {
              uint32_t f = 0;
              int r = csops(getpid(), CS_OPS_STATUS, &f, sizeof(f));
              if (r != 0) { add_line([NSString stringWithFormat:@"csops status errno=%d", errno]); return; }
              add_line([NSString stringWithFormat:@"csflags=0x%08x", f]);
              add_line([NSString stringWithFormat:@"  platform=%d installer=%d restrict=%d gettaskallow=%d",
                        !!(f & 0x04000000), !!(f & 0x00080000), !!(f & 0x00000800), !!(f & 0x00000004)]);
          }

          static void dump_ent_blob(void) {
              uint8_t buf[8192]; size_t len = sizeof(buf);
              int r = csops(getpid(), CS_OPS_ENTITLEMENTS_BLOB, buf, len);
              if (r != 0) { add_line([NSString stringWithFormat:@"ent blob errno=%d (BRAK = wyciete)", errno]); return; }
              NSMutableString* s = [NSMutableString string];
              for (size_t i = 0; i < len && s.length < 1500; i++) {
                  uint8_t c = buf[i];
                  if (c == '\n') [s appendString:@"\n"];
                  else if (c >= 32 && c < 127) [s appendFormat:@"%c", c];
              }
              add_line(@"--- raw ent blob ---");
              add_line(s.length ? s : @"(pusty)");
          }

          static void check_ent_keys(void) {
              SecTaskRef t = SecTaskCreateFromSelf(kCFAllocatorDefault);
              if (!t) { add_line(@"SecTask nil"); return; }
              const char* keys[] = {
                  "platform-application",
                  "com.apple.private.security.no-container",
                  "com.apple.security.iokit-user-client-class",
                  "application-identifier",
                  "com.apple.developer.team-identifier",
                  "get-task-allow"
              };
              for (int i = 0; i < 6; i++) {
                  CFTypeRef v = SecTaskCopyValueForEntitlement(t, (__bridge CFStringRef)@(keys[i]), NULL);
                  add_line([NSString stringWithFormat:@"ent %s = %@", keys[i],
                            v ? [(__bridge id)v description] : @"nil"]);
                  if (v) CFRelease(v);
              }
              CFRelease(t);
          }

          // ---- VT ----
          static void vt_out(void* r, void* s, OSStatus st, VTEncodeInfoFlags f, CMSampleBufferRef sb) {
              dispatch_semaphore_signal(g_sem);
          }

          static void vt_full(void) {
              g_sem = dispatch_semaphore_create(0);
              OSStatus st = VTCompressionSessionCreate(NULL, 1920, 1080,
                      kCMVideoCodecType_H264, NULL, NULL, NULL, vt_out, NULL, &g_vt);
              add_line([NSString stringWithFormat:@"vt create=%d", (int)st]);
              if (!g_vt) return;
              VTCompressionSessionPrepareToEncodeFrames(g_vt);
              CVPixelBufferRef pb = NULL;
              CVPixelBufferCreate(NULL, 1920, 1080, kCVPixelFormatType_32BGRA, NULL, &pb);
              if (!pb) return;
              VTCompressionSessionEncodeFrame(g_vt, pb, CMTimeMake(1, 30), CMTimeMake(1, 30), NULL, NULL, NULL);
              long w = dispatch_semaphore_wait(g_sem, dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC));
              add_line([NSString stringWithFormat:@"vt encode waited=%ld", w]);
              CVPixelBufferRelease(pb);
          }

          // ---- inspekcja wezla ----
          static void dump_props(io_service_t svc) {
              CFMutableDictionaryRef p = NULL;
              if (IORegistryEntryCreateCFProperties(svc, &p, kCFAllocatorDefault, 0) != KERN_SUCCESS || !p) {
                  add_line(@"  props: brak"); return;
              }
              const char* keys[] = { "IOUserClientClass", "IOKitUserClientAccess",
                                     "IOClass", "IOProviderClass", "CFBundleIdentifier",
                                     "IOKitDebug", "IOUserClientEntitlements" };
              for (int i = 0; i < 7; i++) {
                  CFTypeRef v = CFDictionaryGetValue(p, (__bridge CFStringRef)@(keys[i]));
                  if (!v) continue;
                  NSString* d = [(__bridge id)v description];
                  if (d.length > 300) d = [[d substringToIndex:300] stringByAppendingString:@"…"];
                  add_line([NSString stringWithFormat:@"  %s = %@", keys[i], d]);
              }
              CFRelease(p);
          }

          static void sweep(io_service_t svc, const char* label, fn_auth auth) {
              for (int t = 0; t <= 31; t++) {
                  io_connect_t c = 0;
                  kern_return_t kr = IOServiceOpen(svc, mach_task_self(), (uint32_t)t, &c);
                  if (kr == KERN_SUCCESS) {
                      g_opens++;
                      add_line([NSString stringWithFormat:@"!! %s type=%d OPEN conn=%u", label, t, c]);
                      for (uint64_t sel = 0; sel < 3; sel++) {
                          uint64_t out[8] = {0}; uint32_t oc = 8;
                          kern_return_t sr = IOConnectCallScalarMethod(c, (uint32_t)sel, NULL, 0, out, &oc);
                          add_line([NSString stringWithFormat:@"   sel %llu -> 0x%x", sel, sr]);
                      }
                      continue;
                  }
                  if (t <= 3) add_line([NSString stringWithFormat:@"%s type=%d -> 0x%x", label, t, kr]);
              }
          }

          static void inspect(io_service_t svc, fn_auth auth) {
              io_name_t cls; IOObjectGetClass(svc, cls);
              add_line([NSString stringWithFormat:@"NODE %s", cls]);
              io_service_t par = 0;
              if (IORegistryEntryGetParentEntry(svc, kIOServicePlane, &par) == KERN_SUCCESS) {
                  io_name_t pc; IOObjectGetClass(par, pc);
                  add_line([NSString stringWithFormat:@"  parent %s", pc]);
                  IOObjectRelease(par);
              }
              dump_props(svc);
              if (auth) add_line([NSString stringWithFormat:@"  authorize=0x%x", auth(svc, 0)]);
              sweep(svc, cls, auth);
          }

          static void run_probe(void) {
              add_line(@"[+] probe start");
              add_line([NSString stringWithFormat:@"os=%@ model=%@", sysctl_str("kern.osproductversion"), sysctl_str("hw.model")]);
              check_csflags();
              check_ent_keys();
              dump_ent_blob();

              fn_auth auth = (fn_auth)dlsym(RTLD_DEFAULT, "IOServiceAuthorize");
              add_line(auth ? @"authorize: present" : @"authorize: absent");

              add_line(@"[*] VT warmup");
              vt_full();
              usleep(600000);

              add_line(@"[*] registry scan");
              io_iterator_t it = 0;
              if (IOServiceGetMatchingServices(kIOMainPortDefault, IOServiceMatching("IOService"), &it) != KERN_SUCCESS) {
                  add_line(@"scan failed"); dump_file(); return;
              }
              io_service_t s; int n = 0, hits = 0;
              while ((s = IOIteratorNext(it)) && n < 12000) {
                  io_name_t c; IOObjectGetClass(s, c);
                  NSString* cs = @(c);
                  BOOL match = [cs containsString:@"AVE"] || [cs containsString:@"AVE2"] ||
                               [cs containsString:@"VideoEncoder"] || [cs containsString:@"VideoCodec"] ||
                               [cs containsString:@"AppleH"] ;
                  if (match && hits < 40) { hits++; inspect(s, auth); }
                  IOObjectRelease(s); n++;
              }
              IOObjectRelease(it);
              add_line([NSString stringWithFormat:@"scanned=%d hits=%d opens=%d", n, hits, g_opens]);

              add_line(g_opens ? @"[+] VERDICT: OPENABLE" : @"[-] VERDICT: no open");
              add_line(@"[*] done");
              dump_file();
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 50, 340, 18)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
              g_hb.text = @"alive ticks=0";
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 72; r.size.height -= 80;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot ok";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              [NSTimer scheduledTimerWithTimeInterval:0.5 repeats:YES block:^(NSTimer* t) {
                  g_ticks++;
                  g_hb.text = [NSString stringWithFormat:@"alive ticks=%lu", (unsigned long)g_ticks];
              }];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC),
                             dispatch_get_global_queue(0,0), ^{ run_probe(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          EOF

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: build
        run: |
          mkdir -p out/Payload
          xcodebuild -project probe.xcodeproj -target probe \
            -sdk iphoneos -configuration Release \
            -arch arm64e -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/out/Payload \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_CFLAGS="-Wno-implicit-function-declaration" \
            build

      - name: ipa
        run: |
          ls -la out/Payload
          cd out && zip -r probe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.ipa
          if-no-files-found: error
