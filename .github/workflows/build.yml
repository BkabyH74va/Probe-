          static size_t jpeg_build(uint8_t* b, size_t cap, int trunc) {
              size_t n = 0;
              #define EM(x) do { if (n < cap) b[n++] = (uint8_t)(x); } while (0)
              EM(0xFF); EM(0xD8);
              EM(0xFF); EM(0xE0); EM(0x00); EM(0x10);
              EM('J'); EM('F'); EM('I'); EM('F'); EM(0x00);
              EM(0x01); EM(0x01); EM(0x00); EM(0x00); EM(0x01); EM(0x00); EM(0x01); EM(0x00); EM(0x00);
              EM(0xFF); EM(0xDB); EM(0x00); EM(0x43); EM(0x00);
              for (int i = 0; i < 64; i++) EM(1);
              EM(0xFF); EM(0xC0); EM(0x00); EM(0x11); EM(0x08);
              EM(0x00); EM(0x10); EM(0x00); EM(0x10);
              EM(0x01); EM(0x01); EM(0x11); EM(0x00);
              EM(0xFF); EM(0xC4); EM(0x00); EM(0x14); EM(0x00);
              EM(0x01);
              for (int i = 0; i < 15; i++) EM(0x00);
              EM(0x00);
              EM(0xFF); EM(0xDA); EM(0x00); EM(0x08); EM(0x01); EM(0x01); EM(0x00); EM(0x00); EM(0x3F); EM(0x00);
              for (int i = 0; i < 256; i++) EM((uint8_t)(i & 0x7f));
              #undef EM
              if (trunc > 0 && n > (size_t)trunc) n -= trunc;
              if (trunc == 0) { if (n + 1 < cap) { b[n++] = 0xFF; b[n++] = 0xD9; } }
              return n;
          }

          static uint8_t* g_blob = NULL;
          static size_t g_blobfull = 0;

          static void jpeg_build_step(void) {
              g_blob = calloc(1, BLOB);
              if (!g_blob) { ulog(@"blob nomem"); return; }
              g_blobfull = jpeg_build(g_blob, BLOB, 0);
              plog(@"BLOB full=%zu body=%zu", g_blobfull, g_blobfull - 2);
              ulog(@"BLOB full=%zu", g_blobfull);
          }

          static void jpeg_feed(void) {
              if (!g_blob || g_blobfull < 4) { ulog(@"no blob"); return; }
              size_t body = g_blobfull - 2;
              size_t SZ[9];
              SZ[0] = body;
              SZ[1] = body - 1;
              SZ[2] = body - 2;
              SZ[3] = body - 8;
              SZ[4] = body - 16;
              SZ[5] = body - 64;
              SZ[6] = g_blobfull;
              SZ[7] = 4096;
              SZ[8] = 65536;
              int C[24]; int cn = cand(C, 24);
              for (int si = 0; si < cn; si++) {
                  uint32_t s = (uint32_t)C[si];
                  for (int i = 0; i < 9; i++) {
                      for (uint32_t sic = 1; sic <= 3; sic++) {
                          size_t zis = SZ[i];
                          if (zis > BLOB) zis = BLOB;
                          uint8_t* in = calloc(1, zis);
                          uint64_t sin[SCO] = {0};
                          if (!in) continue;
                          memcpy(in, g_blob, zis < g_blobfull ? zis : g_blobfull);
                          if (zis > g_blobfull) memset(in + g_blobfull, 0x41, zis - g_blobfull);
                          sin[0] = g_hdlvalid ? g_hdl : (uint64_t)zis;
                          for (uint32_t k = 1; k < sic && k < SCO; k++) sin[k] = (k == 1) ? (uint64_t)zis : SV[k % SV_N];
                          uint64_t so[SCO] = {0}; size_t sc = 0;
                          uint8_t sb[BIGOUT]; size_t szb = BIGOUT;
                          memset(sb, AAM, sizeof(sb));
                          kern_return_t kr = rawx(g_conn[g_best], s, 1, sin, sic, in, zis, 1, so, &sc, sb, &szb);
                          __sync_fetch_and_add(&g_jfeed, 1);
                          __sync_fetch_and_add(&g_done, 1);
                          int un = 0;
                          for (size_t q = 0; q < sizeof(sb); q++) if (sb[q] == AAM) un++;
                          plog(@"JF s%u i%d zi=%zu sc_=%u sin0=0x%llx -> %@ sc=%zu szb=%zu un=%d so0=%llu %@",
                               s, i, zis, sic, (unsigned long long)sin[0], kr_name(kr), sc, szb, un, (unsigned long long)so[0], hexn(sb, sizeof(sb), BIGOUT));
                          if (kr == KERN_SUCCESS) {
                              ulog(@"!!! JF s%u i%d zi=%zu sc_=%u OK", s, i, zis, sic);
                              __sync_fetch_and_add(&g_hits, 1);
                              note_ok(s, 1, sic, zis, BIGOUT);
                          } else if (kr != 0xe00002c2 && kr != 0xe00002bc) {
                              ulog(@"!! JF s%u i%d zi=%zu -> %@", s, i, zis, kr_name(kr));
                              mark_resp(s);
                          }
                          if (szb > BIGOUT) {
                              __sync_fetch_and_add(&g_oobw, 1);
                              plog(@"OOBW jf s%u zi=%zu driver=%zu", s, zis, szb);
                          }
                          free(in);
                          usleep(150);
                      }
                  }
              }
              ulog(@"jpeg-feed done n=%d oobw=%d", g_jfeed, g_oobw);
          }

          static void cliff_one(int ci, uint32_t sel) {
              if (g_probes > 480) return;
              uint32_t sic = 1;
              size_t lastbad = 0;
              BOOL havebad = NO;
              size_t firstok = 0;
              for (int z = 0; z < NSZ; z++) {
                  size_t zis = ZS[z];
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[BIGOUT]; size_t szb = BIGOUT;
                  memset(sb, AAM, sizeof(sb));
                  uint64_t sin[SCO] = {0};
                  for (uint32_t k = 0; k < SCO; k++) sin[k] = SV[k % SV_N];
                  inject(sin, sic);
                  uint8_t* in = calloc(1, zis ? zis : 1);
                  if (!in) continue;
                  memset(in, PAT, zis);
                  desc_into(in, zis);
                  int mode = zis ? 1 : 0;
                  kern_return_t kr = rawx(g_conn[ci], sel, mode, sin, sic, in, zis, 1, so, &sc, sb, &szb);
                  __sync_fetch_and_add(&g_probes, 1);
                  int un = 0;
                  for (size_t q = 0; q < sizeof(sb); q++) if (sb[q] == AAM) un++;
                  plog(@"CLP s%u zi=%zu sin0=0x%llx -> %@ sc=%zu szb=%zu un=%d so0=%llu %@", sel, zis, (unsigned long long)sin[0], kr_name(kr), sc, szb, un, (unsigned long long)so[0], hexn(sb, sizeof(sb), BIGOUT));
                  free(in);
                  if (kr == 0xe00002c2) { lastbad = zis; havebad = YES; continue; }
                  mark_resp(sel);
                  if (havebad && firstok == 0 && zis > 0) {
                      firstok = zis;
                      g_cliff[sel] = zis;
                      __sync_fetch_and_add(&g_cliffs, 1);
                      plog(@"CLIFF s%u at %zu (prev BadArg@%zu)", sel, zis, lastbad);
                      ulog(@"### CLIFF s%u @ %zu (bad@%zu)", sel, zis, lastbad);
                      break;
                  }
                  if (zis >= 8192 && un == BIGOUT) {
                      __sync_fetch_and_add(&g_nocopy, 1);
                      plog(@"NOCOPY s%u zi=%zu szb=%zu", sel, zis, szb);
                      ulog(@"### NOCOPY s%u @ %zu szb=%zu", sel, zis, szb);
                  }
                  if (szb > BIGOUT) {
                      __sync_fetch_and_add(&g_oobw, 1);
                      plog(@"OOBW s%u zi=%zu offered=%d driver_szb=%zu", sel, zis, BIGOUT, szb);
                      ulog(@"### OOBW s%u @ %zu szb=%zu", sel, zis, szb);
                  }
                  usleep(150);
              }
              if (!havebad || firstok == 0) return;
              size_t lo = lastbad, hi = firstok;
              while (hi - lo > 1 && g_probes <= 520) {
                  size_t mid = lo + (hi - lo) / 2;
                  uint8_t* in = calloc(1, mid);
                  if (!in) break;
                  memset(in, PAT, mid);
                  desc_into(in, mid);
                  uint64_t sin[SCO] = {0};
                  for (uint32_t k = 0; k < SCO; k++) sin[k] = SV[k % SV_N];
                  inject(sin, sic);
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[BIGOUT]; size_t szb = BIGOUT;
                  memset(sb, AAM, sizeof(sb));
                  kern_return_t kr = rawx(g_conn[ci], sel, 1, sin, 1, in, mid, 1, so, &sc, sb, &szb);
                  __sync_fetch_and_add(&g_probes, 1);
                  plog(@"CLB s%u zi=%zu -> %@", sel, mid, kr_name(kr));
                  free(in);
                  if (kr == 0xe00002c2) lo = mid; else hi = mid;
                  usleep(150);
              }
              g_cliff[sel] = hi;
              plog(@"CLIFFX s%u exact=%zu (bad<=%zu)", sel, hi, lo);
              ulog(@"### CLIFFX s%u exact=%zu bad<=%zu", sel, hi, lo);
          }

          static void cliff_pad(void) {
              if (g_best < 0) { ulog(@"cliff no conn"); return; }
              int C[10]; int cn = cand(C, 10);
              for (int i = 0; i < cn; i++) {
                  uint32_t s = (uint32_t)C[i];
                  ulog(@"cliff s%u start", s);
                  cliff_one(g_best, s);
              }
              plog(@"CLIFFMAP nlive=%d probed=%d cliffs=%d oobw=%d nocopy=%d", g_nlive, g_probes, g_cliffs, g_oobw, g_nocopy);
              ulog(@"CLIFFMAP live=%d probed=%d cliffs=%d oobw=%d nocopy=%d", g_nlive, g_probes, g_cliffs, g_oobw, g_nocopy);
          }

          static void oob_pad(void) {
              if (g_best < 0) { ulog(@"oob no conn"); return; }
              int C[16]; int cn = cand(C, 16);
              for (int i = 0; i < cn; i++) {
                  uint32_t s = (uint32_t)C[i];
                  size_t base = g_cliff[s] ? g_cliff[s] : 4096;
                  static const size_t OFF[5] = { 0, 1, 8, 64, 256 };
                  for (int o = 0; o < 5; o++) {
                      for (uint32_t sic = 0; sic <= 2; sic++) {
                          sc1(g_best, s, sic, 1, base + OFF[o], "oob");
                      }
                  }
              }
              ulog(@"oob done");
          }

          static void seq_test(void) {
              if (g_best < 0) { ulog(@"seq no conn"); return; }
              uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[64]; size_t szb = 0;
              kern_return_t k0 = rawv(g_conn[g_best], 0, 0, NULL, 0, NULL, 0, so, &sc, sb, &szb);
              plog(@"SEQ s0 -> %@", kr_name(k0));
              ulog(@"SEQ s0 -> %@", kr_name(k0));
              for (int rep = 0; rep < 6; rep++) {
                  uint64_t o[SCO] = {0}; size_t c = 0; uint8_t b[128]; size_t z = 0;
                  kern_return_t kr = rawv(g_conn[g_best], 0, 0, NULL, 0, NULL, 0, o, &c, b, &z);
                  plog(@"SEQ2 s0 r%d -> %@", rep, kr_name(kr));
                  ulog(@"SEQ2 s0 r%d -> %@", rep, kr_name(kr));
                  usleep(300);
              }
              uint64_t o2[SCO] = {0}; size_t c2 = 0; uint8_t b2[64]; size_t z2 = 0;
              kern_return_t k2 = rawv(g_conn[g_best], 2, 0, NULL, 0, NULL, 0, o2, &c2, b2, &z2);
              plog(@"SEQ s2 -> %@", kr_name(k2));
              ulog(@"SEQ s2 -> %@", kr_name(k2));
              for (int rep = 0; rep < 4; rep++) {
                  uint64_t o[SCO] = {0}; size_t c = 0; uint8_t b[128]; size_t z = 0;
                  kern_return_t kr = rawv(g_conn[g_best], 0, 0, NULL, 0, NULL, 0, o, &c, b, &z);
                  plog(@"SEQ3 s0 r%d -> %@", rep, kr_name(kr));
                  ulog(@"SEQ3 s0 r%d -> %@", rep, kr_name(kr));
                  usleep(300);
              }
          }

          static void combo_m1(void) {
              surf_make();
              for (uint32_t sic = 0; sic <= 3; sic++) {
                  for (int zi = 0; zi < CSZ_N; zi++) {
                      for (int zo = 0; zo < 2; zo++) {
                          size_t zos = zo ? 4096 : CSZ[zi];
                          uint8_t* in = calloc(1, FIXED);
                          uint64_t sin[SCO] = {0};
                          if (!in) continue;
                          desc_into(in, CSZ[zi]);
                          for (uint32_t k = 0; k < sic && k < SCO; k++) sin[k] = CSZ[zi];
                          char tg[32]; snprintf(tg, sizeof(tg), "a%u.%d.%d", sic, zi, zo);
                          att(tg, 1, sic, CSZ[zi], zos, in, sin);
                          free(in);
                      }
                  }
              }
              ulog(@"combo-m1 att=%d ok4=%d", g_s4_att, g_ok4);
          }

          static void confirm_all(void) {
              if (!g_w4) { ulog(@"no s4 winner"); return; }
              uint8_t* in = calloc(1, FIXED);
              uint64_t sin[SCO] = {0};
              if (!in) return;
              memcpy(in, g_w4_pay, g_w4_zis > FIXED ? FIXED : g_w4_zis);
              memcpy(sin, g_w4_sc, sizeof(uint64_t) * SCO);
              for (int ci = 0; ci < g_nconn; ci++) {
                  uint64_t so[SCO] = {0}; size_t sc = 0; uint8_t sb[FIXED]; size_t szb = 0;
                  kern_return_t kr = rawv(g_conn[ci], 4, 1, sin, g_w4_sic, in, g_w4_zis, so, &sc, sb, &szb);
                  plog(@"CF4 n%d t%u -> %@ so0=%llu szb=%zu", g_node[ci], g_ctype[ci], kr_name(kr), (unsigned long long)so[0], szb);
                  ulog(@"CF4 n%d t%u -> %@", g_node[ci], g_ctype[ci], kr_name(kr));
              }
              free(in);
          }

          static void null_mix(void) {
              if (g_best < 0) { ulog(@"nm no conn"); return; }
              int C[16]; int cn = cand(C, 16);
              for (int i = 0; i < cn; i++) {
                  uint32_t s = (uint32_t)C[i];
                  ulog(@"nm s%u start", s);
                  uint64_t sin[SCO] = {0};
                  inject(sin, 1);
                  uint64_t so[SCO] = {0}; size_t sc = 0;
                  uint8_t sb[BIGOUT]; size_t z2 = BIGOUT;
                  memset(sb, AAM, sizeof(sb));
                  kern_return_t b = rawx(g_conn[g_best], s, 1, sin, 1, NULL, 4096, 1, so, &sc, sb, &z2);
                  plog(@"NM s%u null+4096 -> %@ szb=%zu", s, kr_name(b), z2);
                  ulog(@"NM s%u null+4096 -> %@", s, kr_name(b));
                  usleep(200);
              }
              ulog(@"nm done");
          }

          static void summary(void) {
              NSString* st = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!st) { ulog(@"no state"); return; }
              NSMutableDictionary* hist = [NSMutableDictionary dictionary];
              NSMutableArray* keep = [NSMutableArray array];
              int lines = 0, calls = 0, bad = 0, wins = 0, flips = 0, sigs = 0, opens = 0, cliffs = 0, oobw = 0, nocopy = 0, hd = 0;
              for (NSString* ln in [st componentsSeparatedByString:@"\n"]) {
                  if (!ln.length) continue;
                  lines++;
                  if ([ln hasPrefix:@"WIN4 "]) { wins++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"FLIP9"]) { flips++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"CLIFF"]) { cliffs++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"OOBW "]) { oobw++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"NOCOPY "]) { nocopy++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"SIGNAL "]) { sigs++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"HD "] || [ln hasPrefix:@"HDL "]) { hd++; [keep addObject:ln]; continue; }
                  if ([ln hasPrefix:@"AC "] || [ln hasPrefix:@"CF4 "] || [ln hasPrefix:@"REPLAY"] ||
                      [ln hasPrefix:@"HIST"] || [ln hasPrefix:@"VERDICT"] || [ln hasPrefix:@"STEP "]) {
                      [keep addObject:ln];
                      continue;
                  }
                  if ([ln hasPrefix:@"rootopen"] || [ln hasPrefix:@"CHILDOPEN"] || [ln hasPrefix:@"SVC "] ||
                      [ln hasPrefix:@"PARENT"] || [ln hasPrefix:@"SIB "] || [ln hasPrefix:@"JCLS "] ||
                      [ln hasPrefix:@"PROPS"] || [ln hasPrefix:@"NODE "] || [ln hasPrefix:@"BLOB"] ||
                      [ln hasPrefix:@"SEQ"] || [ln hasPrefix:@"DEV "] || [ln hasPrefix:@"csops"] ||
                      [ln hasPrefix:@"surf="] || [ln hasPrefix:@"svc="] || [ln hasPrefix:@"CLIFFMAP"]) {
                      if ([ln rangeOfString:@"OK"].location != NSNotFound) opens++;
                      [keep addObject:ln];
                      continue;
                  }
                  BOOL isCall = [ln hasPrefix:@"SP "] || [ln hasPrefix:@"S9N "] || [ln hasPrefix:@"JF "] ||
                                [ln hasPrefix:@"CLP "] || [ln hasPrefix:@"CLB "] || [ln hasPrefix:@"S4 "] ||
                                [ln hasPrefix:@"NM "] || [ln hasPrefix:@"P9 "];
                  if (!isCall) continue;
                  calls++;
                  NSRange ar = [ln rangeOfString:@" -> "];
                  if (ar.location == NSNotFound) continue;
                  NSString* rest = [ln substringFromIndex:ar.location + 4];
                  NSString* cls = [[rest componentsSeparatedByString:@" "] firstObject];
                  if (!cls.length) continue;
                  NSNumber* c = hist[cls];
                  hist[cls] = @(c.intValue + 1);
                  if ([cls isEqualToString:@"BadArg"]) bad++;
                  else [keep addObject:ln];
              }
              plog(@"REPLAY lines=%d calls=%d bad=%d nonbad=%lu wins=%d flips=%d sigs=%d opens=%d cliffs=%d oobw=%d nocopy=%d hd=%d",
                   lines, calls, bad, (unsigned long)(calls - bad), wins, flips, sigs, opens, cliffs, oobw, nocopy, hd);
              NSMutableString* h = [NSMutableString string];
              for (NSString* k in [[hist allKeys] sortedArrayUsingSelector:@selector(compare:)])
                  [h appendFormat:@"%@=%d ", k, [hist[k] intValue]];
              plog(@"HIST %@", h);
              ulog(@"REPLAY calls=%d bad=%d nonbad=%lu wins=%d flips=%d cliffs=%d oobw=%d nocopy=%d", calls, bad, (unsigned long)(calls - bad), wins, flips, cliffs, oobw, nocopy);
              ulog(@"HIST %@", h);
              NSUInteger cap = keep.count > 240 ? 240 : keep.count;
              for (NSUInteger i = 0; i < cap; i++) { plog(@"KEEP %@", keep[i]); ulog(@"%@", keep[i]); }
              if (keep.count > cap) ulog(@"... +%lu more", (unsigned long)(keep.count - cap));
          }

          static void verdict(void) {
              NSString* st = [NSString stringWithContentsOfFile:doc_file("state.txt") encoding:NSUTF8StringEncoding error:nil];
              if (!st) { ulog(@"VERDICT no state"); return; }
              NSMutableDictionary* sel = [NSMutableDictionary dictionary];
              for (NSString* ln in [st componentsSeparatedByString:@"\n"]) {
                  NSRange ar = [ln rangeOfString:@" -> "];
                  if (ar.location == NSNotFound) continue;
                  NSString* pre = [ln substringToIndex:ar.location];
                  NSString* rest = [ln substringFromIndex:ar.location + 4];
                  NSString* cls = [[rest componentsSeparatedByString:@" "] firstObject];
                  if (!cls.length) continue;
                  NSArray* t = [pre componentsSeparatedByString:@" "];
                  if (!t.count) continue;
                  NSString* key = [t lastObject];
                  if (!key.length) continue;
                  NSString* k2 = [NSString stringWithFormat:@"%@:%@", key, cls];
                  NSNumber* c = sel[k2];
                  sel[k2] = @(c.intValue + 1);
              }
              NSMutableString* b = [NSMutableString string];
              for (NSString* k in [[sel allKeys] sortedArrayUsingSelector:@selector(compare:)])
                  [b appendFormat:@"%@x%d ", k, [sel[k] intValue]];
              plog(@"VERDICT2 %@", b);
              ulog(@"VERDICT2 %@", b);
          }

          static void do_step(int s) {
              switch (s) {
                  case 0: break;
                  case 1: census(); break;
                  case 2: dump_sig(); break;
                  case 3: dev_info(); break;
                  case 4: tree_up(); break;
                  case 5: svc_open(); break;
                  case 6: dump_tree(); break;
                  case 7: prop_dump(); break;
                  case 8: vt_start(); break;
                  case 9: ulog(@"vt=%d", (int)vt_encode()); break;
                  case 10: root_open(); break;
                  case 11: child_open(); break;
                  case 12: addclient_step(); break;
                  case 13: s0_dump(); break;
                  case 14: scpad_best(); break;
                  case 15: scpad_child(); break;
                  case 16: s9_scalars(); break;
                  case 17: s9_struct(); break;
                  case 18: jpeg_build_step(); break;
                  case 19: jpeg_feed(); break;
                  case 20: cliff_pad(); break;
                  case 21: oob_pad(); break;
                  case 22: seq_test(); break;
                  case 23: combo_m1(); break;
                  case 24: confirm_all(); break;
                  case 25: summary(); break;
                  case 26: verdict(); break;
                  case 27: null_mix(); break;
              }
          }

          static void run(void) {
              latch_build();
              char b[512]; doc_path("state.txt", b, sizeof(b));
              g_fd = open(b, O_CREAT | O_WRONLY | O_APPEND, 0644);
              g_seen = [NSMutableSet set];
              load_state();
              g_step = load_step();

              mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &g_wake);
              mach_port_insert_right(mach_task_self(), g_wake, g_wake, MACH_MSG_TYPE_MAKE_SEND);

              void* ik = dlopen("/System/Library/Frameworks/IOKit.framework/IOKit", RTLD_LAZY);
              g_addclient = (fn_addclient)dlsym(RTLD_DEFAULT, "IOConnectAddClient");
              if (!g_addclient && ik) g_addclient = (fn_addclient)dlsym(ik, "IOConnectAddClient");
              plog(@"addclient sym=%p", (void*)g_addclient);

              plog(@"=== LAUNCH step=%d build=%s wake=0x%x", g_step, BUILD_TAG, g_wake);
              if (g_fd >= 0) fsync(g_fd);
              ulog(@"BUILD %s", BUILD_TAG);
              ulog(@"STEP %d/%d: %s", g_step, STEP_MAX, STEP_NAME[g_step < STEP_MAX+1 ? g_step : STEP_MAX]);

              if (g_step > STEP_MAX) {
                  ulog(@"ALL DONE - replay");
                  summary();
                  verdict();
                  if (g_fd >= 0) fsync(g_fd);
                  close(g_fd); g_fd = -1;
                  return;
              }

              int svc = find_root();
              ulog(@"svc=%d", svc);
              plog(@"svc=%d", svc);
              if (!g_root) { ulog(@"NO ROOT"); g_stop = 1; }

              while (g_step <= STEP_MAX && !g_stop) {
                  load_try();
                  if (g_try >= TRY_MAX) {
                      ulog(@"SKIP %d", g_step);
                      plog(@"SKIP %d", g_step);
                      g_step++; save_step(g_step);
                      usleep(150000);
                      continue;
                  }
                  g_try++; save_try();
                  ulog(@"CHAIN %d %s", g_step, STEP_NAME[g_step]);
                  do_step(g_step);
                  plog(@"STEP %d OK calls=%d hits=%d ok4=%d flip9=%d spad=%d cliffs=%d oobw=%d jf=%d hdl=%d", g_step, g_done, g_hits, g_ok4, g_9flip, g_spad, g_cliffs, g_oobw, g_jfeed, g_hdlvalid);
                  if (g_fd >= 0) fsync(g_fd);
                  ulog(@"STEP %d SURVIVED", g_step);
                  g_step++; save_step(g_step);
                  if (g_step <= STEP_MAX) usleep(350000);
              }

              ulog(@"CHAIN END");
              plog(@"CHAIN END");
              if (g_fd >= 0) fsync(g_fd);
              close(g_fd); g_fd = -1;
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow* w;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication*)a didFinishLaunchingWithOptions:(NSDictionary*)o {
              g_lines = [NSMutableArray array];
              signal(SIGSEGV, sigh); signal(SIGBUS, sigh); signal(SIGABRT, sigh);
              signal(SIGILL, sigh); signal(SIGFPE, sigh);

              self.w = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController* vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.blackColor;

              g_hb = [[UILabel alloc] initWithFrame:CGRectMake(8, 44, 344, 44)];
              g_hb.textColor = UIColor.systemYellowColor;
              g_hb.font = [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightRegular];
              g_hb.numberOfLines = 2;
              g_hb.text = @BUILD_TAG;
              [vc.view addSubview:g_hb];

              CGRect r = vc.view.bounds;
              r.origin.y = 92; r.size.height -= 100;
              g_tv = [[UITextView alloc] initWithFrame:r];
              g_tv.backgroundColor = UIColor.blackColor;
              g_tv.textColor = UIColor.greenColor;
              g_tv.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              g_tv.editable = NO;
              g_tv.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              g_tv.text = @"boot";
              [vc.view addSubview:g_tv];

              self.w.rootViewController = vc;
              [self.w makeKeyAndVisible];

              [NSTimer scheduledTimerWithTimeInterval:0.25 repeats:YES block:^(NSTimer*) {
                  g_hb.text = [NSString stringWithFormat:@"%s step %d/%d sp=%d ok4=%d cl=%d hdl=%d", BUILD_TAG, g_step, STEP_MAX, g_spad, g_ok4, g_cliffs, g_hdlvalid];
                  flush_ui();
              }];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC), dispatch_get_global_queue(0,0), ^{ run(); });
              return YES;
          }
          @end

          int main(int argc, char** argv) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AppDelegate"); }
          }
          MAINEOF

      - name: plist
        run: |
          mkdir -p out/Payload/probe.app
          cat > out/Payload/probe.app/Info.plist <<'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>probe</string>
            <key>CFBundleIdentifier</key><string>com.buurza42.probe</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>probe</string>
            <key>CFBundleDisplayName</key><string>buurd42</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>44</string>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>DTPlatformName</key><string>iphoneos</string>
            <key>DTSDKName</key><string>iphoneos</string>
          </dict></plist>
          PEOF
          plutil -lint out/Payload/probe.app/Info.plist

      - name: syntax
        run: |
          set +e
          xcrun -sdk iphoneos clang -fsyntax-only -x objective-c \
            -target arm64-apple-ios17.0 -fobjc-arc \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -Wno-implicit-function-declaration \
            Sources/main.m > s.log 2>&1
          rc=$?
          set -e
          grep -nE "error:" -A2 s.log | head -60 || true
          tail -5 s.log || true
          exit $rc

      - name: build
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          APP=out/Payload/probe.app
          set +e
          xcrun -sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc \
            -isysroot "$SDK" -O1 \
            -Wno-implicit-function-declaration \
            -framework UIKit -framework Foundation -framework CoreFoundation \
            -framework IOKit -framework VideoToolbox -framework CoreMedia \
            -framework CoreVideo -framework Security \
            Sources/main.m -o "$APP/probe" > c.log 2>&1
          rc=$?
          set -e
          echo "=== cc rc=$rc ==="
          grep -nE "error:|undefined|Undefined" c.log | head -40 || true
          tail -15 c.log || true
          echo "=== end ==="
          test $rc -eq 0
          chmod +x "$APP/probe"
          file "$APP/probe"
          ls -la "$APP"

      - name: ipa
        run: |
          set -euo pipefail
          test -f out/Payload/probe.app/probe || { echo "NO BINARY"; ls -la out/Payload/probe.app; exit 1; }
          test -f out/Payload/probe.app/Info.plist || { echo "NO PLIST"; exit 1; }
          cd out
          rm -f probe.ipa
          zip -r -q probe.ipa Payload
          test -s probe.ipa || { echo "ZIP EMPTY"; exit 1; }
          cd ..
          stat -f "ipa bytes=%z" out/probe.ipa
          shasum -a 256 out/probe.ipa
          unzip -l out/probe.ipa

      - uses: actions/upload-artifact@v4.6.2
        continue-on-error: true
        with:
          name: probe-ipa-${{ github.run_number }}-${{ github.run_attempt }}
          path: out/probe.ipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
